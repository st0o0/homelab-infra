services:
  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.9.0
    container_name: pve-exporter
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command:
      - --config.file=/etc/pve-exporter/pve.yml
      - --no-collector.config
    environment:
      - PVE_USER=${ALLOY_PVE_USER:-monitoring@pve}
      - PVE_TOKEN_NAME=${ALLOY_PVE_TOKEN_NAME:-monitoring}
      - PVE_TOKEN_VALUE=${ALLOY_PVE_TOKEN_VALUE:?ALLOY_PVE_TOKEN_VALUE is required}
      - PVE_VERIFY_SSL=${ALLOY_PVE_VERIFY_SSL:-false}
    volumes:
      - ./pve.yml:/etc/pve-exporter/pve.yml:ro
    deploy:
      resources:
        limits:
          cpus: 0.10
          memory: 64M
        reservations:
          memory: 32M
