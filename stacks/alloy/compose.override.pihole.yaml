services:
  alloy:
    depends_on:
      pihole-exporter:
        condition: service_started
    volumes:
      - ./alloy/features/pihole.alloy:/etc/alloy/pihole.alloy
    environment:
      - PIHOLE_METRICS_TARGET=${ALLOY_PIHOLE_METRICS_TARGET:-pihole-exporter:9617}

  pihole-exporter:
    image: ekofr/pihole-exporter:v1.2.0
    container_name: pihole-exporter
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      # Comma-separated for multi-instance: host1,host2,host3
      - PIHOLE_HOSTNAME=${ALLOY_PIHOLE_EXPORTER_HOSTNAME:?ALLOY_PIHOLE_EXPORTER_HOSTNAME is required}
      # Comma-separated matching PIHOLE_HOSTNAME order, or single value for all
      - PIHOLE_PASSWORD=${ALLOY_PIHOLE_EXPORTER_PASSWORD:?ALLOY_PIHOLE_EXPORTER_PASSWORD is required}
      - PIHOLE_PORT=${ALLOY_PIHOLE_EXPORTER_PORT:-80}
      - PIHOLE_PROTOCOL=${ALLOY_PIHOLE_EXPORTER_PROTOCOL:-http}
      - PORT=9617
    deploy:
      resources:
        limits:
          cpus: 0.10
          memory: 64M
        reservations:
          memory: 32M
