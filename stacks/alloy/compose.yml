x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  geoipupdate:
    image: maxmindinc/geoipupdate:v7@sha256:faecdca22579730ab0b7dea5aa9af350bb3c93cb9d39845c173639ead30346d2
    container_name: geoipupdate
    restart: unless-stopped
    logging: *default-logging
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID:?GEOIPUPDATE_ACCOUNT_ID is required}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY:?GEOIPUPDATE_LICENSE_KEY is required}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-City
      - GEOIPUPDATE_FREQUENCY=${GEOIPUPDATE_FREQUENCY:-24}
    volumes:
      - geoip-data:/usr/share/GeoIP
    healthcheck:
      test: ["CMD", "test", "-f", "/usr/share/GeoIP/GeoLite2-City.mmdb"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          memory: 32M

  alloy:
    image: grafana/alloy:v1.19.1@sha256:7a3b03064dcea51f2e867ee8a8b26ece6d1007ec37dbea26f7e3b71966d87bc9
    container_name: alloy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      geoipupdate:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
      - --stability.level=experimental
    environment:
      - HOST_HOSTNAME=${ALLOY_HOSTNAME:-}
      - SCRAPE_INTERVAL=${ALLOY_SCRAPE_INTERVAL:-30s}
      - REMOTE_WRITE_URL=${ALLOY_REMOTE_WRITE_URL:?ALLOY_REMOTE_WRITE_URL is required}
      - LOGS_PUSH_URL=${ALLOY_LOGS_PUSH_URL:?ALLOY_LOGS_PUSH_URL is required}
      - SECURITY_LOGS_ENABLED=${ALLOY_SECURITY_LOGS_ENABLED:-false}
      - GOGC=${ALLOY_GOGC:-100}
      - GOMAXPROCS=${ALLOY_GOMAXPROCS:-}
      - CADVISOR_DOCKER_ONLY=${ALLOY_CADVISOR_DOCKER_ONLY:-false}
      - CADVISOR_STORE_LABELS=${ALLOY_CADVISOR_STORE_LABELS:-true}
    privileged: true
    volumes:
      - ./alloy:/etc/alloy
      - ../../alloy/modules:/etc/alloy/modules:ro
      - alloy-data:/var/lib/alloy/data
      - geoip-data:/geoip:ro
      - /var/log:/var/log/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /var/run:/var/run
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: 768M
        reservations:
          memory: 256M

volumes:
  alloy-data:
  geoip-data:
