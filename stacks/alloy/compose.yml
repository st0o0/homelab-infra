x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: alloy
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - /etc/alloy/
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      - HOST_HOSTNAME=${ALLOY_HOSTNAME:-}
      - SCRAPE_INTERVAL=${ALLOY_SCRAPE_INTERVAL:-30s}
      - REMOTE_WRITE_URL=${ALLOY_REMOTE_WRITE_URL:?ALLOY_REMOTE_WRITE_URL is required}
      - LOGS_PUSH_URL=${ALLOY_LOGS_PUSH_URL:?ALLOY_LOGS_PUSH_URL is required}
      - NUT_ENABLED=${ALLOY_NUT_ENABLED:-false}
      - NUT_EXPORTER_TARGET=${ALLOY_NUT_EXPORTER_TARGET:-}
      - SECURITY_LOGS_ENABLED=${ALLOY_SECURITY_LOGS_ENABLED:-false}
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/log:/var/log/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: 256M
        reservations:
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: cadvisor
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:alloy
    command:
      - --housekeeping_interval=${CADVISOR_HOUSEKEEPING_INTERVAL:-30s}
      - --docker_only=${CADVISOR_DOCKER_ONLY:-true}
      - --disable_metrics=${CADVISOR_DISABLE_METRICS:-advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          cpus: 0.10
          memory: 128M
        reservations:
          memory: 32M

volumes:
  alloy-data:
