x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: alloy
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - /etc/alloy/
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    environment:
      - HOST_HOSTNAME=${ALLOY_HOSTNAME:-}
      - SCRAPE_INTERVAL=${ALLOY_SCRAPE_INTERVAL:-30s}
      - REMOTE_WRITE_URL=${ALLOY_REMOTE_WRITE_URL:?ALLOY_REMOTE_WRITE_URL is required}
      - LOGS_PUSH_URL=${ALLOY_LOGS_PUSH_URL:?ALLOY_LOGS_PUSH_URL is required}
      - SECURITY_LOGS_ENABLED=${ALLOY_SECURITY_LOGS_ENABLED:-false}
      - GOGC=${ALLOY_GOGC:-100}
      - GOMEMLIMIT=${ALLOY_GOMEMLIMIT:-}
      - GOMAXPROCS=${ALLOY_GOMAXPROCS:-}
      - CADVISOR_DOCKER_ONLY=${ALLOY_CADVISOR_DOCKER_ONLY:-false}
      - CADVISOR_STORE_LABELS=${ALLOY_CADVISOR_STORE_LABELS:-true}
    privileged: true
    volumes:
      - ./alloy:/etc/alloy
      - ../../alloy/modules:/etc/alloy/modules:ro
      - alloy-data:/var/lib/alloy/data
      - /var/log:/var/log/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /var/run:/var/run
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: 512M
        reservations:
          memory: 256M

volumes:
  alloy-data:
