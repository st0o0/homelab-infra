x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: alloy
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - /etc/alloy/
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      - HOST_HOSTNAME=${ALLOY_HOSTNAME:-}
      - SCRAPE_INTERVAL=${ALLOY_SCRAPE_INTERVAL:-30s}
      - REMOTE_WRITE_URL=${ALLOY_REMOTE_WRITE_URL:?ALLOY_REMOTE_WRITE_URL is required}
      - LOGS_PUSH_URL=${ALLOY_LOGS_PUSH_URL:?ALLOY_LOGS_PUSH_URL is required}
      - NUT_ENABLED=${ALLOY_NUT_ENABLED:-false}
      - NUT_EXPORTER_TARGET=${ALLOY_NUT_EXPORTER_TARGET:-}
      - SECURITY_LOGS_ENABLED=${ALLOY_SECURITY_LOGS_ENABLED:-false}
      - PVE_METRICS_ENABLED=${ALLOY_PVE_METRICS_ENABLED:-false}
      - PVE_EXPORTER_TARGET=${ALLOY_PVE_EXPORTER_TARGET:-localhost:9221}
      - PVE_HOST=${ALLOY_PVE_HOST:-}
      - POSTGRES_METRICS_ENABLED=${ALLOY_POSTGRES_METRICS_ENABLED:-false}
      - POSTGRES_DSN=${ALLOY_POSTGRES_DSN:-}
      - IMMICH_POSTGRES_DSN=${ALLOY_IMMICH_POSTGRES_DSN:-}
      - REDIS_METRICS_ENABLED=${ALLOY_REDIS_METRICS_ENABLED:-false}
      - REDIS_ADDR=${ALLOY_REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${ALLOY_REDIS_PASSWORD:-}
      - MONGODB_METRICS_ENABLED=${ALLOY_MONGODB_METRICS_ENABLED:-false}
      - MONGODB_URI=${ALLOY_MONGODB_URI:-}
      - PIHOLE_METRICS_ENABLED=${ALLOY_PIHOLE_METRICS_ENABLED:-false}
      - PIHOLE_METRICS_TARGET=${ALLOY_PIHOLE_METRICS_TARGET:-localhost:9617}
      - AUTHENTIK_METRICS_ENABLED=${ALLOY_AUTHENTIK_METRICS_ENABLED:-false}
      - AUTHENTIK_METRICS_TARGET=${ALLOY_AUTHENTIK_METRICS_TARGET:-authentik-server:9300}
      - BACKREST_METRICS_ENABLED=${ALLOY_BACKREST_METRICS_ENABLED:-false}
      - BACKREST_METRICS_TARGET=${ALLOY_BACKREST_METRICS_TARGET:-backrest:9898}
      - VAULTWARDEN_METRICS_ENABLED=${ALLOY_VAULTWARDEN_METRICS_ENABLED:-false}
      - VAULTWARDEN_METRICS_TARGET=${ALLOY_VAULTWARDEN_METRICS_TARGET:-vaultwarden:80}
      - VAULTWARDEN_METRICS_TOKEN=${ALLOY_VAULTWARDEN_METRICS_TOKEN:-}
      - IMMICH_METRICS_ENABLED=${ALLOY_IMMICH_METRICS_ENABLED:-false}
      - IMMICH_METRICS_SERVER_TARGET=${ALLOY_IMMICH_METRICS_SERVER_TARGET:-immich-server:8081}
      - IMMICH_METRICS_MICROSERVICES_TARGET=${ALLOY_IMMICH_METRICS_MICROSERVICES_TARGET:-immich-server:8082}
      - JELLYFIN_METRICS_ENABLED=${ALLOY_JELLYFIN_METRICS_ENABLED:-false}
      - JELLYFIN_METRICS_TARGET=${ALLOY_JELLYFIN_METRICS_TARGET:-jellyfin:8096}
      - HOMEASSISTANT_METRICS_ENABLED=${ALLOY_HOMEASSISTANT_METRICS_ENABLED:-false}
      - HOMEASSISTANT_METRICS_TARGET=${ALLOY_HOMEASSISTANT_METRICS_TARGET:-homeassistant:8123}
      - HOMEASSISTANT_METRICS_TOKEN=${ALLOY_HOMEASSISTANT_METRICS_TOKEN:-}
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/log:/var/log/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: 256M
        reservations:
          memory: 128M

volumes:
  alloy-data:
