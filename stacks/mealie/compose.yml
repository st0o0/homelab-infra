x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.24.0@sha256:0b08ac3a9f0a65b8298bcb3a9fcb596f870f92fbefbecd8fffe075fa9b6d2d5d
    container_name: mealie
    restart: always
    logging: *default-logging
    ports:
      - "${MEALIE_PORT:-9925}:9000"
    volumes:
      - ${MEALIE_PATH_DATA:?MEALIE_PATH_DATA is required}:/app/data/
    environment:
      - ALLOW_SIGNUP=${MEALIE_ALLOW_SIGNUP:-false}
      - ALLOW_PASSWORD_LOGIN=${MEALIE_ALLOW_PASSWORD_LOGIN:-false}
      - BASE_URL=${MEALIE_BASE_URL:-}
      - PUID=${PUID:-}
      - PGID=${PGID:-}
      - TZ=${TZ:-}
      # OIDC
      - OIDC_AUTH_ENABLED=${MEALIE_OIDC_ENABLED:-}
      - OIDC_PROVIDER_NAME=${MEALIE_OIDC_PROVIDER_NAME:-}
      - OIDC_CONFIGURATION_URL=${MEALIE_OIDC_CONFIG_URL:-}
      - OIDC_CLIENT_ID=${MEALIE_OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${MEALIE_OIDC_CLIENT_SECRET:-}
      - OIDC_SIGNUP_ENABLED=${MEALIE_OIDC_SIGNUP_ENABLED:-}
      - OIDC_USER_GROUP=${MEALIE_OIDC_USER_GROUP:-}
      - OIDC_ADMIN_GROUP=${MEALIE_OIDC_ADMIN_GROUP:-}
      - OIDC_AUTO_REDIRECT=${MEALIE_OIDC_AUTO_REDIRECT:-}
      - OIDC_REMEMBER_ME=${MEALIE_OIDC_REMEMBER_ME:-}
      - OIDC_GROUPS_CLAIM=${MEALIE_OIDC_GROUPS_CLAIM:-groups}
      - OIDC_USER_CLAIM=${MEALIE_OIDC_USER_CLAIM:-email}
      # Database
      - DB_ENGINE=postgres
      - POSTGRES_SERVER=${MEALIE_DB_HOST:?MEALIE_DB_HOST is required}
      - POSTGRES_PORT=${MEALIE_DB_PORT:?MEALIE_DB_PORT is required}
      - POSTGRES_USER=${MEALIE_DB_USER:?MEALIE_DB_USER is required}
      - POSTGRES_PASSWORD=${MEALIE_DB_PASS:?MEALIE_DB_PASS is required}
      - POSTGRES_DB=${MEALIE_DB_NAME:?MEALIE_DB_NAME is required}
      # Email
      - SMTP_HOST=${MEALIE_EMAIL_HOST:-}
      - SMTP_PORT=${MEALIE_EMAIL_PORT:-}
      - SMTP_USER=${MEALIE_EMAIL_USER:-}
      - SMTP_PASSWORD=${MEALIE_EMAIL_PASS:-}
      - SMTP_FROM_EMAIL=${MEALIE_EMAIL_FROM:-}
      - SMTP_AUTH_STRATEGY=${MEALIE_EMAIL_AUTH_STRATEGY:-TLS}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/api/app/about"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          memory: 256M
