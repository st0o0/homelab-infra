x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.22.0
    container_name: mealie
    restart: always
    logging: *default-logging
    ports:
      - "${MEALIE_PORT:-9925}:9000"
    volumes:
      - ${MEALIE_PATH_DATA:?MEALIE_PATH_DATA is required}:/app/data/
    environment:
      - ALLOW_SIGNUP=${MEALIE_ALLOW_SIGNUP:-false}
      - ALLOW_PASSWORD_LOGIN=${MEALIE_ALLOW_PASSWORD_LOGIN:-false}
      - BASE_URL=${MEALIE_BASE_URL:-}
      - PUID=${PUID:-}
      - PGID=${PGID:-}
      - TZ=${TZ:-}
      # OIDC
      - OIDC_AUTH_ENABLED=${MEALIE_OIDC_ENABLED:-}
      - OIDC_PROVIDER_NAME=${MEALIE_OIDC_PROVIDER_NAME:-}
      - OIDC_CONFIGURATION_URL=${MEALIE_OIDC_CONFIG_URL:-}
      - OIDC_CLIENT_ID=${MEALIE_OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${MEALIE_OIDC_CLIENT_SECRET:-}
      - OIDC_SIGNUP_ENABLED=${MEALIE_OIDC_SIGNUP_ENABLED:-}
      - OIDC_USER_GROUP=${MEALIE_OIDC_USER_GROUP:-}
      - OIDC_ADMIN_GROUP=${MEALIE_OIDC_ADMIN_GROUP:-}
      - OIDC_AUTO_REDIRECT=${MEALIE_OIDC_AUTO_REDIRECT:-}
      - OIDC_REMEMBER_ME=${MEALIE_OIDC_REMEMBER_ME:-}
      # Database
      - DB_ENGINE=postgres
      - POSTGRES_USER=${MEALIE_DB_USER:-}
      - POSTGRES_PASSWORD=${MEALIE_DB_PASS:?MEALIE_DB_PASS is required}
      - POSTGRES_SERVER=${MEALIE_DB_HOST:?MEALIE_DB_HOST is required}
      - POSTGRES_PORT=${MEALIE_DB_PORT:-}
      - POSTGRES_DB=${MEALIE_DB_NAME:-}
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          memory: 256M
