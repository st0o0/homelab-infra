x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  databasus:
    image: databasus/databasus:v3.68.0@sha256:068d97575f49abf01a3184c9d7987a1a5ec188e6d10150157fcbdc515fd8fb94
    container_name: databasus
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TZ=${TZ:-Europe/Berlin}
    ports:
      - "${DATABASUS_PORT:-4005}:4005"
    volumes:
      - ${DATABASUS_PATH_DATA:?DATABASUS_PATH_DATA is required}:/databasus-data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "databasus", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 64M

networks:
  db-net:
    external: true
