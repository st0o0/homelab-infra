x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  environment: &common-env
    TZ: ${TZ:-}

services:
  sonarr:
    <<: *common
    image: ghcr.io/home-operations/sonarr:4.0.19.3001
    container_name: sonarr
    user: "${PUID}:${PGID}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      <<: *common-env
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:?SONARR_API_KEY is required}
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
      SONARR__POSTGRES__HOST: ${SONARR_POSTGRES_HOST:?SONARR_POSTGRES_HOST is required}
      SONARR__POSTGRES__PORT: ${SONARR_POSTGRES_PORT:?SONARR_POSTGRES_PORT is required}
      SONARR__POSTGRES__USER: ${SONARR_POSTGRES_USER:?SONARR_POSTGRES_USER is required}
      SONARR__POSTGRES__PASSWORD: ${SONARR_POSTGRES_PASS:?SONARR_POSTGRES_PASS is required}
      SONARR__POSTGRES__MAINDB: ${SONARR_POSTGRES_MAINDB:-sonarr-main}
      SONARR__POSTGRES__LOGDB: ${SONARR_POSTGRES_LOGDB:-sonarr-log}
    ports:
      - "${SONARR_PORT:-8989}:8989"
    volumes:
      - media_smb:${ARR_MEDIA_PATH:-/data/media}
      - ${SONARR_PATH_CONFIG:-./sonarr/config}:/config
    networks:
      - arr
      - media
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          memory: 256M

  radarr:
    <<: *common
    image: ghcr.io/home-operations/radarr:6.4.1.10545
    container_name: radarr
    user: "${PUID}:${PGID}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      <<: *common-env
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:?RADARR_API_KEY is required}
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
      RADARR__POSTGRES__HOST: ${RADARR_POSTGRES_HOST:?RADARR_POSTGRES_HOST is required}
      RADARR__POSTGRES__PORT: ${RADARR_POSTGRES_PORT:?RADARR_POSTGRES_PORT is required}
      RADARR__POSTGRES__USER: ${RADARR_POSTGRES_USER:?RADARR_POSTGRES_USER is required}
      RADARR__POSTGRES__PASSWORD: ${RADARR_POSTGRES_PASS:?RADARR_POSTGRES_PASS is required}
      RADARR__POSTGRES__MAINDB: ${RADARR_POSTGRES_MAINDB:-radarr-main}
      RADARR__POSTGRES__LOGDB: ${RADARR_POSTGRES_LOGDB:-radarr-log}
    ports:
      - "${RADARR_PORT:-7878}:7878"
    volumes:
      - media_smb:${ARR_MEDIA_PATH:-/data/media}
      - ${RADARR_PATH_CONFIG:-./radarr/config}:/config
    networks:
      - arr
      - media
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          memory: 256M

  prowlarr:
    <<: *common
    image: ghcr.io/home-operations/prowlarr:2.6.1.5509
    container_name: prowlarr
    user: "${PUID}:${PGID}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      <<: *common-env
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY:?PROWLARR_API_KEY is required}
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
      PROWLARR__POSTGRES__HOST: ${PROWLARR_POSTGRES_HOST:?PROWLARR_POSTGRES_HOST is required}
      PROWLARR__POSTGRES__PORT: ${PROWLARR_POSTGRES_PORT:?PROWLARR_POSTGRES_PORT is required}
      PROWLARR__POSTGRES__USER: ${PROWLARR_POSTGRES_USER:?PROWLARR_POSTGRES_USER is required}
      PROWLARR__POSTGRES__PASSWORD: ${PROWLARR_POSTGRES_PASS:?PROWLARR_POSTGRES_PASS is required}
      PROWLARR__POSTGRES__MAINDB: ${PROWLARR_POSTGRES_MAINDB:-prowlarr-main}
      PROWLARR__POSTGRES__LOGDB: ${PROWLARR_POSTGRES_LOGDB:-prowlarr-log}
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    volumes:
      - ${PROWLARR_PATH_CONFIG:-./prowlarr/config}:/config
    networks:
      - arr
      - media
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 256M
        reservations:
          memory: 128M

  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:v3.4.0
    container_name: seerr
    user: "${PUID}:${PGID}"
    init: true
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    environment:
      <<: *common-env
      LOG_LEVEL: ${SEERR_LOG_LEVEL:-info}
      PORT: 5055
      DB_TYPE: ${SEERR_DB_TYPE:-postgres}
      DB_HOST: ${SEERR_DB_HOST:?SEERR_DB_HOST is required}
      DB_PORT: ${SEERR_DB_PORT:?SEERR_DB_PORT is required}
      DB_USER: ${SEERR_DB_USER:?SEERR_DB_USER is required}
      DB_PASS: ${SEERR_DB_PASS:?SEERR_DB_PASS is required}
      DB_NAME: ${SEERR_DB_NAME:-seerr}
    ports:
      - "${SEERR_PORT:-5055}:5055"
    volumes:
      - ${SEERR_PATH_CONFIG:-./seerr/config}:/app/config
    networks:
      - arr
      - media
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          memory: 256M

  seekarr:
    <<: *common
    image: ghcr.io/scottrobertson/seekarr:0.3.0
    container_name: seekarr
    user: "${PUID}:${PGID}"
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    volumes:
      - ${SEEKARR_PATH:-./seekarr}:/seekarr
    networks:
      - arr
    deploy:
      resources:
        limits:
          cpus: 0.1
          memory: 128M
        reservations:
          memory: 64M

  configarr:
    image: ghcr.io/raydak-labs/configarr:1.30.2
    container_name: configarr
    restart: "no"
    logging: *default-logging
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    environment:
      <<: *common-env
      SONARR_API_URL: ${SONARR_API_URL:-http://sonarr:8989}
      RADARR_API_URL: ${RADARR_API_URL:-http://radarr:7878}
      SONARR_API_KEY: ${SONARR_API_KEY:?SONARR_API_KEY is required}
      RADARR_API_KEY: ${RADARR_API_KEY:?RADARR_API_KEY is required}
    volumes:
      - ${CONFIGARR_PATH_CONFIG:-./configarr}:/app/config
    networks:
      - arr
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 256M
        reservations:
          memory: 128M

  youtarr-db:
    <<: *common
    image: mariadb:10.11
    container_name: youtarr-db
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      MARIADB_ROOT_PASSWORD: ${YOUTARR_DB_ROOT_PASSWORD:?YOUTARR_DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${YOUTARR_DB_NAME:-youtarr}
      MARIADB_USER: ${YOUTARR_DB_USER:-youtarr}
      MARIADB_PASSWORD: ${YOUTARR_DB_PASSWORD:?YOUTARR_DB_PASSWORD is required}
    volumes:
      - ${YOUTARR_DB_PATH:-./data/youtarr/db}:/var/lib/mysql
    networks:
      - arr
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          memory: 256M

  youtarr:
    <<: *common
    image: dialmaster/youtarr:latest@sha256:efaf50773911b99880854a885791766fc5426766c94734dc69d84111873d053d
    container_name: youtarr
    depends_on:
      youtarr-db:
        condition: service_healthy
    environment:
      <<: *common-env
      DB_HOST: youtarr-db
      DB_PORT: "3306"
      DB_USER: ${YOUTARR_DB_USER:-youtarr}
      DB_PASSWORD: ${YOUTARR_DB_PASSWORD:?YOUTARR_DB_PASSWORD is required}
      DB_NAME: ${YOUTARR_DB_NAME:-youtarr}
      YOUTARR_UID: ${PUID:-1000}
      YOUTARR_GID: ${PGID:-1000}
    ports:
      - "${YOUTARR_PORT:-3087}:3011"
    volumes:
      - ${YOUTARR_PATH_CONFIG:-./data/youtarr/config}:/app/config
      - ${YOUTARR_PATH_JOBS:-./data/youtarr/jobs}:/app/jobs
      - ${YOUTARR_PATH_DOWNLOADS:-/mnt/ssd/Videos}:/usr/src/app/data
      - ${YOUTARR_PATH_IMAGES:-./data/youtarr/images}:/app/server/images
    networks:
      - arr
      - media
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          memory: 256M

networks:
  arr:
    name: arr-net
  media:
    name: media-net
    external: true

volumes:
  media_smb:
    driver: local
    driver_opts:
      type: cifs
      device: "//${CIFS_MEDIA_HOST:?CIFS_MEDIA_HOST is required}/${CIFS_MEDIA_SHARE:?CIFS_MEDIA_SHARE is required}"
      o: "username=${CIFS_MEDIA_USER:?CIFS_MEDIA_USER is required},password=${CIFS_MEDIA_PASS:?CIFS_MEDIA_PASS is required},vers=3.0,uid=${PUID:-1000},gid=${PGID:-1000}"
