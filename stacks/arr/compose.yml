x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  environment: &common-env
    TZ: ${TZ:-}

services:
  sonarr:
    <<: *common
    image: ghcr.io/sonarr/sonarr:4.0.19.2979
    container_name: arr-sonarr
    user: "${PUID}:${PGID}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      <<: *common-env
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:?SONARR_API_KEY is required}
      SONARR__POSTGRES__HOST: ${SONARR_POSTGRES_HOST:?SONARR_POSTGRES_HOST is required}
      SONARR__POSTGRES__PORT: ${SONARR_POSTGRES_PORT:?SONARR_POSTGRES_PORT is required}
      SONARR__POSTGRES__USER: ${SONARR_POSTGRES_USER:?SONARR_POSTGRES_USER is required}
      SONARR__POSTGRES__PASSWORD: ${SONARR_POSTGRES_PASS:?SONARR_POSTGRES_PASS is required}
      SONARR__POSTGRES__MAINDB: ${SONARR_POSTGRES_MAINDB:-sonarr-main}
      SONARR__POSTGRES__LOGDB: ${SONARR_POSTGRES_LOGDB:-sonarr-log}
    ports:
      - "${SONARR_PORT:-1089}:8989"
    volumes:
      - media_smb:${ARR_MEDIA_PATH:-/data/media}
      - ${SONARR_PATH_CONFIG:-./sonarr/config}:/config
    networks:
      - arr
      - media

  radarr:
    <<: *common
    image: ghcr.io/radarr/radarr:6.3.0.10514
    container_name: arr-radarr
    user: "${PUID}:${PGID}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      <<: *common-env
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:?RADARR_API_KEY is required}
      RADARR__POSTGRES__HOST: ${RADARR_POSTGRES_HOST:?RADARR_POSTGRES_HOST is required}
      RADARR__POSTGRES__PORT: ${RADARR_POSTGRES_PORT:?RADARR_POSTGRES_PORT is required}
      RADARR__POSTGRES__USER: ${RADARR_POSTGRES_USER:?RADARR_POSTGRES_USER is required}
      RADARR__POSTGRES__PASSWORD: ${RADARR_POSTGRES_PASS:?RADARR_POSTGRES_PASS is required}
      RADARR__POSTGRES__MAINDB: ${RADARR_POSTGRES_MAINDB:-radarr-main}
      RADARR__POSTGRES__LOGDB: ${RADARR_POSTGRES_LOGDB:-radarr-log}
    ports:
      - "${RADARR_PORT:-1078}:7878"
    volumes:
      - media_smb:${ARR_MEDIA_PATH:-/data/media}
      - ${RADARR_PATH_CONFIG:-./radarr/config}:/config
    networks:
      - arr
      - media

  prowlarr:
    <<: *common
    image: ghcr.io/prowlarr/prowlarr:2.5.2.5491
    container_name: arr-prowlarr
    user: "${PUID}:${PGID}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      <<: *common-env
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY:?PROWLARR_API_KEY is required}
      PROWLARR__POSTGRES__HOST: ${PROWLARR_POSTGRES_HOST:?PROWLARR_POSTGRES_HOST is required}
      PROWLARR__POSTGRES__PORT: ${PROWLARR_POSTGRES_PORT:?PROWLARR_POSTGRES_PORT is required}
      PROWLARR__POSTGRES__USER: ${PROWLARR_POSTGRES_USER:?PROWLARR_POSTGRES_USER is required}
      PROWLARR__POSTGRES__PASSWORD: ${PROWLARR_POSTGRES_PASS:?PROWLARR_POSTGRES_PASS is required}
      PROWLARR__POSTGRES__MAINDB: ${PROWLARR_POSTGRES_MAINDB:-prowlarr-main}
      PROWLARR__POSTGRES__LOGDB: ${PROWLARR_POSTGRES_LOGDB:-prowlarr-log}
    ports:
      - "${PROWLARR_PORT:-1096}:9696"
    volumes:
      - ${PROWLARR_PATH_CONFIG:-./prowlarr/config}:/config
    networks:
      - arr
      - media

  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:v3.4.0
    container_name: arr-seerr
    init: true
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    environment:
      <<: *common-env
      LOG_LEVEL: ${SEERR_LOG_LEVEL:-info}
      PORT: 5055
      DB_TYPE: ${SEERR_DB_TYPE:-postgres}
      DB_HOST: ${SEERR_DB_HOST:?SEERR_DB_HOST is required}
      DB_PORT: ${SEERR_DB_PORT:?SEERR_DB_PORT is required}
      DB_USER: ${SEERR_DB_USER:?SEERR_DB_USER is required}
      DB_PASS: ${SEERR_DB_PASS:?SEERR_DB_PASS is required}
      DB_NAME: ${SEERR_DB_NAME:-seerr}
    ports:
      - "${SEERR_PORT:-1055}:5055"
    volumes:
      - ${SEERR_PATH_CONFIG:-./seerr/config}:/app/config
    networks:
      - arr

  seekarr:
    <<: *common
    image: ghcr.io/scottrobertson/seekarr:0.3.0
    container_name: arr-seekarr
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    volumes:
      - ${SEEKARR_PATH_CONFIG:-./seekarr/config.yml}:/seekarr/config.yml:ro
      - ${SEEKARR_PATH_DATA:-./seekarr/data}:/seekarr/data
    networks:
      - arr

  sonarr-exporter:
    <<: *common
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    container_name: arr-sonarr-exporter
    command: ["sonarr"]
    depends_on:
      sonarr:
        condition: service_healthy
    environment:
      <<: *common-env
      PORT: "9707"
      URL: ${SONARR_API_URL:-http://sonarr:8989}
      API_KEY: ${SONARR_API_KEY:?SONARR_API_KEY is required}
    networks:
      - arr

  radarr-exporter:
    <<: *common
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    container_name: arr-radarr-exporter
    command: ["radarr"]
    depends_on:
      radarr:
        condition: service_healthy
    environment:
      <<: *common-env
      PORT: "9708"
      URL: ${RADARR_API_URL:-http://radarr:7878}
      API_KEY: ${RADARR_API_KEY:?RADARR_API_KEY is required}
    networks:
      - arr

  prowlarr-exporter:
    <<: *common
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    container_name: arr-prowlarr-exporter
    command: ["prowlarr"]
    depends_on:
      prowlarr:
        condition: service_healthy
    environment:
      <<: *common-env
      PORT: "9709"
      URL: ${PROWLARR_API_URL:-http://prowlarr:9696}
      API_KEY: ${PROWLARR_API_KEY:?PROWLARR_API_KEY is required}
    networks:
      - arr

  recyclarr:
    <<: *common
    image: recyclarr/recyclarr:8.7.0
    container_name: arr-recyclarr
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    ports:
      - "${RECYCLARR_PORT:-7879}:7879"
    environment:
      <<: *common-env
      CRON_SCHEDULE: ${RECYCLARR_CRON_SCHEDULE:-0 */6 * * *}
      SONARR_API_URL: ${SONARR_API_URL:-http://sonarr:8989}
      RADARR_API_URL: ${RADARR_API_URL:-http://radarr:7878}
      SONARR_API_KEY: ${SONARR_API_KEY:?SONARR_API_KEY is required}
      RADARR_API_KEY: ${RADARR_API_KEY:?RADARR_API_KEY is required}
    volumes:
      - ${RECYCLARR_PATH_CONFIG:-./recyclarr/config}:/config
    networks:
      - arr

  mediathekarr:
    <<: *common
    image: pcjones/mediathekarr:beta
    container_name: arr-mediathekarr
    environment:
      <<: *common-env
      DOWNLOAD_INCOMPLETE_PATH: /data/temp
      DOWNLOAD_COMPLETE_PATH: /data/complete/
      CATEGORIES: ${MEDIATHEKARR_CATEGORIES:-series,movies,custom}
      MEDIATHEKARR_API_BASE_URL: ${MEDIATHEKARR_API_BASE_URL:-https://mediathekarr.pcjones.de/api/v1}
    volumes:
      - ${MEDIATHEKARR_PATH_CONFIG:-./data/mediathekarr/config}:/app/config
      - ${MEDIATHEKARR_PATH_TEMP:-./data/mediathekarr/temp}:/data/temp
      - mediathek_smb:/data/complete
    ports:
      - "${MEDIATHEKARR_PORT:-1007}:5007"
    networks:
      - arr

  pinchflat:
    <<: *common
    image: ghcr.io/kieraneglin/pinchflat:v2025.6.25
    container_name: arr-pinchflat
    ports:
      - "${PINCHFLAT_PORT:-8945}:8945"
    volumes:
      - ${PINCHFLAT_PATH_CONFIG:-./data/pinchflat/config}:/config
      - media_smb:${ARR_MEDIA_PATH:-/data/media}
    networks:
      - arr
      - media

networks:
  arr:
    name: arr-net
  media:
    name: media-net
    external: true

volumes:
  media_smb:
    driver: local
    driver_opts:
      type: cifs
      device: "//${CIFS_MEDIA_HOST:?CIFS_MEDIA_HOST is required}/${CIFS_MEDIA_SHARE:?CIFS_MEDIA_SHARE is required}"
      o: "username=${CIFS_MEDIA_USER:?CIFS_MEDIA_USER is required},password=${CIFS_MEDIA_PASS:?CIFS_MEDIA_PASS is required},vers=3.0,uid=${PUID:-1000},gid=${PGID:-1000}"
  mediathek_smb:
    driver: local
    driver_opts:
      type: cifs
      device: "//${CIFS_DOWNLOADS_HOST:?CIFS_DOWNLOADS_HOST is required}/${CIFS_DOWNLOADS_SHARE:?CIFS_DOWNLOADS_SHARE is required}"
      o: "username=${CIFS_DOWNLOADS_USER:?CIFS_DOWNLOADS_USER is required},password=${CIFS_DOWNLOADS_PASS:?CIFS_DOWNLOADS_PASS is required},vers=3.0,uid=${PUID:-1000},gid=${PGID:-1000}"
