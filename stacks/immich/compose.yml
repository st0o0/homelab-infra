x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  server:
    image: ghcr.io/immich-app/immich-server:v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
    container_name: immich-server
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    volumes:
      - immich_smb:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=${IMMICH_DB_HOST:?IMMICH_DB_HOST is required}
      - DB_PORT=${IMMICH_DB_PORT:-5432}
      - DB_USERNAME=${IMMICH_DB_USER:-}
      - DB_PASSWORD=${IMMICH_DB_PASS:?IMMICH_DB_PASS is required}
      - DB_DATABASE_NAME=${IMMICH_DB_NAME:-}
      - REDIS_HOSTNAME=${IMMICH_REDIS_HOST:?IMMICH_REDIS_HOST is required}
      - REDIS_PORT=${IMMICH_REDIS_PORT:-6379}
      - REDIS_PASSWORD=${IMMICH_REDIS_PASS:-}
      - REDIS_DBINDEX=${IMMICH_REDIS_DBINDEX:-0}
      - IMMICH_TRUSTED_PROXIES=${IMMICH_TRUSTED_PROXIES:-}
      - IMMICH_TELEMETRY_INCLUDE=${IMMICH_TELEMETRY_INCLUDE:-all}
      - IMMICH_API_METRICS_PORT=${IMMICH_API_METRICS_PORT:-8081}
      - IMMICH_MICROSERVICES_METRICS_PORT=${IMMICH_MICROSERVICES_METRICS_PORT:-8082}
    networks:
      - immich-net
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1GB
        reservations:
          memory: 512M

  machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
    container_name: immich-ml
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${IMMICH_PATH_CACHE:?IMMICH_PATH_CACHE is required}:/cache
    environment:
      - TZ=${TZ:-}
      - MACHINE_LEARNING_WORKERS=${IMMICH_ML_WORKERS:-1}
      - MACHINE_LEARNING_MODEL_TTL=${IMMICH_ML_MODEL_TTL:-600}
    networks:
      - immich-net
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1GB
        reservations:
          memory: 512M

networks:
  immich-net:
    name: immich-net
    external: true

volumes:
  immich_smb:
    driver: local
    driver_opts:
      type: cifs
      device: "//${CIFS_IMMICH_MEDIA_HOST:?CIFS_IMMICH_MEDIA_HOST is required}/${CIFS_IMMICH_MEDIA_SHARE:?CIFS_IMMICH_MEDIA_SHARE is required}"
      o: "username=${CIFS_IMMICH_MEDIA_USER:?CIFS_IMMICH_MEDIA_USER is required},password=${CIFS_IMMICH_MEDIA_PASS:?CIFS_IMMICH_MEDIA_PASS is required},vers=3.0,uid=${PUID:-},gid=${PGID:-}"
