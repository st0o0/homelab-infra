x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  server:
    image: ghcr.io/immich-app/immich-server:v3.0.3
    container_name: immich-server
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    volumes:
      - ${IMMICH_PATH_UPLOAD:?IMMICH_PATH_UPLOAD is required}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=${IMMICH_DB_HOST:?IMMICH_DB_HOST is required}
      - DB_USERNAME=${IMMICH_DB_USER:-}
      - DB_PASSWORD=${IMMICH_DB_PASS:?IMMICH_DB_PASS is required}
      - DB_DATABASE_NAME=${IMMICH_DB_NAME:-}
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1GB
        reservations:
          memory: 512M

  machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.3
    container_name: immich-ml
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${IMMICH_PATH_CACHE:?IMMICH_PATH_CACHE is required}:/cache
    environment:
      - TZ=${TZ:-}
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1GB
        reservations:
          memory: 512M

  valkey:
    image: docker.io/valkey/valkey:9
    container_name: valkey
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1GB
        reservations:
          memory: 512M

volumes:
  media_smb:
    driver: local
    driver_opts:
      type: cifs
      device: "//${CIFS_IMMICH_MEDIA_HOST:?CIFS_IMMICH_MEDIA_HOST is required}/${CIFS_IMMICH_MEDIA_SHARE:?CIFS_IMMICH_MEDIA_SHARE is required}"
      o: "username=${CIFS_IMMICH_MEDIA_USER:?CIFS_IMMICH_MEDIA_USER is required},password=${CIFS_IMMICH_MEDIA_PASS:?CIFS_IMMICH_MEDIA_PASS is required},vers=3.0,uid=${PUID:-},gid=${PGID:-}"