x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.1
    container_name: gluetun
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${SABNZBD_PORT:-8080}:8080"
      - "${FIREFOX_PORT:-5800}:5800"
    environment:
      - TZ=${TZ:-}
      - VPN_SERVICE_PROVIDER=${GLUETUN_VPN_PROVIDER:?GLUETUN_VPN_PROVIDER is required}
      - VPN_TYPE=${GLUETUN_VPN_TYPE:-wireguard}
      - WIREGUARD_MTU=${GLUETUN_WG_MTU:-1380}
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_WG_PRIVATE_KEY:?GLUETUN_WG_PRIVATE_KEY is required}
      - WIREGUARD_PRESHARED_KEY=${GLUETUN_WG_PRESHARED_KEY:?GLUETUN_WG_PRESHARED_KEY is required}
      - WIREGUARD_ADDRESSES=${GLUETUN_WG_ADDRESSES:?GLUETUN_WG_ADDRESSES is required}
      - SERVER_CITIES=${GLUETUN_SERVER_CITIES:?GLUETUN_SERVER_CITIES is required}
      - DOT_PROVIDERS=${GLUETUN_DOT_PROVIDERS:-quad9}
    volumes:
      - ./gluetun/config:/gluetun
    networks:
      media:
        aliases:
          - sabnzbd
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
        reservations:
          memory: 128M

  sabnzbd:
    image: ghcr.io/home-operations/sabnzbd:5.1.1
    container_name: sabnzbd
    restart: unless-stopped
    logging: *default-logging
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - SABNZBD__API_KEY=${SABNZBD_API_KEY:-}
      - SABNZBD__NZB_KEY=${SABNZBD_NZB_KEY:-}
      - SABNZBD__HOST_WHITELIST_ENTRIES=${SABNZBD_HOST_WHITELIST:-}
    volumes:
      - ${SABNZBD_PATH_CONFIG:-./sabnzbd/config}:/config
      - ${SABNZBD_PATH_INCOMPLETE:-./sabnzbd/incomplete}:/config/Downloads/incomplete
      - smb_downloads:/config/Downloads/complete
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: "1"
        reservations:
          memory: 256M

  dufs:
    image: sigoden/dufs:v0.46.0@sha256:8dd3b750015734703e64b55641fb7d2254c112e0ff3967074766177dc15dc982
    container_name: dufs
    restart: unless-stopped
    logging: *default-logging
    command: /data --allow-all --port 5000
    ports:
      - "${DUFS_PORT:-8082}:5000"
    volumes:
      - smb_downloads:/data
    networks:
      - media
    deploy:
      resources:
        limits:
          cpus: 0.1
          memory: 64M
        reservations:
          memory: 32M

  firefox:
    image: jlesage/firefox:v25.07.1@sha256:07d3c31db833dac9a959ebd749495a37ce52dcd2a2f28402e4b8515cb672ae72
    container_name: firefox
    restart: unless-stopped
    logging: *default-logging
    environment:
      - USER_ID=${PUID:-1000}
      - GROUP_ID=${PGID:-1000}
      - TZ=${TZ:-}
      - LANG=${FIREFOX_LANG:-de_DE.UTF-8}
      - DARK_MODE=1
      - KEEP_APP_RUNNING=1
      - WEB_AUDIO=0
    volumes:
      - ${FIREFOX_PATH_CONFIG:-./firefox/config}:/config
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: "1"
        reservations:
          memory: 256M

networks:
  media:
    name: media-net
    external: true

volumes:
  smb_downloads:
    driver: local
    driver_opts:
      type: cifs
      device: "//${CIFS_DOWNLOADS_HOST:?CIFS_DOWNLOADS_HOST is required}/${CIFS_DOWNLOADS_SHARE:?CIFS_DOWNLOADS_SHARE is required}"
      o: "username=${CIFS_DOWNLOADS_USER:?CIFS_DOWNLOADS_USER is required},password=${CIFS_DOWNLOADS_PASS:?CIFS_DOWNLOADS_PASS is required},vers=3.0,uid=${PUID:-1000},gid=${PGID:-1000},iocharset=utf8"
