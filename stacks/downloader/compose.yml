x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.1
    container_name: gluetun
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${GLUETUN_PORT:-8079}:8000"
      - "${NZBGET_PORT:-6789}:6789"
      - "${FIREFOX_PORT:-5800}:5800"
    environment:
      - TZ=${TZ:-}
      - VPN_SERVICE_PROVIDER=${GLUETUN_VPN_PROVIDER:?GLUETUN_VPN_PROVIDER is required}
      - VPN_TYPE=${GLUETUN_VPN_TYPE:-wireguard}
      - WIREGUARD_MTU=${GLUETUN_WG_MTU:-1380}
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_WG_PRIVATE_KEY:?GLUETUN_WG_PRIVATE_KEY is required}
      - WIREGUARD_PRESHARED_KEY=${GLUETUN_WG_PRESHARED_KEY:?GLUETUN_WG_PRESHARED_KEY is required}
      - WIREGUARD_ADDRESSES=${GLUETUN_WG_ADDRESSES:?GLUETUN_WG_ADDRESSES is required}
      - SERVER_CITIES=${GLUETUN_SERVER_CITIES:?GLUETUN_SERVER_CITIES is required}
      - DOT_PROVIDERS=${GLUETUN_DOT_PROVIDERS:-quad9}
    volumes:
      - ./gluetun/config:/gluetun
    networks:
      media:
        aliases:
          - nzbget

  nzbget:
    image: ghcr.io/nzbgetcom/nzbget:v26.2
    container_name: nzbget
    restart: unless-stopped
    logging: *default-logging
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-}
      - NZBGET_USER=${NZBGET_USER:-}
      - NZBGET_PASS=${NZBGET_PASS:-}
    volumes:
      - ${NZBGET_PATH_CONFIG:-./nzbget/config}:/config
      - ${NZBGET_PATH_TMP:-./nzbget/tmp}:/data/tmp
      - ${NZBGET_PATH_INTERMEDIATE:-./nzbget/intermediate}:/data/intermediate
      - nzbget_smb_downloads:/data/completed
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: "1"

  firefox:
    image: jlesage/firefox:v25.07.1
    container_name: firefox
    restart: unless-stopped
    logging: *default-logging
    environment:
      - USER_ID=${PUID:-1000}
      - GROUP_ID=${PGID:-1000}
      - TZ=${TZ:-}
      - LANG=${FIREFOX_LANG:-de_DE.UTF-8}
      - DARK_MODE=1
      - KEEP_APP_RUNNING=1
      - WEB_AUDIO=0

    volumes:
      - ${FIREFOX_PATH_CONFIG:-./firefox/config}:/config
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${FIREFOX_MEMORY:-512MB}
          cpus: "1"

networks:
  media:
    name: media-net
    external: true

volumes:
  nzbget_smb_downloads:
    driver: local
    driver_opts:
      type: cifs
      device: "//${CIFS_DOWNLOADS_HOST:?CIFS_DOWNLOADS_HOST is required}/${CIFS_DOWNLOADS_SHARE:?CIFS_DOWNLOADS_SHARE is required}"
      o: "username=${CIFS_DOWNLOADS_USER:?CIFS_DOWNLOADS_USER is required},password=${CIFS_DOWNLOADS_PASS:?CIFS_DOWNLOADS_PASS is required},vers=3.0,uid=${PUID:-1000},gid=${PGID:-1000}"
