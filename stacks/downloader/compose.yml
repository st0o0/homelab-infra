x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.1
    container_name: gluetun
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${GLUETUN_PORT:-8079}:8000"
      - "${NZBGET_PORT:-6789}:6789"
    environment:
      - VPN_SERVICE_PROVIDER=${GLUETUN_VPN_PROVIDER:-airvpn}
      - VPN_TYPE=${GLUETUN_VPN_TYPE:-wireguard}
      - WIREGUARD_MTU=${GLUETUN_WG_MTU:-1380}
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_WG_PRIVATE_KEY:?GLUETUN_WG_PRIVATE_KEY is required}
      - WIREGUARD_PRESHARED_KEY=${GLUETUN_WG_PRESHARED_KEY:-}
      - WIREGUARD_ADDRESSES=${GLUETUN_WG_ADDRESSES:?GLUETUN_WG_ADDRESSES is required}
      - SERVER_CITIES=${GLUETUN_SERVER_CITIES:-Alblasserdam}
      - DOT_PROVIDERS=${GLUETUN_DOT_PROVIDERS:-quad9}
      - TZ=${TZ:-}
    volumes:
      - ./gluetun/config:/gluetun
    networks:
      media:
        aliases:
          - nzbget

  nzbget:
    image: nzbgetcom/nzbget:v26.2@sha256:ea467bb0dc08449f8c884c3f49e4043b563347225ed533f1802c5a81e712a11b
    container_name: nzbget
    restart: unless-stopped
    logging: *default-logging
    environment:
      - PUID=${PUID:-}
      - PGID=${PGID:-}
      - TZ=${TZ:-}
      - NZBGET_USER=${NZBGET_USER:-}
      - NZBGET_PASS=${NZBGET_PASS:-}
      - NZBOP_MAINDIR=/data
      - NZBOP_DESTDIR=/data/complete
      - NZBOP_INTERDIR=/data/ssd/inter
      - NZBOP_TEMPDIR=/data/ssd/tmp
      - NZBOP_SERVER1_HOST=${NZBOP_SERVER1_HOST:-}
      - NZBOP_SERVER1_PORT=${NZBOP_SERVER1_PORT:-563}
      - NZBOP_SERVER1_USERNAME=${NZBOP_SERVER1_USERNAME:-}
      - NZBOP_SERVER1_PASSWORD=${NZBOP_SERVER1_PASSWORD:-}
      - NZBOP_SERVER1_CONNECTIONS=${NZBOP_SERVER1_CONNECTIONS:-10}
      - NZBOP_SERVER1_ENCRYPTION=${NZBOP_SERVER1_ENCRYPTION:-yes}
      - NZBOP_CATEGORY1_NAME=sonarr
      - NZBOP_CATEGORY1_DESTDIR=/data/complete/sonarr
      - NZBOP_CATEGORY2_NAME=radarr
      - NZBOP_CATEGORY2_DESTDIR=/data/complete/radarr
      - NZBOP_CATEGORY3_NAME=mediathek
      - NZBOP_CATEGORY3_DESTDIR=/data/complete/mediathek
    volumes:
      - ./nzbget/config:/config
      - nzbget_smb:/data/complete
      - ${NZBGET_PATH_SSD:-./nzbget/ssd}:/data/ssd
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

networks:
  media:
    name: media-net
    external: true

volumes:
  nzbget_smb:
    driver: local
    driver_opts:
      type: cifs
      device: "//${CIFS_DOWNLOADS_HOST:?CIFS_DOWNLOADS_HOST is required}/${CIFS_DOWNLOADS_SHARE:?CIFS_DOWNLOADS_SHARE is required}"
      o: "username=${CIFS_DOWNLOADS_USER:?CIFS_DOWNLOADS_USER is required},password=${CIFS_DOWNLOADS_PASS:?CIFS_DOWNLOADS_PASS is required},vers=3.0,uid=${PUID:-1000},gid=${PGID:-1000}"
