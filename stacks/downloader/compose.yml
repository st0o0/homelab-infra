x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.1
    container_name: gluetun
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${GLUETUN_PORT:-8079}:8000"
      - "${SABNZBD_PORT:-8080}:8080"
      - "${FIREFOX_PORT:-5800}:5800"
    environment:
      - TZ=${TZ:-}
      - VPN_SERVICE_PROVIDER=${GLUETUN_VPN_PROVIDER:?GLUETUN_VPN_PROVIDER is required}
      - VPN_TYPE=${GLUETUN_VPN_TYPE:-wireguard}
      - WIREGUARD_MTU=${GLUETUN_WG_MTU:-1380}
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_WG_PRIVATE_KEY:?GLUETUN_WG_PRIVATE_KEY is required}
      - WIREGUARD_PRESHARED_KEY=${GLUETUN_WG_PRESHARED_KEY:?GLUETUN_WG_PRESHARED_KEY is required}
      - WIREGUARD_ADDRESSES=${GLUETUN_WG_ADDRESSES:?GLUETUN_WG_ADDRESSES is required}
      - SERVER_CITIES=${GLUETUN_SERVER_CITIES:?GLUETUN_SERVER_CITIES is required}
      - DOT_PROVIDERS=${GLUETUN_DOT_PROVIDERS:-quad9}
    volumes:
      - ./gluetun/config:/gluetun
    networks:
      media:
        aliases:
          - sabnzbd

  sabnzbd-init:
    image: alpine:3
    container_name: sabnzbd-init
    command: ["sh", "-c", "chown -R ${PUID:-1000}:${PGID:-1000} /config"]
    volumes:
      - ${SABNZBD_PATH_CONFIG:-./sabnzbd/config}:/config
    network_mode: none
    restart: "no"

  sabnzbd:
    image: ghcr.io/home-operations/sabnzbd:5.1.1
    container_name: sabnzbd
    restart: unless-stopped
    logging: *default-logging
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-}
      - SABNZBD__PORT=8080
      - SABNZBD__API_KEY=${SABNZBD_API_KEY:?SABNZBD_API_KEY is required}
      - SABNZBD__NZB_KEY=${SABNZBD_NZB_KEY:?SABNZBD_NZB_KEY is required}
    volumes:
      - ${SABNZBD_PATH_CONFIG:-./sabnzbd/config}:/config
      - ${SABNZBD_PATH_INCOMPLETE:-./sabnzbd/incomplete}:/data/incomplete
      - sabnzbd_smb_downloads:/data/downloads
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      sabnzbd-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: "1"

  firefox:
    image: jlesage/firefox:v25.07.1
    container_name: firefox
    restart: unless-stopped
    logging: *default-logging
    environment:
      - USER_ID=${PUID:-1000}
      - GROUP_ID=${PGID:-1000}
      - TZ=${TZ:-}
      - LANG=${FIREFOX_LANG:-de_DE.UTF-8}
      - DARK_MODE=1
      - KEEP_APP_RUNNING=1
      - WEB_AUDIO=0

    volumes:
      - ./firefox/config:/config
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${FIREFOX_MEMORY:-512MB}
          cpus: "1"

networks:
  media:
    name: media-net
    external: true

volumes:
  sabnzbd_smb_downloads:
    driver: local
    driver_opts:
      type: cifs
      device: "//${CIFS_DOWNLOADS_HOST:?CIFS_DOWNLOADS_HOST is required}/${CIFS_DOWNLOADS_SHARE:?CIFS_DOWNLOADS_SHARE is required}"
      o: "username=${CIFS_DOWNLOADS_USER:?CIFS_DOWNLOADS_USER is required},password=${CIFS_DOWNLOADS_PASS:?CIFS_DOWNLOADS_PASS is required},vers=3.0,uid=${PUID:-1000},gid=${PGID:-1000}"
