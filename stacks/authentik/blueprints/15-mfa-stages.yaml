version: 1
metadata:
  name: MFA Stages
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # TOTP authenticator setup stage
  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    id: totp-setup
    identifiers:
      name: mfa-totp-setup
    attrs:
      digits: 6
      friendly_name: "Authenticator App"

  # WebAuthn / Passkey setup stage
  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    id: webauthn-setup
    identifiers:
      name: mfa-webauthn-setup
    attrs:
      friendly_name: "Passkey / Security Key"
      resident_key_requirement: preferred
      user_verification: preferred

  # Static recovery tokens setup stage
  - model: authentik_stages_authenticator_static.authenticatorstaticstage
    id: static-setup
    identifiers:
      name: mfa-static-setup
    attrs:
      friendly_name: "Recovery Codes"
      token_count: 6
      token_length: 12

  # MFA validation stage (used in authentication flow)
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-validation
    identifiers:
      name: mfa-validation
    attrs:
      device_classes:
        - totp
        - webauthn
        - static
      not_configured_action: force_configure
      configuration_stages:
        - !KeyOf totp-setup
        - !KeyOf webauthn-setup
        - !KeyOf static-setup

  # Bind MFA validation into default authentication flow after password
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      order: 30
    attrs:
      stage: !KeyOf mfa-validation
      evaluate_on_plan: true
      re_evaluate_policies: true
