version: 1
metadata:
  name: Groups
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_core.group
    id: group-tier-guest
    identifiers:
      name: tier-guest
    attrs:
      is_superuser: false

  - model: authentik_core.group
    id: group-tier-media
    identifiers:
      name: tier-media
    attrs:
      is_superuser: false
      parent: !KeyOf group-tier-guest

  - model: authentik_core.group
    id: group-tier-homelab
    identifiers:
      name: tier-homelab
    attrs:
      is_superuser: false
      parent: !KeyOf group-tier-media
