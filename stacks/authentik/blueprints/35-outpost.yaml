version: 1
metadata:
  name: Embedded Outpost
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: "authentik Embedded Outpost"
    attrs:
      type: proxy
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, Forward Auth for Vaultwarden]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, Forward Auth for Seerr]]
