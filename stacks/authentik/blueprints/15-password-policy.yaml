version: 1
metadata:
  name: Password Policy
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_policies_password.passwordpolicy
    id: password-policy
    identifiers:
      name: password-complexity
    attrs:
      length_min: 12
      amount_uppercase: 1
      amount_lowercase: 1
      amount_digits: 1
      amount_symbols: 0
      check_static_rules: true
      check_zxcvbn: true
      check_have_i_been_pwned: true
      error_message: "Password must be at least 12 characters with uppercase, lowercase, and a digit. Breached passwords are rejected."
