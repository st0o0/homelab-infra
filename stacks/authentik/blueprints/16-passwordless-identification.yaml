version: 1
metadata:
  name: Passwordless Identification
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # Separate password to its own page so the identification page
  # shows only the username field and a prominent passkey button
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      password_stage: null
      passwordless_flow: !Find [authentik_flows.flow, [slug, passwordless-authentication]]
      webauthn_stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, passwordless-webauthn-validation]]

  # Bind password stage as a separate step after identification
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
