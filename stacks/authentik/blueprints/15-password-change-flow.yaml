version: 1
metadata:
  name: Password Change Flow
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # Self-service password change flow
  - model: authentik_flows.flow
    id: flow
    identifiers:
      slug: password-change
    attrs:
      name: Password Change
      title: Change your password
      designation: stage_configuration
      authentication: require_authenticated

  # Prompt for new password
  - model: authentik_stages_prompt.prompt
    identifiers:
      field_key: password_change
    attrs:
      name: New Password (change)
      label: New Password
      type: password
      required: true
      placeholder: New password
      order: 0

  - model: authentik_stages_prompt.prompt
    identifiers:
      field_key: password_change_repeat
    attrs:
      name: Repeat Password (change)
      label: Repeat New Password
      type: password
      required: true
      placeholder: Repeat new password
      order: 1

  - model: authentik_stages_prompt.promptstage
    id: password-prompt
    identifiers:
      name: change-password-prompt
    attrs:
      fields:
        - !Find [authentik_stages_prompt.prompt, [field_key, password_change]]
        - !Find [authentik_stages_prompt.prompt, [field_key, password_change_repeat]]
      validation_policies:
        - !Find [authentik_policies_password.passwordpolicy, [name, password-complexity]]

  # Write the new password
  - model: authentik_stages_user_write.userwritestage
    id: user-write
    identifiers:
      name: change-password-write
    attrs:
      user_creation_mode: never_create

  # Stage bindings
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      order: 10
    attrs:
      stage: !KeyOf password-prompt

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      order: 20
    attrs:
      stage: !KeyOf user-write
