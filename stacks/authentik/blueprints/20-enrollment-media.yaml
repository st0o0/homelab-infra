version: 1
metadata:
  name: Enrollment Media
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # Flow
  - model: authentik_flows.flow
    id: flow
    identifiers:
      slug: invite-media
    attrs:
      name: Invite → Media
      title: Join Sloth Homelab
      designation: enrollment
      authentication: require_unauthenticated

  # UserWriteStage for media group
  - model: authentik_stages_user_write.userwritestage
    id: user-write
    identifiers:
      name: enrollment-write-media
    attrs:
      user_creation_mode: always_create
      create_users_group: !Find [authentik_core.group, [name, media]]
      user_type: internal

  # Stage bindings
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      order: 10
    attrs:
      stage: !Find [authentik_stages_invitation.invitationstage, [name, enrollment-invitation]]
      evaluate_on_plan: true
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      order: 20
    attrs:
      stage: !Find [authentik_stages_prompt.promptstage, [name, enrollment-prompt]]

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      order: 30
    attrs:
      stage: !KeyOf user-write

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      order: 40
    attrs:
      stage: !Find [authentik_stages_user_login.userloginstage, [name, enrollment-login]]
