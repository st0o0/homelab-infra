version: 1
metadata:
  name: Groups Scope Mapping
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      scope_name: groups
    attrs:
      name: "Groups"
      description: "Group memberships"
      expression: |
        return {
            "groups": [group.name for group in request.user.groups.all()],
        }
