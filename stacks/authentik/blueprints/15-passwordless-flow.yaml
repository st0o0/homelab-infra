version: 1
metadata:
  name: Passwordless Authentication
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # WebAuthn validation stage for passwordless login
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: passwordless-webauthn
    identifiers:
      name: passwordless-webauthn-validation
    attrs:
      device_classes:
        - webauthn
      not_configured_action: deny
      webauthn_user_verification: required

  # Dedicated passwordless authentication flow
  - model: authentik_flows.flow
    id: passwordless-flow
    identifiers:
      slug: passwordless-authentication
    attrs:
      name: Passwordless Authentication
      title: Passkey Login
      designation: authentication
      authentication: none

  # Bind WebAuthn validation into passwordless flow
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passwordless-flow
      order: 0
    attrs:
      stage: !KeyOf passwordless-webauthn
      evaluate_on_plan: true
      re_evaluate_policies: true
      invalid_response_action: retry

  # Bind existing login stage into passwordless flow
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passwordless-flow
      order: 10
    attrs:
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      evaluate_on_plan: true
      re_evaluate_policies: true

  # Separate password to its own page so the identification page
  # shows only the username field and a prominent passkey button
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      password_stage: null
      passwordless_flow: !KeyOf passwordless-flow
      webauthn_stage: !KeyOf passwordless-webauthn

  # Bind password stage as a separate step after identification
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      order: 10
    attrs:
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      evaluate_on_plan: true
      re_evaluate_policies: true

  # Policy: returns true if user already has a confirmed WebAuthn device
  - model: authentik_policies_expression.expressionpolicy
    id: has-webauthn-device
    identifiers:
      name: has-webauthn-device
    attrs:
      expression: |
        from authentik.stages.authenticator_webauthn.models import WebAuthnDevice
        return WebAuthnDevice.objects.filter(user=request.user, confirmed=True).exists()

  # Force passkey registration after login if user has none
  - model: authentik_flows.flowstagebinding
    id: passkey-setup-binding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      order: 50
    attrs:
      stage: !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, mfa-webauthn-setup]]
      evaluate_on_plan: false
      re_evaluate_policies: true

  # Skip setup stage if user already has a passkey (negate: policy true → skip)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf passkey-setup-binding
      order: 0
    attrs:
      policy: !KeyOf has-webauthn-device
      negate: true
      enabled: true
      timeout: 30
