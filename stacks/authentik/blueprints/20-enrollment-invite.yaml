version: 1
metadata:
  name: Enrollment Invite
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # Flow
  - model: authentik_flows.flow
    id: flow
    identifiers:
      slug: invite
    attrs:
      name: Invite
      title: Join Sloth Homelab
      designation: enrollment
      authentication: require_unauthenticated

  # Stage bindings
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      order: 10
    attrs:
      stage: !Find [authentik_stages_invitation.invitationstage, [name, enrollment-invitation]]
      evaluate_on_plan: true
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      order: 20
    attrs:
      stage: !Find [authentik_stages_prompt.promptstage, [name, enrollment-prompt]]

  - model: authentik_flows.flowstagebinding
    id: write-binding
    identifiers:
      target: !KeyOf flow
      order: 30
    attrs:
      stage: !Find [authentik_stages_user_write.userwritestage, [name, enrollment-write]]
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf write-binding
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, enrollment-groups-from-invitation]]
      enabled: true
      negate: false
      timeout: 30

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      order: 40
    attrs:
      stage: !Find [authentik_stages_user_login.userloginstage, [name, enrollment-login]]
