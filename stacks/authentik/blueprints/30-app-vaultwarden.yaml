version: 1
metadata:
  name: Vaultwarden
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Provider for Vaultwarden
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env AUTHENTIK_PROVIDER_VAULTWARDEN_CLIENT_ID
      client_secret: !Env AUTHENTIK_PROVIDER_VAULTWARDEN_CLIENT_SECRET
      redirect_uris:
        - url: !Env AUTHENTIK_PROVIDER_VAULTWARDEN_REDIRECT_URI
          matching_mode: strict
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=14
      refresh_token_threshold: seconds=0
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: app
    identifiers:
      slug: vaultwarden
    attrs:
      name: Vaultwarden
      provider: !KeyOf provider
      group: IT
      open_in_new_tab: false
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/vaultwarden.svg
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, tier-homelab]]
      negate: false
      enabled: true
      timeout: 30

  - model: authentik_providers_proxy.proxyprovider
    id: proxy-provider
    identifiers:
      name: Forward Auth for Vaultwarden
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Env AUTHENTIK_PROVIDER_VAULTWARDEN_EXTERNAL_HOST
      access_token_validity: hours=1

  - model: authentik_core.application
    id: proxy-app
    identifiers:
      slug: vaultwarden-proxy
    attrs:
      name: Vaultwarden (Forward Auth)
      provider: !KeyOf proxy-provider
      group: IT
      meta_hide: true
      open_in_new_tab: false
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf proxy-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, tier-homelab]]
      negate: false
      enabled: true
      timeout: 30
