x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  server:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik-server
    restart: unless-stopped
    logging: *default-logging
    command: server
    environment:
      - PUID=${PUID:-}
      - PGID=${PGID:-}
      - TZ=${TZ:-}
      # Database
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_KEY:?AUTHENTIK_KEY is required}
      - AUTHENTIK_POSTGRESQL__HOST=${AUTHENTIK_DB_HOST:?AUTHENTIK_DB_HOST is required}
      - AUTHENTIK_POSTGRESQL__USER=${AUTHENTIK_DB_USER:?AUTHENTIK_DB_USER is required}
      - AUTHENTIK_POSTGRESQL__NAME=${AUTHENTIK_DB_NAME:?AUTHENTIK_DB_NAME is required}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_DB_PASS:?AUTHENTIK_DB_PASS is required}
      # Privacy
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_DISABLE_UPDATE_CHECK=true
      - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
      # Security
      - AUTHENTIK_COOKIE_DOMAIN=${AUTHENTIK_COOKIE_DOMAIN:-}
      - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=${AUTHENTIK_TRUSTED_PROXY_CIDRS:-}
      - AUTHENTIK_DEFAULT_USER_CHANGE_EMAIL=false
      - AUTHENTIK_DEFAULT_USER_CHANGE_USERNAME=false
      - AUTHENTIK_DEFAULT_TOKEN_DURATION=days=30
      - AUTHENTIK_IMPERSONATION=false
      # Housekeeping
      - AUTHENTIK_EVENTS__RETENTION=days=90
      - AUTHENTIK_LOG_LEVEL=${AUTHENTIK_LOG_LEVEL:-warning}
      # Email
      - AUTHENTIK_EMAIL__HOST=${AUTHENTIK_EMAIL_HOST:-}
      - AUTHENTIK_EMAIL__PORT=${AUTHENTIK_EMAIL_PORT:-}
      - AUTHENTIK_EMAIL__USERNAME=${AUTHENTIK_EMAIL_USER:-}
      - AUTHENTIK_EMAIL__PASSWORD=${AUTHENTIK_EMAIL_PASS:-}
      - AUTHENTIK_EMAIL__USE_TLS=${AUTHENTIK_EMAIL_USE_TLS:-true}
      - AUTHENTIK_EMAIL__USE_SSL=${AUTHENTIK_EMAIL_USE_SSL:-false}
      - AUTHENTIK_EMAIL__FROM=${AUTHENTIK_EMAIL_FROM:-}
      - AUTHENTIK_EMAIL__TIMEOUT=10
      # Geo
      - AUTHENTIK_GEOIP_ACCOUNT_ID=${AUTHENTIK_GEOIP_ACCOUNT_ID:-}
      - AUTHENTIK_GEOIP_LICENSE_KEY=${AUTHENTIK_GEOIP_LICENSE_KEY:-}
    volumes:
      - ${AUTHENTIK_PATH_MEDIA:-./media}:/media
      - ${AUTHENTIK_PATH_TEMPLATES:-./custom-templates}:/templates
      - ./blueprints:/blueprints/custom
    ports:
      - "${AUTHENTIK_PORT_HTTP:-9000}:9000"
    networks:
      - default
      - authentik-net

  worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik-worker
    restart: unless-stopped
    logging: *default-logging
    command: worker
    environment:
      - PUID=${PUID:-}
      - PGID=${PGID:-}
      - TZ=${TZ:-}
      # Database
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_KEY:?AUTHENTIK_KEY is required}
      - AUTHENTIK_POSTGRESQL__HOST=${AUTHENTIK_DB_HOST:?AUTHENTIK_DB_HOST is required}
      - AUTHENTIK_POSTGRESQL__USER=${AUTHENTIK_DB_USER:?AUTHENTIK_DB_USER is required}
      - AUTHENTIK_POSTGRESQL__NAME=${AUTHENTIK_DB_NAME:?AUTHENTIK_DB_NAME is required}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_DB_PASS:?AUTHENTIK_DB_PASS is required}
      # Privacy
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_DISABLE_UPDATE_CHECK=true
      - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
      # Security
      - AUTHENTIK_COOKIE_DOMAIN=${AUTHENTIK_COOKIE_DOMAIN:-}
      - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=${AUTHENTIK_TRUSTED_PROXY_CIDRS:-}
      - AUTHENTIK_DEFAULT_USER_CHANGE_EMAIL=false
      - AUTHENTIK_DEFAULT_USER_CHANGE_USERNAME=false
      - AUTHENTIK_DEFAULT_TOKEN_DURATION=days=30
      - AUTHENTIK_IMPERSONATION=false
      # Housekeeping
      - AUTHENTIK_EVENTS__RETENTION=days=90
      - AUTHENTIK_LOG_LEVEL=${AUTHENTIK_LOG_LEVEL:-warning}
      # Email
      - AUTHENTIK_EMAIL__HOST=${AUTHENTIK_EMAIL_HOST:-}
      - AUTHENTIK_EMAIL__PORT=${AUTHENTIK_EMAIL_PORT:-}
      - AUTHENTIK_EMAIL__USERNAME=${AUTHENTIK_EMAIL_USER:-}
      - AUTHENTIK_EMAIL__PASSWORD=${AUTHENTIK_EMAIL_PASS:-}
      - AUTHENTIK_EMAIL__USE_TLS=${AUTHENTIK_EMAIL_USE_TLS:-true}
      - AUTHENTIK_EMAIL__USE_SSL=${AUTHENTIK_EMAIL_USE_SSL:-false}
      - AUTHENTIK_EMAIL__FROM=${AUTHENTIK_EMAIL_FROM:-}
      - AUTHENTIK_EMAIL__TIMEOUT=10
      # Geo
      - AUTHENTIK_GEOIP_ACCOUNT_ID=${AUTHENTIK_GEOIP_ACCOUNT_ID:-}
      - AUTHENTIK_GEOIP_LICENSE_KEY=${AUTHENTIK_GEOIP_LICENSE_KEY:-}
    volumes:
      - ${AUTHENTIK_PATH_MEDIA:-./media}:/media
      - ${AUTHENTIK_PATH_CERTS:-./certs}:/certs
      - ${AUTHENTIK_PATH_TEMPLATES:-./custom-templates}:/templates
      - ./blueprints:/blueprints/custom

networks:
  authentik-net:
    name: authentik-net
