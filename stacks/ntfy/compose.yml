x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  ntfy:
    image: binwiederhier/ntfy:v2.27.0@sha256:9dbcc3bf2d96889f2cf103b08ae7ea0a22e843c4bd54fd94c08c2e2e2364fb3c
    platform: linux/arm64
    container_name: ntfy
    restart: unless-stopped
    logging: *default-logging
    command: serve
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - NTFY_AUTH_USERS=${NTFY_AUTH_USERS:?NTFY_AUTH_USERS is required}
      - NTFY_AUTH_ACCESS=${NTFY_AUTH_ACCESS:?NTFY_AUTH_ACCESS is required}
      - NTFY_AUTH_TOKENS=${NTFY_AUTH_TOKENS:?NTFY_AUTH_TOKENS is required}
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/lib/ntfy/cache
    ports:
      - "${NTFY_PORT:-8080}:80"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 64M

volumes:
  ntfy-cache:
