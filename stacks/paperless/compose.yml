x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.1.2@sha256:5ab4f4f9bb099a36bec3e092906ea3e611323c5f18dc5cc38c76a1d540bdca9c
    container_name: paperless
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${PAPERLESS_PORT:-8000}:8000"
    volumes:
      - ${PAPERLESS_PATH_DATA:?PAPERLESS_PATH_DATA is required}:/usr/src/paperless/data
      - ${PAPERLESS_PATH_MEDIA:?PAPERLESS_PATH_MEDIA is required}:/usr/src/paperless/media
      - ${PAPERLESS_PATH_CONSUME:-/docker/paperless/consume}:/usr/src/paperless/consume
      - ${PAPERLESS_PATH_EXPORT:-/docker/paperless/export}:/usr/src/paperless/export
    environment:
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY:?PAPERLESS_SECRET_KEY is required}
      - PAPERLESS_URL=${PAPERLESS_URL:-}
      - PAPERLESS_TIME_ZONE=${TZ:-}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER:-}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASS:-}
      - PAPERLESS_ACCOUNT_ALLOW_SIGNUPS=false
      - USERMAP_UID=${PUID:-}
      - USERMAP_GID=${PGID:-}
      # DB
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=${PAPERLESS_DB_HOST:?PAPERLESS_DB_HOST is required}
      - PAPERLESS_DBPORT=${PAPERLESS_DB_PORT:?PAPERLESS_DB_PORT is required}
      - PAPERLESS_DBUSER=${PAPERLESS_DB_USER:?PAPERLESS_DB_USER is required}
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASS:?PAPERLESS_DB_PASS is required}
      - PAPERLESS_DBNAME=${PAPERLESS_DB_NAME:?PAPERLESS_DB_NAME is required}
      # Redis
      - PAPERLESS_REDIS=redis://:${PAPERLESS_REDIS_PASS:?PAPERLESS_REDIS_PASS is required}@${PAPERLESS_REDIS_HOST:?PAPERLESS_REDIS_HOST is required}:${PAPERLESS_REDIS_PORT:-6379}/${PAPERLESS_REDIS_DBINDEX:-0}
      - PAPERLESS_REDIS_PREFIX=${PAPERLESS_REDIS_PREFIX:-PAPERLESS}
      # OCR
      - PAPERLESS_OCR_LANGUAGE=${PAPERLESS_OCR_LANGUAGE:-deu+eng}
      - PAPERLESS_OCR_OUTPUT_TYPE=pdfa
      # Consumption
      - PAPERLESS_CONSUMER_RECURSIVE=true
      - PAPERLESS_CONSUMER_DELETE_DUPLICATES=true
      # Storage
      - PAPERLESS_FILENAME_FORMAT={created_year}/{correspondent}/{title}
      - PAPERLESS_FILENAME_FORMAT_REMOVE_NONE=true
      # Tika
      - PAPERLESS_TIKA_ENABLED=${PAPERLESS_TIKA_ENABLED:-true}
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      # Workers
      - PAPERLESS_TASK_WORKERS=${PAPERLESS_TASK_WORKERS:-2}
      - PAPERLESS_THREADS_PER_WORKER=${PAPERLESS_THREADS_PER_WORKER:-2}
      - PAPERLESS_WEBSERVER_WORKERS=${PAPERLESS_WEBSERVER_WORKERS:-2}
      # OIDC
      - PAPERLESS_APPS=allauth.socialaccount.providers.openid_connect
      - PAPERLESS_SOCIALACCOUNT_PROVIDERS={"openid_connect":{"APPS":[{"provider_id":"authentik","name":"Authentik","client_id":"${PAPERLESS_OIDC_CLIENT_ID:-}","secret":"${PAPERLESS_OIDC_CLIENT_SECRET:-}","settings":{"server_url":"${PAPERLESS_OIDC_SERVER_URL:-}","token_auth_method":"client_secret_basic"}}]}}
      - PAPERLESS_SOCIAL_AUTO_SIGNUP=true
      - PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS=true
      - PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS_CLAIM=groups
      - PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP=tier-admin
      - PAPERLESS_DISABLE_REGULAR_LOGIN=${PAPERLESS_DISABLE_REGULAR_LOGIN:-false}
      - PAPERLESS_REDIRECT_LOGIN_TO_SSO=${PAPERLESS_REDIRECT_LOGIN_TO_SSO:-false}
      - PAPERLESS_ACCOUNT_SESSION_REMEMBER=true
      # Email
      - PAPERLESS_EMAIL_HOST=${PAPERLESS_EMAIL_HOST:-}
      - PAPERLESS_EMAIL_PORT=${PAPERLESS_EMAIL_PORT:-}
      - PAPERLESS_EMAIL_HOST_USER=${PAPERLESS_EMAIL_USER:-}
      - PAPERLESS_EMAIL_HOST_PASSWORD=${PAPERLESS_EMAIL_PASS:-}
      - PAPERLESS_EMAIL_FROM=${PAPERLESS_EMAIL_FROM:-}
      - PAPERLESS_EMAIL_USE_TLS=${PAPERLESS_EMAIL_USE_TLS:-true}
      - PAPERLESS_EMAIL_USE_SSL=${PAPERLESS_EMAIL_USE_SSL:-false}
    depends_on:
      tika:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1536M
        reservations:
          memory: 768M

  tika:
    image: apache/tika:4.0.0@sha256:a8b442501f601fb15015de974f9afe13dd242b0f14e49a2b144fadcb214a555b
    container_name: tika
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9998' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 512M
        reservations:
          memory: 128M

  gotenberg:
    image: gotenberg/gotenberg:8.36.0@sha256:9ced40d1b764b4538d79a7597137f42f0c187499d0f283208b227d1e62c55c3f
    container_name: gotenberg
    restart: unless-stopped
    logging: *default-logging
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 512M
        reservations:
          memory: 128M
