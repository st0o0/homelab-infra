x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.16.3@sha256:5622c95b4e22c6b95d4791563d8ace03ae16e3147e2cdf2016b938dc9341d30a
    container_name: paperless
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${PAPERLESS_PORT:-8000}:8000"
    volumes:
      - ${PAPERLESS_PATH_DATA:?PAPERLESS_PATH_DATA is required}:/usr/src/paperless/data
      - ${PAPERLESS_PATH_MEDIA:?PAPERLESS_PATH_MEDIA is required}:/usr/src/paperless/media
      - ${PAPERLESS_PATH_CONSUME:-/docker/paperless/consume}:/usr/src/paperless/consume
      - ${PAPERLESS_PATH_EXPORT:-/docker/paperless/export}:/usr/src/paperless/export
    environment:
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY:?PAPERLESS_SECRET_KEY is required}
      - PAPERLESS_URL=${PAPERLESS_URL:-}
      - PAPERLESS_TIME_ZONE=${TZ:-}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER:-}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASS:-}
      - PAPERLESS_ACCOUNT_ALLOW_SIGNUPS=false
      - USERMAP_UID=${PUID:-}
      - USERMAP_GID=${PGID:-}
      # DB
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=${PAPERLESS_DB_HOST:?PAPERLESS_DB_HOST is required}
      - PAPERLESS_DBPORT=${PAPERLESS_DB_PORT:-5432}
      - PAPERLESS_DBNAME=${PAPERLESS_DB_NAME:?PAPERLESS_DB_NAME is required}
      - PAPERLESS_DBUSER=${PAPERLESS_DB_USER:?PAPERLESS_DB_USER is required}
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASS:?PAPERLESS_DB_PASS is required}
      # Redis
      - PAPERLESS_REDIS=redis://:${PAPERLESS_REDIS_PASSWORD:?PAPERLESS_REDIS_PASSWORD is required}@${PAPERLESS_REDIS_HOST:?PAPERLESS_REDIS_HOST is required}:${PAPERLESS_REDIS_PORT:-6379}/${PAPERLESS_REDIS_DBINDEX:-0}
      - PAPERLESS_REDIS_PREFIX=${PAPERLESS_REDIS_PREFIX:-PAPERLESS}
      # OCR
      - PAPERLESS_OCR_LANGUAGE=${PAPERLESS_OCR_LANGUAGE:-deu+eng}
      - PAPERLESS_OCR_OUTPUT_TYPE=pdfa
      # Consumption
      - PAPERLESS_CONSUMER_RECURSIVE=true
      - PAPERLESS_CONSUMER_DELETE_DUPLICATES=true
      # Storage
      - PAPERLESS_FILENAME_FORMAT={created_year}/{correspondent}/{title}
      - PAPERLESS_FILENAME_FORMAT_REMOVE_NONE=true
      # Tika
      - PAPERLESS_TIKA_ENABLED=${PAPERLESS_TIKA_ENABLED:-true}
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      # Workers
      - PAPERLESS_TASK_WORKERS=${PAPERLESS_TASK_WORKERS:-2}
      - PAPERLESS_THREADS_PER_WORKER=${PAPERLESS_THREADS_PER_WORKER:-2}
      - PAPERLESS_WEBSERVER_WORKERS=${PAPERLESS_WEBSERVER_WORKERS:-2}
    depends_on:
      tika:
        condition: service_healthy
      gotenberg:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1GB
        reservations:
          memory: 512M

  tika:
    image: apache/tika:latest@sha256:a8b442501f601fb15015de974f9afe13dd242b0f14e49a2b144fadcb214a555b
    container_name: paperless-tika
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9998"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 512M
        reservations:
          memory: 128M

  gotenberg:
    image: gotenberg/gotenberg:8@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
    container_name: paperless-gotenberg
    restart: unless-stopped
    logging: *default-logging
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 512M
        reservations:
          memory: 128M
