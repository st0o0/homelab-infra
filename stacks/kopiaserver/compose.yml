x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  kopiaserver:
    image: kopia/kopia:0.23.1@sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e
    container_name: kopiaserver
    restart: unless-stopped
    logging: *default-logging
    command:
      - server
      - start
      - --address=0.0.0.0:51515
      - --server-control-username=${KOPIA_SERVER_USER:?KOPIA_SERVER_USER is required}
      - --server-control-password=${KOPIA_SERVER_PASS:?KOPIA_SERVER_PASS is required}
      - --tls-generate-cert
      - --insecure
    environment:
      - KOPIA_PASSWORD=${KOPIA_REPO_PASSWORD:?KOPIA_REPO_PASSWORD is required}
      - TZ=${TZ:-}
    healthcheck:
      test: ["CMD", "kopia", "server", "status", "--address=https://localhost:51515", "--server-cert-fingerprint=IGNORE", "--server-control-username=${KOPIA_SERVER_USER}", "--server-control-password=${KOPIA_SERVER_PASS}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 64M
    ports:
      - "${KOPIA_PORT:-51515}:51515"
    volumes:
      - kopia-config:/app/config
      - kopia-cache:/app/cache
      - kopia-logs:/app/logs
      - kopia-repository:/repository

volumes:
  kopia-config:
  kopia-cache:
  kopia-logs:
  kopia-repository:
