x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  blocky:
    image: ghcr.io/0xerr0r/blocky:v0.35.0@sha256:4f165b63db0d76c96ecc47c7a8f57caeedc003a912bdce29abb0e283ce02e16b
    container_name: blocky
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${BLOCKY_PORT_DNS:?BLOCKY_PORT_DNS is required}:53/tcp"
      - "${BLOCKY_PORT_DNS:?BLOCKY_PORT_DNS is required}:53/udp"
      - "${BLOCKY_PORT_HTTP:?BLOCKY_PORT_HTTP is required}:4000/tcp"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - blocky-cache:/app/cache
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          memory: 256M

volumes:
  blocky-cache:
