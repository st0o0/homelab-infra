connectIPVersion: v4

upstreams:
  strategy: parallel_best
  timeout: 2s
  init:
    strategy: blocking
  groups:
    default:
      # Quad9 (Switzerland, non-profit, no IP logging, audited)
      - tcp-tls:9.9.9.9:853
      - tcp-tls:149.112.112.112:853
      # AdGuard unfiltered (Cyprus, no-log, audited)
      - tcp-tls:94.140.14.140:853
      - tcp-tls:94.140.14.141:853
      # DNS4EU unfiltered (EU, GDPR-compliant)
      - tcp-tls:86.54.11.100:853#unfiltered.joindns4.eu
      - tcp-tls:86.54.11.200:853#unfiltered.joindns4.eu

bootstrapDns:
  - upstream: 9.9.9.9
  - upstream: 149.112.112.112

filtering:
  queryTypes:
    - AAAA

fqdnOnly:
  enable: true

blocking:
  blockType: zeroIp
  blockTTL: 5m

  denylists:
    default:
      # HaGeZi Multi Pro — ads, trackers, malware, phishing, scam
      - https://hagezi-mirror.dnsbunker.org/wildcard/pro.txt
      # HaGeZi Threat Intelligence — active malware/C2/phishing feeds
      - https://hagezi-mirror.dnsbunker.org/wildcard/tif.txt
      # HaGeZi Pop-Up Ads
      - https://hagezi-mirror.dnsbunker.org/wildcard/popupads.txt
      # HaGeZi DoH/VPN/Proxy Bypass Prevention
      - https://hagezi-mirror.dnsbunker.org/wildcard/doh-vpn-proxy-bypass.txt
      # Category blocks
      - https://raw.githubusercontent.com/blocklistproject/Lists/master/gambling.txt
      - https://raw.githubusercontent.com/blocklistproject/Lists/master/crypto.txt
      - https://raw.githubusercontent.com/blocklistproject/Lists/master/piracy.txt
      - https://raw.githubusercontent.com/blocklistproject/Lists/master/porn.txt
      # German: Axel Springer
      - https://raw.githubusercontent.com/autinerd/anti-axelspringer-hosts/master/axelspringer-hosts
      # Twitter
      - https://blocklistproject.github.io/Lists/twitter.txt
      # Manual blacklist
      - |
        adservice.google.ch
        adservice.google.com
        doubleclick.net
        www.facebook.com
        rittal.com
        bintube.com

  allowlists:
    default:
      - |
        android.clients.google.com
        clients4.google.com
        clients2.google.com
        clients3.google.com
        ec-ns.sascdn.com
        connectivitycheck.android.com
        connectivitycheck.gstatic.com
        appspot-preview.l.google.com
        storage.signal.org
        cdn.signal.org
        udates2.signal.org
        textsecure-secure.whispersystems.org
        x.com
        cc-api-data.adobe.io

  clientGroupsBlock:
    default:
      - default

  loading:
    strategy: fast
    refreshPeriod: 12h
    concurrency: 8
    maxErrorsPerSource: 5
    downloads:
      timeout: 120s
      attempts: 5
      cooldown: 2s
      cachePath: /app/cache

customDNS:
  filterUnmappedTypes: true
  mapping:
    use-application-dns.net: 0.0.0.0
    mask.icloud.com: 0.0.0.0
    mask-h2.icloud.com: 0.0.0.0

rebindingProtection:
  enable: true

rateLimit:
  enable: true
  rate: 80
  burst: 160

caching:
  maxItemsCount: 50000
  minTime: 5m
  maxTime: 30m
  prefetching: true
  prefetchExpires: 2h
  prefetchThreshold: 5
  prefetchMaxItemsCount: 10000
  cacheTimeNegative: 30m

log:
  level: info
  format: text
  privacy: true

ports:
  dns: 53
  http: 4000

prometheus:
  enable: true
  path: /metrics

queryLog:
  type: none

statistics:
  enable: true

specialUseDomains:
  rfc6762-appendixG: true

ede:
  enable: false
