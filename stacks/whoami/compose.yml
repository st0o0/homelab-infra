x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  whoami:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    container_name: whoami
    restart: always
    logging: *default-logging
    environment:
      - TZ=${TZ:-}
    ports:
      - "${WHOAMI_PORT:-8080}:80"
    deploy:
      resources:
        limits:
          cpus: 0.05
          memory: 32M
        reservations:
          memory: 16M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
