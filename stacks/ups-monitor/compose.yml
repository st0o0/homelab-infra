# Keep container logs from growing unbounded
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  nut-exporter:
    image: hon95/prometheus-nut-exporter:1.3.1
    container_name: nut-exporter
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TZ=${TZ:-Europe/Berlin}
      # NUT server (upsd) running on the host
      - NUT_EXPORTER_SERVER=${NUT_EXP_SERVER:?NUT_EXP_SERVER is required}
      - NUT_EXPORTER_SERVER_PORT=${NUT_EXP_SERVER_PORT:?NUT_EXP_SERVER_PORT is required}
      - NUT_EXPORTER_USERNAME=${NUT_EXP_USER:?NUT_EXP_USER is required}
      - NUT_EXPORTER_PASSWORD=${NUT_EXP_PASS:?NUT_EXP_PASS is required}
    ports:
      - "${NUT_EXP_PORT:-9199}:9995"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: 0.10
          memory: 64M
        reservations:
          memory: 32M
