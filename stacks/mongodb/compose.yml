x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mongo:
    image: mongo:8.3.8@sha256:44dce4b1688969ff3fdbfc438fd6113f734140ad96e3639ef17ee26a162dfb58
    container_name: mongodb
    restart: always
    logging: *default-logging
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS:?MONGO_ROOT_PASS is required}
      - TZ=${TZ:-}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${MONGO_PATH_DATA:?MONGO_PATH_DATA is required}:/data/db
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          memory: 256M

networks:
  db-net:
    external: true
