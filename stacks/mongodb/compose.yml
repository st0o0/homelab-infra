x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mongo:
    image: mongo:7.0.43@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    container_name: mongodb
    restart: always
    logging: *default-logging
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS:?MONGO_ROOT_PASS is required}
      - TZ=${TZ:-}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${MONGO_PATH_DATA:?MONGO_PATH_DATA is required}:/data/db
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 1G
        reservations:
          memory: 512M

networks:
  db-net:
    external: true
