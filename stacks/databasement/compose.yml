x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  databasement:
    image: davidcrty/databasement:latest
    container_name: databasement
    restart: always
    logging: *default-logging
    environment:
      - APP_KEY=${DATABASEMENT_APP_KEY:?DATABASEMENT_APP_KEY is required}
      - APP_URL=${DATABASEMENT_APP_URL:-http://localhost:2226}
      - APP_ENV=${DATABASEMENT_APP_ENV:-production}
      - APP_DEBUG=${DATABASEMENT_APP_DEBUG:-false}
      - DB_CONNECTION=pgsql
      - DB_HOST=${DATABASEMENT_DB_HOST:-postgres}
      - DB_PORT=${DATABASEMENT_DB_PORT:-5432}
      - DB_DATABASE=${DATABASEMENT_DB_NAME:-databasement}
      - DB_USERNAME=${DATABASEMENT_DB_USER:-postgres}
      - DB_PASSWORD=${DATABASEMENT_DB_PASS:?DATABASEMENT_DB_PASS is required}
      - QUEUE_CONNECTION=${DATABASEMENT_QUEUE_CONNECTION:-database}
      - CACHE_STORE=${DATABASEMENT_CACHE_STORE:-database}
      - SESSION_DRIVER=${DATABASEMENT_SESSION_DRIVER:-database}
      - TZ=${TZ:-}
    ports:
      - "${DATABASEMENT_BIND_IP:-127.0.0.1}:${DATABASEMENT_PORT:-2226}:2226"
    volumes:
      - ${DATABASEMENT_PATH_DATA:-./data}:/var/www/html/storage
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2226/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  db-net:
    external: true
