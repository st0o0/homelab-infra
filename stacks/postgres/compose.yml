x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    container_name: postgres
    restart: always
    logging: *default-logging
    environment:
      - POSTGRES_USER=${PG_USER:-}
      - POSTGRES_PASSWORD=${PG_PASS:?PG_PASS is required}
      - POSTGRES_DB=${PG_DB:-}
      - TZ=${TZ:-Europe/Berlin}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ${PG_PATH_DATA:?PG_PATH_DATA is required}:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "password_encryption=scram-sha-256"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 768M
        reservations:
          memory: 384M

networks:
  db-net:
    external: true
