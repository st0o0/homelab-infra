x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    container_name: postgres
    restart: always
    logging: *default-logging
    environment:
      - POSTGRES_USER=${PG_USER:-}
      - POSTGRES_PASSWORD=${PG_PASS:?PG_PASS is required}
      - POSTGRES_DB=${PG_DB:-}
      - TZ=${TZ:-}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ${PG_PATH_DATA:?PG_PATH_DATA is required}:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "password_encryption=scram-sha-256"
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 768M
        reservations:
          memory: 384M

networks:
  db-net:
    external: true
