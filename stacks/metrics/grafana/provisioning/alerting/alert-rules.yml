        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "VM {{ $labels.name }} on {{ $labels.node }} just stopped unexpectedly"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
