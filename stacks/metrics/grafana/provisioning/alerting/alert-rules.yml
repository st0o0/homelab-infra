apiVersion: 1

deleteRules:
  - orgId: 1
    uid: guest-unexpectedly-stopped
  - orgId: 1
    uid: guest-not-backed-up
  - orgId: 1
    uid: container-down
  - orgId: 1
    uid: container-unhealthy
  - orgId: 1
    uid: vm-not-backed-up
  - orgId: 1
    uid: pihole-down
  - orgId: 1
    uid: pihole-all-down
  - orgId: 1
    uid: blocky-all-down

groups:
  - orgId: 1
    name: infrastructure
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: host-down
        title: HostDown
        condition: C
        for: 2m
        keep_firing_for: 5m
        is_paused: false
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.host }} is down -- no metrics received for 2 minutes"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: max by(host) (up{host!=""})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: high-cpu
        title: HighCPU
        condition: C
        for: 5m
        keep_firing_for: 10m
        is_paused: false
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} CPU at {{ printf \"%.0f\" $values.A.Value }}%"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: 100 - (avg by(host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: high-memory
        title: HighMemory
        condition: C
        for: 5m
        keep_firing_for: 10m
        is_paused: false
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} memory at {{ printf \"%.0f\" $values.A.Value }}%"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: (1 - avg by(host) (node_memory_MemAvailable_bytes) / avg by(host) (node_memory_MemTotal_bytes)) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: high-swap
        title: HighSwap
        condition: C
        for: 5m
        keep_firing_for: 10m
        is_paused: false
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} swap at {{ printf \"%.0f\" $values.A.Value }}%"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) * 100 and node_memory_SwapTotal_bytes > 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: disk-almost-full
        title: DiskAlmostFull
        condition: C
        for: 10m
        keep_firing_for: 10m
        is_paused: false
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} at {{ printf \"%.0f\" $values.A.Value }}%"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay", mountpoint!~"/boot.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay", mountpoint!~"/boot.*"}) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: disk-critical
        title: DiskCritical
        condition: C
        for: 5m
        keep_firing_for: 5m
        is_paused: false
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} at {{ printf \"%.0f\" $values.A.Value }}%"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay", mountpoint!~"/boot.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay", mountpoint!~"/boot.*"}) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [95]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

  - orgId: 1
    name: containers
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: container-restarting
        title: ContainerRestarting
        condition: C
        for: 2m
        keep_firing_for: 10m
        is_paused: false
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} ({{ $labels.host }}) restarted >3 times in 10m"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: max by(name, host) (changes(container_start_time_seconds{name!=""}[10m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: container-memory-limit
        title: ContainerMemoryLimit
        condition: C
        for: 5m
        keep_firing_for: 10m
        is_paused: false
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} ({{ $labels.host }}) at {{ printf \"%.0f\" $values.A.Value }}% mem limit"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: max by(name, host) (container_memory_working_set_bytes{name!~"|geoipupdate"} / container_spec_memory_limit_bytes{name!~"|geoipupdate"}) * 100 and max by(name, host) (container_spec_memory_limit_bytes{name!~"|geoipupdate"}) > 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: container-disappeared
        title: ContainerDisappeared
        condition: C
        for: 5m
        keep_firing_for: 10m
        is_paused: false
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} ({{ $labels.host }}) has stopped"
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: max by(name, host) (last_over_time(container_memory_working_set_bytes{name!~"|geoipupdate|configarr|tentacle"}[1h])) unless max by(name, host) (container_memory_working_set_bytes{name!~"|geoipupdate|configarr|tentacle"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

