apiVersion: 1

deleteRules:
  - orgId: 1
    uid: guest-unexpectedly-stopped
  - orgId: 1
    uid: guest-not-backed-up
  - orgId: 1
    uid: container-down
  - orgId: 1
    uid: container-unhealthy
  - orgId: 1
    uid: vm-not-backed-up

groups:
  - orgId: 1
    name: infrastructure
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: host-down
        title: HostDown
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.host }} is down — no metrics received for 2 minutes"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: up{host!=""}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: high-cpu
        title: HighCPU
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host {{ $labels.host }} CPU usage above 90% for 5 minutes"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: 100 - (avg by(host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: high-memory
        title: HighMemory
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host {{ $labels.host }} memory usage above 90% for 5 minutes"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: (1 - avg by(host) (node_memory_MemAvailable_bytes) / avg by(host) (node_memory_MemTotal_bytes)) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: disk-almost-full
        title: DiskAlmostFull
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host {{ $labels.host }} filesystem {{ $labels.mountpoint }} is {{ $value }}% full"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: disk-critical
        title: DiskCritical
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Host {{ $labels.host }} filesystem {{ $labels.mountpoint }} is {{ $value }}% full"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [95]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

  - orgId: 1
    name: containers
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: container-restarting
        title: ContainerRestarting
        condition: C
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.host }} has restarted more than 3 times in 10 minutes"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: changes(container_start_time_seconds{name!=""}[10m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C


      - uid: container-memory-limit
        title: ContainerMemoryLimit
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.host }} is using {{ $value }}% of its memory limit"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) * 100 and container_spec_memory_limit_bytes{name!=""} > 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C


  - orgId: 1
    name: databases
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: postgres-connections-high
        title: PostgresConnectionsHigh
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres {{ $labels.server }} active connections at {{ $value }}% of max"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: pg_stat_activity_count{state="active"} / pg_settings_max_connections * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: redis-memory-high
        title: RedisMemoryHigh
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage at {{ $value }}% of maxmemory"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: redis_memory_used_bytes / redis_memory_max_bytes * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: redis-evictions
        title: RedisEvictions
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis is evicting keys — memory pressure detected"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: rate(redis_evicted_keys_total[5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: mongo-connections-high
        title: MongoConnectionsHigh
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MongoDB connections at {{ $value }}% of limit"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: mongodb_connections_current / mongodb_connections_available * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: pihole-down
        title: PiholeDown
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pi-hole exporter scrape failed — DNS may be down"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: up{job="pihole"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

  - orgId: 1
    name: proxmox
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: pve-node-down
        title: PveNodeDown
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox node {{ $labels.node }} is down"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: pve_node_up
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: vm-unexpectedly-stopped
        title: VmUnexpectedlyStopped
        condition: C
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "VM {{ $labels.name }} on {{ $labels.node }} just stopped unexpectedly"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: changes(pve_vm_status[5m]) > 0 and pve_vm_status == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: lxc-unexpectedly-stopped
        title: LxcUnexpectedlyStopped
        condition: C
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "LXC {{ $labels.name }} on {{ $labels.node }} just stopped unexpectedly"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: changes(pve_lxc_status[5m]) > 0 and pve_lxc_status == 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: pve-storage-almost-full
        title: PveStorageAlmostFull
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PVE storage {{ $labels.storage }} on {{ $labels.node }} is {{ $value }}% full"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: pve_storage_used_fraction * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: pve-storage-critical
        title: PveStorageCritical
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: PVE storage {{ $labels.storage }} on {{ $labels.node }} is {{ $value }}% full"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: pve_storage_used_fraction * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [95]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

