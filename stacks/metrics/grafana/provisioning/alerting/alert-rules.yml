      - uid: scrape-target-down
        title: ScrapeTargetDown
        condition: C
        for: 5m
        keep_firing_for: 5m
        is_paused: false
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.host }} is not reachable"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
