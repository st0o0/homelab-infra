apiVersion: 1

groups:
  - orgId: 1
    name: infrastructure
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: host-down
        title: HostDown
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.host }} is down — no metrics received for 2 minutes"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: up{host!=""}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: high-cpu
        title: HighCPU
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host {{ $labels.host }} CPU usage above 90% for 5 minutes"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: 100 - (avg by(host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: high-memory
        title: HighMemory
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host {{ $labels.host }} memory usage above 90% for 5 minutes"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: disk-almost-full
        title: DiskAlmostFull
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host {{ $labels.host }} filesystem {{ $labels.mountpoint }} is {{ $value }}% full"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: disk-critical
        title: DiskCritical
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Host {{ $labels.host }} filesystem {{ $labels.mountpoint }} is {{ $value }}% full"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [95]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

  - orgId: 1
    name: containers
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: container-restarting
        title: ContainerRestarting
        condition: C
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.host }} has restarted more than 3 times in 10 minutes"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: increase(container_start_time_seconds{name!=""}[10m]) > 3
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: container-down
        title: ContainerDown
        condition: C
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.host }} is not running"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: absent_over_time(container_cpu_usage_seconds_total{name!=""}[3m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C
