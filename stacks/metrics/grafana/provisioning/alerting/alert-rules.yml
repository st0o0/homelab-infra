    rules:
      - uid: container-restarting
        title: ContainerRestarting
        condition: C
        for: 2m
        keep_firing_for: 10m
        is_paused: false
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} ({{ $labels.host }}) restarted >3 times in 10m"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: max by(name, host) (changes(container_start_time_seconds{name!=""}[10m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: container-memory-limit
        title: ContainerMemoryLimit
        condition: C
        for: 5m
        keep_firing_for: 10m
        is_paused: false
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} ({{ $labels.host }}) at {{ printf \"%.0f\" $values.A.Value }}% mem limit"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: max by(name, host) (container_memory_working_set_bytes{name!~"|geoipupdate"} / container_spec_memory_limit_bytes{name!~"|geoipupdate"}) * 100 and max by(name, host) (container_spec_memory_limit_bytes{name!~"|geoipupdate"}) > 0
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

      - uid: container-disappeared
        title: ContainerDisappeared
        condition: C
        for: 5m
        keep_firing_for: 10m
        is_paused: false
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} ({{ $labels.host }}) has stopped"
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: max by(name, host) (last_over_time(container_memory_working_set_bytes{name!~"|geoipupdate"}[1h])) unless max by(name, host) (container_memory_working_set_bytes{name!~"|geoipupdate"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              type: threshold
              expression: "A"
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C

