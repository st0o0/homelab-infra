apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: discord-homelab
        type: discord
        settings:
          url: $DISCORD_WEBHOOK_URL
          use_discord_username: true
          message: |
            {{ range .Alerts }}
            **{{ .Status | toUpper }}** {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }}
            **{{ .Labels.alertname }}** on `{{ .Labels.host }}`
            {{ .Annotations.summary }}
            {{ end }}
