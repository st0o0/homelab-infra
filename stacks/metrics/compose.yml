# Keep container logs from growing unbounded
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS:?GRAFANA_ADMIN_PASS is required}
      - GF_USERS_ALLOW_SIGN_UP=${GRAFANA_ALLOW_SIGN_UP:-false}
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource,victoriametrics-metrics-datasource
      # Set when running behind a reverse proxy, e.g. https://grafana.example.com/
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/
      # No phone-home, no update banner, no news feed
      - GF_ANALYTICS_REPORTING_ENABLED=${GRAFANA_ANALYTICS_REPORTING:-false}
      - GF_ANALYTICS_CHECK_FOR_UPDATES=${GRAFANA_CHECK_FOR_UPDATES:-false}
      - GF_NEWS_NEWS_FEED_ENABLED=${GRAFANA_NEWS_FEED:-false}
      - GF_DATABASE_TYPE=${GRAFANA_DB_TYPE:-}
      - GF_DATABASE_HOST=${GRAFANA_DB_HOST:-}
      - GF_DATABASE_NAME=${GRAFANA_DB_NAME:-}
      - GF_DATABASE_USER=${GRAFANA_DB_USER:-}
      - GF_DATABASE_PASSWORD=${GRAFANA_DB_PASS:-}
      - GF_DATABASE_SSL_MODE=${GRAFANA_DB_SSL_MODE:-disable}
      - GF_UNIFIED_ALERTING_ENABLED=${GRAFANA_UNIFIED_ALERTING_ENABLED:-}
      - GF_DATAPROXY_TIMEOUT=${GRAFANA_DATAPROXY_TIMEOUT:-60}
      - GF_DATAPROXY_MAX_CONC_HTTP_REQ=${GRAFANA_DATAPROXY_MAX_CONC_HTTP_REQ:-50}
      - DISCORD_WEBHOOK_URL=${GRAFANA_DISCORD_WEBHOOK_URL:-}
      - TZ=${TZ:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          memory: 256M

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.148.0@sha256:407013e902f9a0ba1d4b2d4c077c47bbaf917c893c52ff39b19efe83a654afda
    container_name: victoriametrics
    restart: unless-stopped
    logging: *default-logging
    command:
      - --storageDataPath=/storage
      - --retentionPeriod=${VM_RETENTION:-90d}
      - --httpListenAddr=:8428
      # Deduplication window — keep in sync with the Alloy scrape interval
      - --dedup.minScrapeInterval=${VM_SCRAPE_INTERVAL:-30s}
      - --search.cacheTimestampOffset=${VM_CACHE_TIMESTAMP_OFFSET:-10m}
      - --memory.allowedPercent=${VM_MEMORY_ALLOWED_PERCENT:-70}
      - --search.maxConcurrentRequests=${VM_MAX_CONCURRENT_REQUESTS:-8}
      - --search.maxMemoryPerQuery=${VM_MAX_MEMORY_PER_QUERY:-256MB}
      - --search.maxUniqueTimeseries=${VM_MAX_UNIQUE_TIMESERIES:-50000}
      - --search.maxQueryDuration=${VM_MAX_QUERY_DURATION:-60s}
      - --smallMergeConcurrency=${VM_SMALL_MERGE_CONCURRENCY:-1}
      - --maxLabelsPerTimeseries=${VM_MAX_LABELS_PER_TIMESERIES:-35}
      # VictoriaMetrics scrapes its own internals (vm_* metrics)
      - --selfScrapeInterval=${VM_SELF_SCRAPE_INTERVAL:-30s}
    ports:
      # Loopback by default; set VM_BIND_IP to the WireGuard IP
      # (e.g. 10.77.32.1) to accept remote observability agents.
      - "${VM_PORT:-8428}:8428"
    volumes:
      - ${VM_PATH_DATA:?VM_PATH_DATA is required}:/storage
    healthcheck:
      test: wget -qO- http://127.0.0.1:8428/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 3G
        reservations:
          memory: 1.5G

  vmalert:
    image: victoriametrics/vmalert:v1.149.0@sha256:1a134a67005efd1891d9abb50ddeacfe08f0c8d2f5fb6ae9b7fc91268bdbe59b
    container_name: vmalert
    restart: unless-stopped
    logging: *default-logging
    command:
      - --datasource.url=http://victorialogs:9428
      - --remoteWrite.url=http://victoriametrics:8428
      - --remoteRead.url=http://victoriametrics:8428
      - --rule=/etc/vmalert/rules/*.yml
      - --rule.defaultRuleType=vlogs
      - --httpListenAddr=:8880
    volumes:
      - ./vmalert/rules:/etc/vmalert/rules:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 64M

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e
    container_name: victorialogs
    restart: unless-stopped
    logging: *default-logging
    command:
      - --storageDataPath=/storage
      - --retentionPeriod=${VL_RETENTION:-90d}
      - --httpListenAddr=:9428
      # Push internal metrics to VictoriaMetrics (like VM's selfScrapeInterval)
      - --pushmetrics.url=http://victoriametrics:8428/api/v1/import/prometheus
      - --pushmetrics.interval=${VL_PUSH_METRICS_INTERVAL:-30s}
      - --pushmetrics.extraLabel=job="victoria-logs"
      - --memory.allowedPercent=${VL_MEMORY_ALLOWED_PERCENT:-60}
      - --search.maxConcurrentRequests=${VL_MAX_CONCURRENT_REQUESTS:-6}
      - --maxConcurrentInserts=${VL_MAX_CONCURRENT_INSERTS:-3}
      - --storage.minFreeDiskSpaceBytes=${VL_MIN_FREE_DISK_SPACE:-100MB}
    ports:
      # Loopback by default; set VLOGS_BIND_IP to the WireGuard IP
      # (e.g. 10.77.32.1) to accept remote observability agents.
      - "${VL_PORT:-9428}:9428"
    volumes:
      - ${VL_PATH_DATA:-./data/victorialogs}:/storage
    # Image is scratch-based (no shell, no wget/curl), so a
    # CMD-SHELL healthcheck cannot work. Grafana uses service_started.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          memory: 256M

volumes:
  grafana-data:
