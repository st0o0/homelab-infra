x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.8.3@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe
    container_name: homeassistant
    restart: always
    logging: *default-logging
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - ${HA_SERIAL_DEVICE:-/dev/serial1}:/dev/serial1
    ports:
      - "${HA_PORT:-8123}:8123"
    networks:
      default:
        mac_address: ${HA_MAC_DEFAULT:-02:42:ac:11:00:02}
      vlan88:
        mac_address: ${HA_MAC_VLAN:-02:42:ac:12:00:02}
        ipv4_address: ${HA_VLAN_IP:-10.44.88.254}
    environment:
      - TZ=${TZ:-}
      - HA_RECORDER_DB_URL=${HA_RECORDER_DB_URL:-}
    volumes:
      - ${HA_PATH_CONFIG:-./homeassistant/data}:/config
      - ./homeassistant/configuration.yaml:/config/configuration.yaml:ro
      - ./homeassistant/packages:/config/packages:ro
      - ./homeassistant/dashboards:/config/dashboards:ro
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 768M

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    container_name: mosquitto
    restart: always
    logging: *default-logging
    volumes:
      - ${MQTT_PATH_CONFIG:-./mosquitto/config}:/mosquitto/config
      - ${MQTT_PATH_DATA:-./mosquitto/data}:/mosquitto/data
      - ${MQTT_PATH_LOG:-./mosquitto/log}:/mosquitto/log
    ports:
      - "${MQTT_PORT:-8124}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.12.1@sha256:80f7f04f72a99e4c4ef51ef7e98ee736edba6db0ecbb7abc626d0c4b0f1871f1
    container_name: zigbee2mqtt
    restart: always
    logging: *default-logging
    depends_on:
      - mqtt
    volumes:
      - ${Z2M_PATH_DATA:-./zigbee2mqtt/data}:/app/data
    environment:
      - TZ=${TZ:-}
    ports:
      - "${Z2M_PORT:-8125}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  matterjs-server:
    image: ghcr.io/matter-js/matterjs-server:1.2.8@sha256:cb5696f5d5584d63bcc22eea1565e21d0de9c41e86f212bf2fe5bce21f95897d
    container_name: matterjs-server
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    environment:
      - LOG_LEVEL=${MATTER_LOG_LEVEL:-info}
      - BLE_PROXY=${MATTER_BLE_PROXY:-true}
    volumes:
      - ${MATTER_PATH_DATA:-./matter/data}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-m", "5", "http://localhost:5580/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  njord:
    image: ghcr.io/st0o0/njord:0.3.0@sha256:d8f21389875bfa35006e1119df512e97be3ea11b6fb623dd09cc0f75a286c496
    container_name: njord
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    volumes:
      - njord-data:/app/data
    environment:
      - ASPNETCORE_URLS=http://+:${NJORD_PORT:-9090}
      - Kestrel__Endpoints__health__Url=http://+:${NJORD_HEALTH_PORT:-9091}
      - Njord__PollInterval=${NJORD_POLL_INTERVAL:-01:00:00}
      - Njord__ForecastDays=${NJORD_FORECAST_DAYS:-7}
      - Njord__Horizons__0=1
      - Njord__Horizons__1=2
      - Njord__Horizons__2=3
      - Njord__Horizons__3=4
      - Njord__Horizons__4=5
      - Njord__Horizons__5=6
      - Njord__Horizons__6=7
      - Njord__Horizons__7=8
      - Njord__Horizons__8=9
      - Njord__Horizons__9=10
      - Njord__Horizons__10=11
      - Njord__Horizons__11=12
      - Njord__Horizons__12=18
      - Njord__Horizons__13=24
      - Njord__Horizons__14=36
      - Njord__Horizons__15=48
      - Njord__Horizons__16=72
      - Njord__Horizons__17=96
      - Njord__Models__0=icon_global
      - Njord__Models__1=ecmwf_ifs025
      - Njord__Models__2=icon_eu
      - Njord__Models__3=arpege_europe
      - Njord__Models__4=ukmo_seamless
      - Njord__Models__5=gfs_seamless
      - Njord__Models__6=dmi_harmonie_arome_europe
      - Njord__Models__7=knmi_harmonie_arome_europe
      - Njord__Locations__0__Name=${NJORD_LOCATION_NAME:?NJORD_LOCATION_NAME is required}
      - Njord__Locations__0__Latitude=${NJORD_LOCATION_LAT:?NJORD_LOCATION_LAT is required}
      - Njord__Locations__0__Longitude=${NJORD_LOCATION_LON:?NJORD_LOCATION_LON is required}
      - Njord__Locations__0__Models__0=knmi_harmonie_arome_netherlands
      - Njord__Locations__0__Models__1=icon_d2
      - Njord__Parameters__Groups__0=Weather
      - Njord__Enrichment__Consensus__Enabled=true
      - Njord__Enrichment__Alerts__Enabled=true
      - Njord__Enrichment__Alerts__PressureDropThreshold=1
      - Njord__Enrichment__Indices__Enabled=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${NJORD_HEALTH_PORT:-9091}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  njord-data:

networks:
  default:
    driver: bridge
  vlan88:
    driver: macvlan
    driver_opts:
      parent: ${HA_VLAN_PARENT:-vlan88}
    ipam:
      config:
        - subnet: ${HA_VLAN_SUBNET:-10.44.88.0/24}
