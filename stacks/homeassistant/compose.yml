x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.3@sha256:407b89cd11a8cb67d388d21739a226c74acbbebe1ac59e3b83b11b43ce76b98f
    container_name: homeassistant
    restart: always
    logging: *default-logging
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - ${HA_SERIAL_DEVICE:-/dev/serial1}:/dev/serial1
    ports:
      - "${HA_PORT:-8123}:8123"
    networks:
      default:
        mac_address: ${HA_BRIDGE_MAC:?HA_BRIDGE_MAC is required}
      iot:
        mac_address: ${HA_IOT_MAC:?HA_IOT_MAC is required}
        ipv4_address: ${HA_IOT_IP:?HA_IOT_IP is required}
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - HA_RECORDER_DB_URL=${HA_RECORDER_DB_URL:-sqlite:////config/home-assistant_v2.db}
    volumes:
      - ${HA_PATH_CONFIG:-./homeassistant/data}:/config
      - ./homeassistant/configuration.yaml:/config/configuration.yaml:ro
      - ./homeassistant/packages:/config/packages:ro
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    container_name: mosquitto
    restart: always
    logging: *default-logging
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${MQTT_PATH_CONFIG:-./mosquitto/config}:/mosquitto/config
      - ${MQTT_PATH_DATA:-./mosquitto/data}:/mosquitto/data
      - ${MQTT_PATH_LOG:-./mosquitto/log}:/mosquitto/log
    ports:
      - "${MQTT_PORT:-8124}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
    container_name: zigbee2mqtt
    restart: always
    logging: *default-logging
    depends_on:
      - mqtt
    volumes:
      - ${Z2M_PATH_DATA:-./zigbee2mqtt/data}:/app/data
    environment:
      - TZ=${TZ:-Europe/Berlin}
    ports:
      - "${Z2M_PORT:-8125}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  matterjs-server:
    image: ghcr.io/matter-js/matterjs-server:1.5.4@sha256:b7f4f6c888ece6214a0720ab68c3a46654c71c6d34d01ef1850095d210c0615b
    container_name: matterjs-server
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    environment:
      - LOG_LEVEL=${MATTER_LOG_LEVEL:-info}
      - BLE_PROXY=${MATTER_BLE_PROXY:-true}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${MATTER_PATH_DATA:-./matter/data}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-m", "5", "http://localhost:5580/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  default:
    driver: bridge
  iot:
    driver: macvlan
    driver_opts:
      parent: ${HA_IOT_PARENT:?HA_IOT_PARENT is required}
    ipam:
      config:
        - subnet: ${HA_IOT_SUBNET:?HA_IOT_SUBNET is required}
