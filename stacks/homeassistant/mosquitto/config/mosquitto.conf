# =============================================================================
# Mosquitto broker config — tuned for a small home MQTT deployment
# (Home Assistant + Zigbee2MQTT as the only real clients).
# =============================================================================

listener 1883
protocol mqtt

# No credential store is provisioned in this repo yet; anonymous access is
# required for Home Assistant/Zigbee2MQTT to connect out of the box.
# To lock this down: `mosquitto_passwd -c /mosquitto/config/passwd <user>`,
# mount the file, then set `allow_anonymous false` and `password_file`.
allow_anonymous true

# --- Persistence / reliability ---
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
# Keep offline-client state (retained subs, QoS>0 queue) around across broker
# restarts instead of dropping it immediately — avoids missed Z2M/HA state on
# reconnect after a brief outage.
persistent_client_expiration 7d

# Queue generously per-client so a short HA/Z2M restart doesn't drop messages,
# but cap it so one flaky client can't exhaust broker memory.
max_queued_messages 5000
max_queued_bytes 0
queue_qos0_messages false
max_inflight_messages 40

# --- Performance ---
# Zigbee2MQTT publishes lots of small retained state messages; keep the
# message size limit unbounded (0) since payloads are tiny anyway.
message_size_limit 0
max_connections -1
sys_interval 30

# --- Logging ---
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
connection_messages true
