                  double_tap_action:
                    action: none
                - type: markdown
                  content: |-
                    {% set level_colors = {0:'#c5e566', 1:'#ffeb3b', 2:'#fb8c00', 3:'#e53935', 4:'#880e4f', 20:'#fe68fe', 50:'#fe68fe', 51:'#9e46f8'} %} {% set current_count = state_attr("sensor.vreden_weather_warnings_aktuelle_warnstufe", "warning_count") %} {% set advance_count = state_attr("sensor.vreden_weather_warnings_vorwarnstufe", "warning_count") %} {% if ((current_count == 0) and (advance_count == 0)) %} **<font color={{ level_colors[0] }}>Keine Warnungen</font>** {% else %}
                      {% for i in range(current_count) %}
                        {% set headline = state_attr("sensor.vreden_weather_warnings_aktuelle_warnstufe", "warning_" ~ loop.index ~ "_headline") %}
                        {% set description = state_attr("sensor.vreden_weather_warnings_aktuelle_warnstufe", "warning_" ~ loop.index ~ "_description") %}
                        {% set level = state_attr("sensor.vreden_weather_warnings_aktuelle_warnstufe", "warning_" ~ loop.index ~ "_level") %}
                        {% set time_start = state_attr("sensor.vreden_weather_warnings_aktuelle_warnstufe", "warning_" ~ loop.index ~ "_start") %}
                        {% set time_end = state_attr("sensor.vreden_weather_warnings_aktuelle_warnstufe", "warning_" ~ loop.index ~ "_end") %}
                      **<font color={{ level_colors[level] if level_colors[level] is defined else level_colors[1] }}>{{ headline }}</font>**
                      {{ time_start.strftime("%a %H:%M") ~ " - " ~ time_end.strftime("%a %H:%M") }}
                      *{{ description|trim }}*
                      {% if not loop.last %}***{% endif %}
                      {% endfor %}
                      {% if ((current_count != 0) and (advance_count != 0)) %}***{% endif %}
                      {% for i in range(advance_count) %}
                        {% set headline = state_attr("sensor.vreden_weather_warnings_vorwarnstufe", "warning_" ~ loop.index ~ "_headline") %}
                        {% set description = state_attr("sensor.vreden_weather_warnings_vorwarnstufe", "warning_" ~ loop.index ~ "_description") %}
                        {% set level = state_attr("sensor.vreden_weather_warnings_vorwarnstufe", "warning_" ~ loop.index ~ "_level") %}
                        {% set time_start = state_attr("sensor.vreden_weather_warnings_vorwarnstufe", "warning_" ~ loop.index ~ "_start") %}
                        {% set time_end = state_attr("sensor.vreden_weather_warnings_vorwarnstufe", "warning_" ~ loop.index ~ "_end") %}
                      **<font color={{ level_colors[level] }}>{{ headline }}</font>**
                      {{ time_start.strftime("%a %H:%M") ~ " - " ~ time_end.strftime("%a %H:%M") }}
                      *{{ description }}*
                      {% if not loop.last %}***{% endif %}
                      {% endfor %}
                    {% endif %}
                  title: DWD Warnungen
          - type: conditional
            conditions:
              - condition: or
                conditions:
