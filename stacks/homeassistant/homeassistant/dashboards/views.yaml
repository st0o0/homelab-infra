views:
  - title: Schlafzimmer
    cards: []
    icon: mdi:bed-king-outline
    subview: true
    badges:
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: sensor.alpstuga_air_quality_monitor_luftfeuchtigkeit
        color: state
        show_entity_picture: true
        tap_action:
          action: none
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        color: state
        entity: sensor.alpstuga_air_quality_monitor_temperatur
        show_entity_picture: false
        tap_action:
          action: none
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: sensor.alpstuga_air_quality_monitor_kohlendioxid
        name: CO2
        tap_action:
          action: none
        color: white
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: sensor.alpstuga_air_quality_monitor_pm25
        color: white
        tap_action:
          action: none
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: sensor.alpstuga_air_quality_monitor_luftqualitat
        color: white
        tap_action:
          action: none
    type: sections
    sections:
      - type: grid
        cards:
          - show_name: false
            show_icon: true
            type: button
            tap_action:
              action: toggle
            entity: light.display_bedroom_0
            show_state: false
            icon: mdi:ceiling-light-outline
            hold_action:
              action: none
            grid_options:
              rows: 2
              columns: 4
            visibility:
              - condition: state
                state_not: unavailable
          - show_name: false
            show_icon: true
            type: button
            tap_action:
              action: toggle
            entity: light.desklamp_bedroom_1
            show_state: false
            hold_action:
              action: none
            icon: mdi:light-flood-up
            grid_options:
              columns: 4
              rows: 2
          - show_name: false
            show_icon: true
            type: button
            tap_action:
              action: toggle
            entity: light.desklamp_bedroom_0
            show_state: false
            hold_action:
              action: none
            icon: mdi:desk-lamp
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-light-card
            entity: light.ormanas_ormanas_01
            fill_container: false
            layout: vertical
            use_light_color: true
            show_brightness_control: true
            show_color_control: true
            show_color_temp_control: true
            grid_options:
              columns: 12
              rows: 2
            name: Lichtstreifen
            collapsible_controls: true
      - type: grid
        cards:
          - type: heading
            icon: mdi:window-shutter
            heading: Fenster
            heading_style: subtitle
            badges:
              - type: entity
                show_state: true
                show_icon: false
                entity: cover.cover_window_bedroom_0
                state_content: current_position
          - square: false
            type: grid
            cards:
              - show_name: false
                show_icon: true
                type: button
                show_state: true
                hold_action:
                  action: none
                entity: cover.cover_window_bedroom_0
                icon: ""
              - show_name: true
                show_icon: true
                show_state: false
                type: button
                tap_action:
                  action: perform-action
                  perform_action: script.cover_set_to_position
                  data:
                    cover_level: 30
                    cover_device: cover.cover_window_bedroom_0
                  target: {}
                name: 30%
                icon: mdi:window-shutter
              - show_name: true
                show_icon: true
                show_state: false
                type: button
                tap_action:
                  action: perform-action
                  perform_action: script.cover_set_to_position
                  data:
                    cover_level: 60
                    cover_device: cover.cover_window_bedroom_0
                  target: {}
                name: 60%
                icon: mdi:window-shutter-alert
              - show_name: true
                show_icon: true
                show_state: false
                type: button
                tap_action:
                  action: perform-action
                  perform_action: script.cover_set_to_position
                  data:
                    cover_level: 90
                    cover_device: cover.cover_window_bedroom_0
                  target: {}
                icon: mdi:window-shutter-open
                name: 90%
            columns: 4
          - type: custom:mushroom-cover-card
            entity: cover.cover_window_bedroom_0
            name: Fenster Rollladen
            fill_container: true
            grid_options:
              columns: 12
              rows: 1
            show_position_control: true
            show_buttons_control: false
            show_tilt_position_control: false
            primary_info: none
            secondary_info: none
            hold_action:
              action: more-info
            double_tap_action:
              action: more-info
            icon_type: none
      - type: grid
        cards:
          - type: custom:mushroom-fan-card
            entity: fan.schlafzimmer_industrie_fan_bedroom_0
            name: Industrielüfter
            icon_animation: true
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: none
            double_tap_action:
              action: none
            secondary_info: none
            layout: vertical
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                state_not: unavailable
          - type: tile
            grid_options:
              rows: auto
              columns: full
            entity: fan.air_circulator
            name: Dreo Lüfter
            color: green
            vertical: true
            tap_action:
              action: none
            icon_tap_action:
              action: none
            features:
              - type: toggle
              - style: dropdown
                type: fan-preset-modes
              - type: fan-speed
              - type: fan-oscillate
            features_position: bottom
        column_span: 1
      - type: grid
        cards:
          - type: custom:mini-graph-card
            name: Feuchtigkeit
            icon: mdi:water-percent
            entities:
              - entity: sensor.alpstuga_air_quality_monitor_luftfeuchtigkeit
                show_points: false
            hours_to_show: 168
            points_per_hour: 6
            update_interval: 180
            decimals: 1
            animate: true
            smoothing: true
            hour24: true
            aggregate_func: median
            group_by: time
            show:
              state: true
              legend: false
              extrema: true
              fill: true
            color_thresholds:
              - value: 40
                color: #55AA55
              - value: 60
                color: #CC3333
          - type: custom:mini-graph-card
            name: Temperatur
            icon: mdi:thermometer
            entities:
              - entity: sensor.alpstuga_air_quality_monitor_temperatur
                show_points: false
            hours_to_show: 168
            points_per_hour: 1
            update_interval: 180
            decimals: 2
            animate: true
            smoothing: true
            hour24: true
            color_thresholds:
              - value: 10
                color: #3333CC
              - value: 20
                color: #33CC33
              - value: 30
                color: #CC3333
            show:
              state: true
              legend: false
              extrema: true
              fill: true
          - type: custom:mini-graph-card
            name: Kohlendioxid
            icon: mdi:thermometer
            entities:
              - entity: sensor.alpstuga_air_quality_monitor_kohlendioxid
                show_points: false
            hours_to_show: 168
            points_per_hour: 1
            update_interval: 180
            decimals: 2
            animate: true
            smoothing: true
            hour24: true
            color_thresholds:
              - value: 400
                color: #2ECC71
              - value: 800
                color: #A3D900
              - value: 1000
                color: #F1C40F
              - value: 1400
                color: #E67E22
              - value: 2000
                color: #E74C3C
            show:
              state: true
              legend: false
              extrema: true
              fill: true
          - type: custom:mini-graph-card
            name: PM 2.5
            icon: mdi:blur
            entities:
              - entity: sensor.alpstuga_air_quality_monitor_pm25
                show_points: false
            hours_to_show: 168
            points_per_hour: 1
            update_interval: 180
            decimals: 2
            animate: true
            smoothing: true
            hour24: true
            color_thresholds:
              - value: 0
                color: #2ECC71
              - value: 15
                color: #F1C40F
              - value: 35
                color: #E67E22
              - value: 75
                color: #E74C3C
            show:
              state: true
              legend: false
              extrema: true
              fill: true
    max_columns: 1
