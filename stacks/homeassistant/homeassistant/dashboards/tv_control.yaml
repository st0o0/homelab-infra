views:
  - title: Control
    cards: []
    type: sections
    subview: true
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: entities
                entities:
                  - entity: remote.nokia_streaming_box_8000
                show_header_toggle: false
              - square: true
                columns: 3
                type: grid
                cards:
                  - type: button
                    show_icon: false
                    tap_action:
                      action: none
                    hold_action:
                      action: none
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:arrow-up-bold
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: DPAD_UP
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: none
                  - type: button
                    show_icon: false
                    tap_action:
                      action: none
                    hold_action:
                      action: none
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:arrow-left-bold
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: DPAD_LEFT
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: none
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:circle
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: DPAD_CENTER
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: DPAD_CENTER
                        hold_secs: 0.5
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:arrow-right-bold
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: DPAD_RIGHT
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: none
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:arrow-left
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: BACK
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: BACK
                        hold_secs: 0.5
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:arrow-down-bold
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: DPAD_DOWN
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: none
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:home-outline
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: HOME
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: HOME
                        hold_secs: 0.5
                      target:
                        entity_id: remote.nokia_streaming_box_8000
              - square: false
                columns: 3
                type: grid
                cards:
                  - type: button
                    icon: mdi:skip-previous
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: MEDIA_PREVIOUS
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: MEDIA_REWIND
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                  - type: button
                    icon: mdi:play-pause
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: MEDIA_PLAY_PAUSE
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: MEDIA_STOP
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:skip-next
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: MEDIA_NEXT
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: MEDIA_FAST_FORWARD
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:volume-off
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: MUTE
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: none
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:volume-medium
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: VOLUME_DOWN
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: none
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:volume-high
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      data:
                        command: VOLUME_UP
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: none
              - square: false
                type: grid
                cards:
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:youtube
                    tap_action:
                      action: perform-action
                      perform_action: remote.turn_on
                      data:
                        activity: https://www.youtube.com
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: none
                  - show_name: true
                    show_icon: true
                    type: button
                    icon: mdi:jellyfish
                    tap_action:
                      action: perform-action
                      perform_action: remote.turn_on
                      data:
                        activity: org.jellyfin.androidtv
                      target:
                        entity_id: remote.nokia_streaming_box_8000
                    hold_action:
                      action: none
                columns: 2
    max_columns: 1
    dense_section_placement: true
