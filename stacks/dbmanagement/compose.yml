x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
      PGADMIN_LISTEN_PORT: 5050
    volumes:
      - ${PGADMIN_PATH_DATA:?PGADMIN_PATH_DATA is required}:/var/lib/pgadmin
    ports:
      - ${PGADMIN_PORT:-5000}:5050
    networks:
      - db-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5050/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mongonaut:
    image: ghcr.io/withzu/mongonaut:0.1.6
    container_name: mongonaut
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_CONNECTION_URL: ${MONGO_CONNECTION_URL:?MONGO_CONNECTION_URL is required}
      MONGONAUT_AUTH_SECRET: ${MONGONAUT_AUTH_SECRET:?MONGONAUT_AUTH_SECRET is required}
      MONGONAUT_AUTH_MODE: STATIC_PASSWORD
      MONGONAUT_AUTH_PASSWORD: ${MONGONAUT_AUTH_PASSWORD:?MONGONAUT_AUTH_PASSWORD is required}
      MONGONAUT_READONLY: ${MONGONAUT_READONLY:-false}
    ports:
      - ${MONGONAUT_PORT:-5001}:8081
    networks:
      - db-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  db-net:
    external: true
