x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  kopiaclient:
    image: kopia/kopia:0.23.1@sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e
    container_name: kopiaclient
    hostname: ${KOPIA_HOSTNAME:?KOPIA_HOSTNAME is required}
    restart: unless-stopped
    logging: *default-logging
    command:
      - server
      - start
      - --address=0.0.0.0:51515
      - --server-control-username=${KOPIA_CLIENT_USER:?KOPIA_CLIENT_USER is required}
      - --server-control-password=${KOPIA_CLIENT_PASS:?KOPIA_CLIENT_PASS is required}
      - --readonly
      - --insecure
    environment:
      - KOPIA_PASSWORD=${KOPIA_REPO_PASSWORD:?KOPIA_REPO_PASSWORD is required}
      - TZ=${TZ:-}
    healthcheck:
      test: ["CMD", "kopia", "server", "status", "--address=http://localhost:51515", "--server-control-username=${KOPIA_CLIENT_USER}", "--server-control-password=${KOPIA_CLIENT_PASS}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 64M
    volumes:
      - kopia-client-config:/app/config
      - kopia-client-cache:/app/cache
      - /docker:/docker:ro
      - /restore:/restore

volumes:
  kopia-client-config:
  kopia-client-cache:
