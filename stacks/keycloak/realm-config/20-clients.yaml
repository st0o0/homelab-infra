realm: homelab

clients:
  - clientId: "${KC_CLIENT_JELLYFIN_ID}"
    name: Jellyfin
    protocol: openid-connect
    enabled: true
    clientAuthenticatorType: client-secret
    secret: "${KC_CLIENT_JELLYFIN_SECRET}"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    publicClient: false
    consentRequired: false
    redirectUris:
      - "${KC_CLIENT_JELLYFIN_REDIRECT_URI}"
    defaultClientScopes:
      - openid
      - email
      - profile
      - groups
    attributes:
      access.token.lifespan: "3600"
      client.offline.session.max.lifespan: "2592000"

