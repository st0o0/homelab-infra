x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  nut-upsd:
    image: instantlinux/nut-upsd:2.8.2
    container_name: nut-upsd
    restart: unless-stopped
    logging: *default-logging
    environment:
      - PUID=${PUID:-}
      - PGID=${PGID:-}
      - TZ=${TZ:-}
      - DRIVER=${NUT_DRIVER:?NUT_DRIVER is required}
      - NAME=${NUT_NAME:-ups}
      - PORT=${NUT_DRIVER_PORT:-auto}
      - POLLINTERVAL=${NUT_POLL_INTERVAL:-15}
      - API_USER=${NUT_API_USER:?NUT_API_USER is required}
      - API_PASSWORD=${NUT_API_PASS:?NUT_API_PASS is required}
    devices:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - "${NUT_PORT:-3493}:3493"
    volumes:
      - ${NUT_PATH_CONFIG:?NUT_PATH_CONFIG is required}:/etc/nut
    deploy:
      resources:
        limits:
          cpus: 0.1
          memory: 64M
        reservations:
          memory: 32M

  peanut:
    image: brandawg93/peanut:v1.1.3
    container_name: peanut
    restart: unless-stopped
    logging: *default-logging
    environment:
      - PUID=${PUID:-}
      - PGID=${PGID:-}
      - TZ=${TZ:-}
    ports:
      - "${PEANUT_PORT:-8080}:8080"
    volumes:
      - ${PEANUT_PATH_CONFIG:?PEANUT_PATH_CONFIG is required}:/config
    depends_on:
      - nut-upsd
    deploy:
      resources:
        limits:
          cpus: 0.1
          memory: 64M
        reservations:
          memory: 32M
