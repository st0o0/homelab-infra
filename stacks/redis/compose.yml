x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: valkey
    restart: always
    logging: *default-logging
    command: >-
      valkey-server
      --requirepass ${VALKEY_PASS:?VALKEY_PASS is required}
      --maxmemory ${VALKEY_MAXMEMORY:-256mb}
      --maxmemory-policy ${VALKEY_MAXMEMORY_POLICY:-allkeys-lru}
      --appendonly yes
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - ${VALKEY_PATH_DATA:?VALKEY_PATH_DATA is required}:/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 512M
        reservations:
          memory: 64M

networks:
  db-net:
    external: true
