x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: always
    logging: *default-logging
    command: >-
      redis-server
      --requirepass ${REDIS_PASS:?REDIS_PASS is required}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${REDIS_PATH_DATA:?REDIS_PATH_DATA is required}:/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 512M
        reservations:
          memory: 64M

networks:
  db-net:
    external: true
