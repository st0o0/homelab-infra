name: ran_permanent
filters:
  - Alert.GetScenario() startsWith "custom/ran-" && GetDecisionsCount(Alert.GetValue()) >= 5
decisions:
  - type: ban
    scope: Ip
    duration: 8760h
notifications:
  - file_alerts
on_success: break
---
name: ran_escalation
filters:
  - Alert.GetScenario() startsWith "custom/ran-"
decisions:
  - type: ban
    scope: Ip
    duration: 4h
duration_expr: "Sprintf('%.0fh', 4 * (3 ^ GetDecisionsCount(Alert.GetValue())))"
notifications:
  - file_alerts
on_success: break
---
# Escalating ban: 1h, 3h, 9h, 27h, 81h, then capped at 168h (7 days). No permanent bans.
# duration is the base value; duration_expr overrides it per alert.
name: appsec_escalation
filters:
  - Alert.GetScenario() == "crowdsecurity/appsec-vpatch"
decisions:
  - type: ban
    scope: Ip
    duration: 1h
duration_expr: "Sprintf('%.0fh', min(168.0, 3 ^ GetDecisionsCount(Alert.GetValue())))"
notifications:
  - file_appsec
  - file_alerts
on_success: break
---
# Same escalation as appsec_escalation (1h base, 168h cap).
# custom/appsec-repeat consumes the same appsec-block events as appsec-vpatch, so it must not use file_appsec (double counting).
name: probe_escalation
filters:
  - Alert.GetScenario() in ["custom/appsec-repeat", "custom/foreign-stack-probe"]
decisions:
  - type: ban
    scope: Ip
    duration: 1h
duration_expr: "Sprintf('%.0fh', min(168.0, 3 ^ GetDecisionsCount(Alert.GetValue())))"
notifications:
  - file_alerts
on_success: break
---
name: appsec_detection
filters:
  - Alert.GetScenario() contains "appsec"
notifications:
  - file_appsec
on_success: break
---
name: behavioral_noauto
filters:
  - Alert.GetScenario() in ["crowdsecurity/http-crawl-non_statics", "crowdsecurity/http-probing"]
notifications:
  - file_alerts
on_success: break
---
name: default_ip_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 4h
notifications:
  - file_alerts
on_success: break
