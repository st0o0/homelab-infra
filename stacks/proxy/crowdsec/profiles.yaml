# ran honeypot (>= 0.4.0): alerts carry no decisions and the class (probe/attack/scan) is event meta, so use
# Alert.Events[0].GetMeta("class"); Alert.GetMeta() only reads alert-level meta and would never match.
# Profiles run top to bottom and stop at the first on_success: break, so scan comes first.
# Escalation: 1h, 3h, 9h, 27h, 81h, then capped at 168h. The 168.0 float is required (an int cap breaks %.0f formatting).
# ran 0.3.x pushes alerts with embedded decisions; CrowdSec skips profiles for those, so these profiles are inert there.
name: ran_scan
filters:
  - Alert.GetScenario() startsWith "custom/ran-" && len(Alert.Events) > 0 && Alert.Events[0].GetMeta("class") == "scan"
decisions:
  - type: ban
    scope: Ip
    duration: 1h
duration_expr: "Sprintf('%.0fh', min(168.0, 3 ^ GetDecisionsCount(Alert.GetValue())))"
notifications:
  - file_alerts
on_success: break
---
name: ran_attack
filters:
  - Alert.GetScenario() startsWith "custom/ran-" && len(Alert.Events) > 0 && Alert.Events[0].GetMeta("class") == "attack"
decisions:
  - type: ban
    scope: Ip
    duration: 1h
duration_expr: "Sprintf('%.0fh', min(168.0, 3 ^ GetDecisionsCount(Alert.GetValue())))"
notifications:
  - file_alerts
on_success: break
---
# Probes (connect and banner only) never ban. Explicit no-op, otherwise default_ip_remediation would ban them
# (ran sends remediation: true). Probe alerts exist only if RAN_BAN_ON on the ran side includes probe.
# Any other custom/ran-* alert (unknown or missing class) also ends here, so it can never fall through to a ban.
name: ran_noban
filters:
  - Alert.GetScenario() startsWith "custom/ran-"
on_success: break
---
# Escalating ban: 1h, 3h, 9h, 27h, 81h, then capped at 168h (7 days). No permanent bans.
# duration is the base value; duration_expr overrides it per alert.
name: appsec_escalation
filters:
  - Alert.GetScenario() == "crowdsecurity/appsec-vpatch"
decisions:
  - type: ban
    scope: Ip
    duration: 1h
duration_expr: "Sprintf('%.0fh', min(168.0, 3 ^ GetDecisionsCount(Alert.GetValue())))"
notifications:
  - file_appsec
  - file_alerts
on_success: break
---
# Same escalation as appsec_escalation (1h base, 168h cap).
# custom/appsec-repeat consumes the same appsec-block events as appsec-vpatch, so it must not use file_appsec (double counting).
name: probe_escalation
filters:
  - Alert.GetScenario() in ["custom/appsec-repeat", "custom/foreign-stack-probe"]
decisions:
  - type: ban
    scope: Ip
    duration: 1h
duration_expr: "Sprintf('%.0fh', min(168.0, 3 ^ GetDecisionsCount(Alert.GetValue())))"
notifications:
  - file_alerts
on_success: break
---
name: appsec_detection
filters:
  - Alert.GetScenario() contains "appsec"
notifications:
  - file_appsec
on_success: break
---
name: behavioral_noauto
filters:
  - Alert.GetScenario() in ["crowdsecurity/http-crawl-non_statics", "crowdsecurity/http-probing"]
notifications:
  - file_alerts
on_success: break
---
name: default_ip_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 4h
notifications:
  - file_alerts
on_success: break
