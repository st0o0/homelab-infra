type: leaky
name: custom/keycloak
description: Ban IPs that abuse Keycloak endpoints (login, token, broker, admin API)
filter: "evt.Meta.log_type == 'http_access-log' && ((evt.Meta.http_verb == 'POST' && (evt.Meta.http_path startsWith '/realms/homelab/login-actions/authenticate' || evt.Meta.http_path startsWith '/realms/homelab/protocol/openid-connect/token' || evt.Meta.http_path startsWith '/realms/homelab/broker/')) || (evt.Meta.http_status in ['400', '401', '403', '404'] && evt.Meta.http_path startsWith '/realms/homelab/'))"
groupby: evt.Meta.source_ip
capacity: 8
leakspeed: 20s
blackhole: 2m
labels:
  type: http
  remediation: true
