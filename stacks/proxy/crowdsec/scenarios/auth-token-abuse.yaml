type: leaky
name: custom/auth-token-abuse
description: Ban IPs that flood OAuth token or authorization endpoints
filter: "evt.Meta.log_type == 'http_access-log' && evt.Meta.http_verb == 'POST' && evt.Meta.http_path startsWith '/application/o/token/'"
groupby: evt.Meta.source_ip
capacity: 8
leakspeed: 20s
blackhole: 2m
labels:
  type: http
  remediation: true
