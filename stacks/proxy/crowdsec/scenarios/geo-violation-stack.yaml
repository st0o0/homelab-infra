type: leaky
name: custom/geo-violation-stack
description: Ban IPs that persistently hit geo-restricted endpoints
filter: "evt.Meta.log_type == 'http_access-log' && evt.Meta.http_status == '403'"
groupby: evt.Meta.source_ip
capacity: 25
leakspeed: 30s
blackhole: 5m
labels:
  type: http
  ban_duration: "24h"
  remediation: true
