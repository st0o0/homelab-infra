type: leaky
name: custom/auth-login-flood
description: Ban IPs that flood Authentik login flow endpoints
filter: "evt.Meta.log_type == 'http_access-log' && evt.Meta.http_verb == 'POST' && evt.Meta.http_path startsWith '/api/v3/flows/executor/'"
groupby: evt.Meta.source_ip
capacity: 10
leakspeed: 30s
blackhole: 2m
labels:
  type: http
  remediation: true
