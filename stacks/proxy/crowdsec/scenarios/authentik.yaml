type: leaky
name: custom/authentik
description: Ban IPs that brute-force Authentik login, token, recovery, or enrollment endpoints
filter: >-
  evt.Meta.log_type == 'http_access-log' &&
  evt.Meta.http_status in ['401', '403', '404'] &&
  evt.Meta.http_verb == 'POST' &&
  (evt.Meta.http_path startsWith '/application/o/token/' ||
  evt.Meta.http_path startsWith '/api/v3/flows/instances/' ||
  evt.Meta.http_path startsWith '/api/v3/stages/')
groupby: evt.Meta.source_ip
capacity: 15
leakspeed: 20s
blackhole: 2m
labels:
  type: http
  remediation: true
