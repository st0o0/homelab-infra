name: custom/whitelist-audiobookshelf

pre_eval:
  # Progress sync triggers 911100 (method enforcement on PATCH)
  - filter: >-
      IsInBand == true &&
      req.Host contains "audio." &&
      req.URL.Path startsWith "/api/me/progress/"
    apply:
      - RemoveInBandRuleByID(911100)
  - filter: >-
      IsOutBand == true &&
      req.Host contains "audio." &&
      req.URL.Path startsWith "/api/me/progress/"
    apply:
      - RemoveOutBandRuleByID(911100)
