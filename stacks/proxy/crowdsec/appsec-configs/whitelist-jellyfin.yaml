name: custom/whitelist-jellyfin

pre_eval:
  # Session progress reports trigger CRS 932370 (RCE false positive)
  - filter: >-
      IsInBand == true &&
      req.Host contains "media." &&
      req.URL.Path startsWith "/Sessions/"
    apply:
      - RemoveInBandRuleByID(932370)
  - filter: >-
      IsOutBand == true &&
      req.Host contains "media." &&
      req.URL.Path startsWith "/Sessions/"
    apply:
      - RemoveOutBandRuleByID(932370)
  # Jellyfin API requests trigger 901340 (anomaly score) and 911100 (method enforcement)
  # due to large query strings, DELETE methods, and rapid polling from clients like Streamyfin
  - filter: >-
      IsOutBand == true &&
      req.Host contains "media." &&
      (req.URL.Path startsWith "/PlayingItems/" ||
       req.URL.Path startsWith "/Items" ||
       req.URL.Path startsWith "/Shows/" ||
       req.URL.Path startsWith "/UserItems/" ||
       req.URL.Path startsWith "/UserViews" ||
       req.URL.Path startsWith "/Streamyfin/")
    apply:
      - RemoveOutBandRuleByID(901340)
      - RemoveOutBandRuleByID(911100)
  - filter: >-
      IsInBand == true &&
      req.Host contains "media." &&
      (req.URL.Path startsWith "/PlayingItems/" ||
       req.URL.Path startsWith "/Items" ||
       req.URL.Path startsWith "/Shows/" ||
       req.URL.Path startsWith "/UserItems/" ||
       req.URL.Path startsWith "/UserViews" ||
       req.URL.Path startsWith "/Streamyfin/")
    apply:
      - RemoveInBandRuleByID(901340)
      - RemoveInBandRuleByID(911100)
