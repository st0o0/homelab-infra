name: custom/whitelist-immich

pre_eval:
  # Sync ack and asset operations trigger 911100 (method enforcement on PATCH/DELETE)
  - filter: >-
      IsInBand == true &&
      req.Host contains "immich." &&
      (req.URL.Path startsWith "/api/sync/" || req.URL.Path startsWith "/api/assets")
    apply:
      - RemoveInBandRuleByID(911100)
  - filter: >-
      IsOutBand == true &&
      req.Host contains "immich." &&
      (req.URL.Path startsWith "/api/sync/" || req.URL.Path startsWith "/api/assets")
    apply:
      - RemoveOutBandRuleByID(911100)
