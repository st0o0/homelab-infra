name: custom/whitelist-authentik

pre_eval:
  # Admin API calls trigger 911100 (method enforcement) and 901340 (anomaly score)
  - filter: >-
      IsInBand == true &&
      req.Host contains "auth." &&
      req.URL.Path startsWith "/api/v3/"
    apply:
      - RemoveInBandRuleByID(911100)
      - RemoveInBandRuleByID(901340)
  - filter: >-
      IsOutBand == true &&
      req.Host contains "auth." &&
      req.URL.Path startsWith "/api/v3/"
    apply:
      - RemoveOutBandRuleByID(911100)
      - RemoveOutBandRuleByID(901340)
