name: custom/whitelist-vaultwarden

pre_eval:
  # Cipher and device API calls trigger 901340 (anomaly score) and 911100 (method enforcement)
  - filter: >-
      IsInBand == true &&
      req.Host contains "vault." &&
      (req.URL.Path startsWith "/api/ciphers/" || req.URL.Path startsWith "/api/devices/")
    apply:
      - RemoveInBandRuleByID(901340)
      - RemoveInBandRuleByID(911100)
  - filter: >-
      IsOutBand == true &&
      req.Host contains "vault." &&
      (req.URL.Path startsWith "/api/ciphers/" || req.URL.Path startsWith "/api/devices/")
    apply:
      - RemoveOutBandRuleByID(901340)
      - RemoveOutBandRuleByID(911100)
