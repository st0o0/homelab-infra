type: file
name: file_appsec
log_level: info
format: |
  {{range . -}}
  {{$alert := . -}}
  {{range .Events -}}
  {"time":"{{$alert.StopAt}}","scenario":"{{$alert.Scenario}}","ip":"{{$alert.Source.IP}}","country":"{{or $alert.Source.Cn "-"}}","asname":"{{or $alert.Source.AsName "-"}}","as_num":"{{or $alert.Source.AsNumber "-"}}","log_type":"{{or (.GetMeta "log_type") "-"}}","rule_name":"{{or (.GetMeta "rule_name") "-"}}","target_host":"{{or (.GetMeta "target_host") "-"}}","target_uri":"{{or (.GetMeta "target_uri") "-"}}","method":"{{or (.GetMeta "method") "-"}}","inband_action":"{{or (.GetMeta "inband_action") "-"}}","matched_zones":"{{or (.GetMeta "matched_zones") "-"}}","user_agent":"{{or (.GetMeta "user_agent") "-"}}"}
  {{end -}}
  {{end -}}
log_path: /var/log/crowdsec/appsec.ndjson
rotate:
  enabled: true
  max_size: 10
  max_files: 5
  max_age: 7
