type: file
name: file_appsec
log_level: info
format: |
  {{range . -}}
  {{$alert := . -}}
  {{range .Events -}}
  {"time":"{{$alert.StopAt}}","scenario":"{{$alert.Scenario}}","ip":"{{$alert.Source.IP}}","country":"{{$alert.Source.Cn}}","asname":"{{$alert.Source.AsName}}","rule_name":"{{.GetMeta "rule_name"}}","target_uri":"{{.GetMeta "target_uri"}}","target_host":"{{.GetMeta "target_host"}}"}
  {{end -}}
  {{end -}}
log_path: /var/log/crowdsec/appsec.ndjson
rotate:
  enabled: true
  max_size: 10
  max_files: 5
  max_age: 7
