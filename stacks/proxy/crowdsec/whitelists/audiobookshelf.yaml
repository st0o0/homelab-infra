name: custom/whitelist-audiobookshelf
description: Whitelist known Audiobookshelf false-positive traffic from HTTP behavior scenarios
filter: "evt.Line.Src contains '/services/audiobookshelf.'"
whitelist:
  reason: "New devices requesting missing author photos on first load trips http-probing (advplyr/audiobookshelf#4387)"
  expression:
    - "evt.Meta.http_status == '404' && evt.Meta.http_verb == 'GET' && evt.Meta.http_path matches '^/api/authors/[^/]+/image'"
