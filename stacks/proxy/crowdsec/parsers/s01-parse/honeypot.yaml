name: custom/honeypot-parser
description: Parse Caddy honeypot JSON logs
filter: "evt.Line.Labels.type == 'honeypot'"
onsuccess: next_stage
statics:
  - meta: log_type
    value: honeypot
  - meta: source_ip
    expression: "JsonExtract(evt.Line.Raw, 'request.remote_ip')"
  - meta: http_path
    expression: "JsonExtract(evt.Line.Raw, 'request.uri')"
  - meta: http_method
    expression: "JsonExtract(evt.Line.Raw, 'request.method')"
  - meta: http_host
    expression: "JsonExtract(evt.Line.Raw, 'request.host')"
  - meta: http_user_agent
    expression: "JsonExtract(evt.Line.Raw, 'request.headers.User-Agent.0')"
