x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  bifrost:
    image: ghcr.io/st0o0/bifrost:0.2.2@sha256:2dd59c9774221db336f933653236c7ccc64be7367b513abb1dfc5501aa3390b8
    container_name: bifrost
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Explicit, because ran (UID 65532, no capabilities) shares this network namespace and binds low ports
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "127.0.0.1:8888:8888"
      # honeypot traps (ran); smb, mssql, redis, sip, dns, ntp, snmp deliberately not published (see openspec proxy-honeypot-hardening)
      - "21:21"
      - "23:23"
      - "25:25"
      - "587:587"
      - "1883:1883"
      - "2222:2222"
      - "3307:3307"
      - "3389:3389"
      - "5432:5432"
      - "5555:5555"
      - "5900:5900"
      - "8080:8080"
      - "9200:9200"
      - "25565:25565"
      - "1080:1080"
      - "11211:11211"
      # multi-port honeypot variants
      - "3000:3000"
      - "3128:3128"
      - "3306:3306"
      - "5901:5901"
      - "8081:8081"
      - "8443:8443"
      - "9443:9443"
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - BIFROST_PRIVATE_KEY=${BIFROST_PRIVATE_KEY:?BIFROST_PRIVATE_KEY is required}
      - BIFROST_ADDRESS=${BIFROST_ADDRESS:?BIFROST_ADDRESS is required}
      - BIFROST_LISTEN_PORT=${BIFROST_LISTEN_PORT:-51821}
      - BIFROST_MTU=${BIFROST_MTU:-1420}
      - BIFROST_PEER_PUBLIC_KEY=${BIFROST_PEER_PUBLIC_KEY:?BIFROST_PEER_PUBLIC_KEY is required}
      - BIFROST_PEER_ENDPOINT=${BIFROST_PEER_ENDPOINT:?BIFROST_PEER_ENDPOINT is required}
      - BIFROST_PEER_ALLOWED_IPS=${BIFROST_PEER_ALLOWED_IPS:?BIFROST_PEER_ALLOWED_IPS is required}
      - BIFROST_PEER_KEEPALIVE=${BIFROST_PEER_KEEPALIVE:-25}
      - BIFROST_PEER_PRESHARED_KEY=${BIFROST_PEER_PRESHARED_KEY:-}
      - BIFROST_INTERFACE=${BIFROST_INTERFACE:-wg1}
      - BIFROST_CHECK_INTERVAL=${BIFROST_CHECK_INTERVAL:-30}
      - BIFROST_STALE_AFTER=${BIFROST_STALE_AFTER:-135}
      - BIFROST_RESOLVE=${BIFROST_RESOLVE:-on}
      - BIFROST_RECONNECT=${BIFROST_RECONNECT:-on}
      - BIFROST_HEALTHCHECK=${BIFROST_HEALTHCHECK:-on}
      - BIFROST_PROBE=${BIFROST_PROBE:-on}
      - BIFROST_METRICS=${BIFROST_METRICS:-on}
      - BIFROST_METRICS_ADDR=${BIFROST_METRICS_ADDR:-:9586}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 128M

  eir:
    image: ghcr.io/st0o0/eir:0.1.3@sha256:4a434c50441d116e34afb296be9429713b5f0432c34a736bd536d3c2b66c05a9
    container_name: eir
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      bifrost:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - EIR_MASTERS=${EIR_MASTERS:-bifrost}
      - EIR_DISCOVERY_MODE=${EIR_DISCOVERY_MODE:-inspect}
      - EIR_STABILIZE_WAIT=${EIR_STABILIZE_WAIT:-15s}
      - EIR_MAX_RETRIES=${EIR_MAX_RETRIES:-3}
      - EIR_RETRY_BACKOFF=${EIR_RETRY_BACKOFF:-5s}
      - EIR_LOG_LEVEL=${EIR_LOG_LEVEL:-info}
      - EIR_LOG_FORMAT=${EIR_LOG_FORMAT:-json}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      disable: false
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          memory: 32M

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    logging: *default-logging
    network_mode: service:bifrost
    depends_on:
      bifrost:
        condition: service_healthy
      crowdsec:
        condition: service_healthy
    # TZ deliberately unset (Alloy parses Caddy log timestamps; custom build, image may lack tzdata); see openspec change timezone-mapping
    environment:
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_CADDY_BOUNCER_API_KEY:?CROWDSEC_CADDY_BOUNCER_API_KEY is required}
      - CADDY_DOMAIN_AUDIOBOOKSHELF=${CADDY_DOMAIN_AUDIOBOOKSHELF:?CADDY_DOMAIN_AUDIOBOOKSHELF is required}
      - CADDY_TARGET_AUDIOBOOKSHELF=${CADDY_TARGET_AUDIOBOOKSHELF:?CADDY_TARGET_AUDIOBOOKSHELF is required}
      - CADDY_DOMAIN_JELLYFIN=${CADDY_DOMAIN_JELLYFIN:?CADDY_DOMAIN_JELLYFIN is required}
      - CADDY_TARGET_JELLYFIN=${CADDY_TARGET_JELLYFIN:?CADDY_TARGET_JELLYFIN is required}
      - CADDY_DOMAIN_AUTHENTIK=${CADDY_DOMAIN_AUTHENTIK:?CADDY_DOMAIN_AUTHENTIK is required}
      - CADDY_TARGET_AUTHENTIK=${CADDY_TARGET_AUTHENTIK:?CADDY_TARGET_AUTHENTIK is required}
      - CADDY_DOMAIN_IMMICH=${CADDY_DOMAIN_IMMICH:?CADDY_DOMAIN_IMMICH is required}
      - CADDY_TARGET_IMMICH=${CADDY_TARGET_IMMICH:?CADDY_TARGET_IMMICH is required}
      - CADDY_DOMAIN_MEALIE=${CADDY_DOMAIN_MEALIE:?CADDY_DOMAIN_MEALIE is required}
      - CADDY_TARGET_MEALIE=${CADDY_TARGET_MEALIE:?CADDY_TARGET_MEALIE is required}
      - CADDY_DOMAIN_VAULTWARDEN=${CADDY_DOMAIN_VAULTWARDEN:?CADDY_DOMAIN_VAULTWARDEN is required}
      - CADDY_TARGET_VAULTWARDEN=${CADDY_TARGET_VAULTWARDEN:?CADDY_TARGET_VAULTWARDEN is required}
      - CADDY_DOMAIN_SEERR=${CADDY_DOMAIN_SEERR:?CADDY_DOMAIN_SEERR is required}
      - CADDY_TARGET_SEERR=${CADDY_TARGET_SEERR:?CADDY_TARGET_SEERR is required}
      - CADDY_DOMAIN_FILESTATION=${CADDY_DOMAIN_FILESTATION:?CADDY_DOMAIN_FILESTATION is required}
      - CADDY_TARGET_FILESTATION=${CADDY_TARGET_FILESTATION:?CADDY_TARGET_FILESTATION is required}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro
      - /docker/proxy/caddy/data:/data
      - /docker/proxy/caddy/config:/config
      - /var/log/caddy:/var/log/caddy
      - geoip-data:/geoip:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

  crowdsec:
    image: ghcr.io/crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    container_name: crowdsec
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:bifrost
    depends_on:
      bifrost:
        condition: service_healthy
    # TZ deliberately unset (CrowdSec log time must stay UTC "Z" for the Alloy parser); see openspec change timezone-mapping
    environment:
      - >-
        COLLECTIONS=crowdsecurity/caddy crowdsecurity/http-cve
        crowdsecurity/base-http-scenarios crowdsecurity/appsec-virtual-patching
        crowdsecurity/http-dos crowdsecurity/whitelist-good-actors
      # syslog-logs also ships the non-syslog node that every Caddy log line passes through
      - PARSERS=crowdsecurity/jellyfin-whitelist crowdsecurity/syslog-logs crowdsecurity/geoip-enrich crowdsecurity/dateparse-enrich
      - GID=${PGID:-1000}
      # bump to force CrowdSec recreate on config changes (profiles/scenarios/appsec)
      - CONFIG_VERSION=7
    volumes:
      - ./crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      - ./crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ./crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      - ./crowdsec/notifications:/etc/crowdsec/notifications:ro
      - ./crowdsec/scenarios:/etc/crowdsec/scenarios/custom:ro
      - ./crowdsec/whitelists:/etc/crowdsec/parsers/s02-enrich/custom:ro
      - ./crowdsec/appsec-configs:/etc/crowdsec/appsec-configs/custom:ro
      - /docker/proxy/crowdsec/data:/var/lib/crowdsec/data
      - /docker/proxy/crowdsec/config:/etc/crowdsec
      - /var/log/caddy:/var/log/caddy:ro
      - /var/log/crowdsec:/var/log/crowdsec
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8180/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          memory: 256M

  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
    container_name: geoipupdate
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID:?GEOIPUPDATE_ACCOUNT_ID is required}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY:?GEOIPUPDATE_LICENSE_KEY is required}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-City
      - GEOIPUPDATE_FREQUENCY=${GEOIPUPDATE_FREQUENCY:-24}
    volumes:
      - geoip-data:/usr/share/GeoIP
    healthcheck:
      test: ["CMD", "test", "-f", "/usr/share/GeoIP/GeoLite2-City.mmdb"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          memory: 32M

  ran:
    image: ghcr.io/st0o0/ran:0.3.8@sha256:ce07c77414a1dba225a669ac8bd3c07a7edb7d7619ecd901eac12100606c8741
    container_name: ran
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:bifrost
    depends_on:
      bifrost:
        condition: service_healthy
      crowdsec:
        condition: service_healthy
    # TZ deliberately unset (scratch image without tzdata, UTC RFC3339 logs); see openspec change timezone-mapping
    environment:
      - RAN_TRAPS=ssh,http,rdp,telnet,mysql,vnc,mqtt,smtp,ftp,postgres,elasticsearch,httpproxy,adb,minecraft,socks5,memcached
      - RAN_LOG_LEVEL=${RAN_LOG_LEVEL:-info}
      - RAN_LOG_FORMAT=json
      - RAN_SESSION_TIMEOUT=${RAN_SESSION_TIMEOUT:-30s}
      - RAN_MAX_SESSIONS=${RAN_MAX_SESSIONS:-500}
      - RAN_MAX_PER_IP=${RAN_MAX_PER_IP:-10}
      - RAN_METRICS_ADDR=:9550
      - RAN_HTTP_ADDR=:8181,:8443,:8081,:3000,:9443
      - RAN_SSH_ADDR=:2222
      - RAN_TELNET_ADDR=:23
      - RAN_RDP_ADDR=:3389
      - RAN_MYSQL_ADDR=:3307,:3306
      - RAN_VNC_ADDR=:5900,:5901
      - RAN_MQTT_ADDR=:1883
      - RAN_FTP_ADDR=:21
      - RAN_SMTP_ADDR=:25,:587
      - RAN_POSTGRES_ADDR=:5432
      - RAN_HTTPPROXY_ADDR=:8080,:3128
      - RAN_ELASTICSEARCH_ADDR=:9200
      - RAN_ADB_ADDR=:5555
      - RAN_MINECRAFT_ADDR=:25565
      - RAN_SOCKS5_ADDR=:1080
      - RAN_MEMCACHED_ADDR=:11211
      - RAN_CROWDSEC=on
      - RAN_CROWDSEC_URL=http://localhost:8180
      - RAN_CROWDSEC_MACHINE_ID=${RAN_CROWDSEC_MACHINE_ID:?RAN_CROWDSEC_MACHINE_ID is required}
      - RAN_CROWDSEC_PASSWORD=${RAN_CROWDSEC_PASSWORD:?RAN_CROWDSEC_PASSWORD is required}
      - RAN_CROWDSEC_BAN_DURATION=${RAN_CROWDSEC_BAN_DURATION:-4h}
      - RAN_CROWDSEC_DEDUP_WINDOW=${RAN_CROWDSEC_DEDUP_WINDOW:-5m}
      - RAN_CROWDSEC_BATCH_INTERVAL=${RAN_CROWDSEC_BATCH_INTERVAL:-10s}
      - RAN_CROWDSEC_BATCH_SIZE=${RAN_CROWDSEC_BATCH_SIZE:-50}
      - RAN_CROWDSEC_DECISION_CACHE=${RAN_CROWDSEC_DECISION_CACHE:-on}
      # About 75 percent of the 128M container limit
      - GOMEMLIMIT=96MiB
    # Hardening (safe on 0.3.8, required to be correct on 0.4.0):
    # - low ports are bound without NET_BIND_SERVICE because the shared bifrost network namespace is created by
    #   Docker with net.ipv4.ip_unprivileged_port_start=0 (verify after deploy, see proxy-honeypot-hardening tasks)
    # - 0.4.0 runs as UID 65532 and writes only /data (SSH host key); the volume must be owned by 65532 before the upgrade
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    volumes:
      - ran-data:/data
    healthcheck:
      test: ["CMD", "/ran", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 256
        reservations:
          memory: 64M

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: alloy
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:bifrost
    depends_on:
      bifrost:
        condition: service_healthy
      geoipupdate:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
      - --stability.level=experimental
    # TZ deliberately unset (pipelines parse zone-less timestamps as UTC); see openspec change timezone-mapping
    environment:
      - HOST_HOSTNAME=${ALLOY_HOSTNAME:-}
      - REMOTE_WRITE_URL=${ALLOY_REMOTE_WRITE_URL:?ALLOY_REMOTE_WRITE_URL is required}
      - LOGS_PUSH_URL=${ALLOY_LOGS_PUSH_URL:?ALLOY_LOGS_PUSH_URL is required}
    healthcheck:
      disable: true
    privileged: true
    volumes:
      - ./alloy:/etc/alloy
      - ../../alloy/modules:/etc/alloy/modules:ro
      - alloy-data:/var/lib/alloy/data
      - geoip-data:/geoip:ro
      - /var/log:/var/log/host:ro
      # systemd journal for loki.source.journal (persistent and volatile)
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /var/run:/var/run
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: 768M
        reservations:
          memory: 256M

volumes:
  geoip-data:
  alloy-data:
  ran-data:
