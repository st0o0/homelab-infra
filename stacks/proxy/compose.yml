x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  bifrost:
    image: ghcr.io/st0o0/bifrost:pr-23
    container_name: bifrost
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # 80/443 disabled — Pangolin owns these ports
      # To switch to Caddy: uncomment, stop Pangolin, redeploy
      # - "80:80"
      # - "443:443"
      # - "443:443/udp"
      - "2019:2019"
      - "6060:6060"
      - "8888:8888"
    environment:
      - BIFROST_PRIVATE_KEY=${BIFROST_PRIVATE_KEY:?BIFROST_PRIVATE_KEY is required}
      - BIFROST_ADDRESS=${BIFROST_ADDRESS:?BIFROST_ADDRESS is required}
      - BIFROST_LISTEN_PORT=${BIFROST_LISTEN_PORT:-51821}
      - BIFROST_MTU=${BIFROST_MTU:-1420}
      - BIFROST_PEER_PUBLIC_KEY=${BIFROST_PEER_PUBLIC_KEY:?BIFROST_PEER_PUBLIC_KEY is required}
      - BIFROST_PEER_ENDPOINT=${BIFROST_PEER_ENDPOINT:?BIFROST_PEER_ENDPOINT is required}
      - BIFROST_PEER_ALLOWED_IPS=${BIFROST_PEER_ALLOWED_IPS:?BIFROST_PEER_ALLOWED_IPS is required}
      - BIFROST_PEER_KEEPALIVE=${BIFROST_PEER_KEEPALIVE:-25}
      - BIFROST_PEER_PRESHARED_KEY=${BIFROST_PEER_PRESHARED_KEY:-}
      - BIFROST_INTERFACE=${BIFROST_INTERFACE:-wg1}
      - BIFROST_CHECK_INTERVAL=${BIFROST_CHECK_INTERVAL:-30}
      - BIFROST_STALE_AFTER=${BIFROST_STALE_AFTER:-135}
      - BIFROST_RESOLVE=${BIFROST_RESOLVE:-on}
      - BIFROST_RECONNECT=${BIFROST_RECONNECT:-on}
      - BIFROST_HEALTHCHECK=${BIFROST_HEALTHCHECK:-on}
      - BIFROST_PROBE=${BIFROST_PROBE:-off}
      - BIFROST_METRICS=${BIFROST_METRICS:-on}
      - BIFROST_METRICS_ADDR=${BIFROST_METRICS_ADDR:-:9586}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 128M

  eir:
    image: ghcr.io/st0o0/eir:0.1.0
    container_name: eir
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      bifrost:
        condition: service_started
    environment:
      - EIR_MASTERS=${EIR_MASTERS:-bifrost}
      - EIR_DISCOVERY_MODE=${EIR_DISCOVERY_MODE:-inspect}
      - EIR_STABILIZE_WAIT=${EIR_STABILIZE_WAIT:-15s}
      - EIR_MAX_RETRIES=${EIR_MAX_RETRIES:-3}
      - EIR_RETRY_BACKOFF=${EIR_RETRY_BACKOFF:-5s}
      - EIR_LOG_LEVEL=${EIR_LOG_LEVEL:-info}
      - EIR_LOG_FORMAT=${EIR_LOG_FORMAT:-text}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          memory: 32M

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:bifrost
    depends_on:
      bifrost:
        condition: service_started
      crowdsec:
        condition: service_started
    environment:
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_API_KEY:?CROWDSEC_BOUNCER_API_KEY is required}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro
      - /docker/proxy/caddy/data:/data
      - /docker/proxy/caddy/config:/config
      - /docker/proxy/caddy/logs:/var/log/caddy
      - geoip-data:/geoip:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: crowdsec
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:bifrost
    depends_on:
      bifrost:
        condition: service_started
    environment:
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/http-cve crowdsecurity/base-http-scenarios
      - GID=${PGID:-1000}
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      - /docker/proxy/crowdsec/data:/var/lib/crowdsec/data
      - /docker/proxy/crowdsec/config:/etc/crowdsec
      - /docker/proxy/caddy/logs:/var/log/caddy:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 128M

  geoipupdate:
    image: maxmindinc/geoipupdate:v7
    container_name: geoipupdate
    restart: unless-stopped
    logging: *default-logging
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID:?GEOIPUPDATE_ACCOUNT_ID is required}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY:?GEOIPUPDATE_LICENSE_KEY is required}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-City
      - GEOIPUPDATE_FREQUENCY=${GEOIPUPDATE_FREQUENCY:-24}
    volumes:
      - geoip-data:/usr/share/GeoIP
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          memory: 32M

  alloy:
    image: grafana/alloy:v1.17.1
    container_name: alloy
    restart: unless-stopped
    logging: *default-logging
    network_mode: service:bifrost
    depends_on:
      bifrost:
        condition: service_started
    command:
      - run
      - /etc/alloy/
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      - HOST_HOSTNAME=${ALLOY_HOSTNAME:-}
      - REMOTE_WRITE_URL=${ALLOY_REMOTE_WRITE_URL:?ALLOY_REMOTE_WRITE_URL is required}
      - LOGS_PUSH_URL=${ALLOY_LOGS_PUSH_URL:?ALLOY_LOGS_PUSH_URL is required}
    privileged: true
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      - geoip-data:/geoip:ro
      - /var/log:/var/log/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /var/run:/var/run
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: 512M
        reservations:
          memory: 256M

volumes:
  geoip-data:
  alloy-data:
