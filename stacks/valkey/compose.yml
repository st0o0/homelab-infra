x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  valkey:
    image: ghcr.io/valkey-io/valkey:9.2.1-alpine@sha256:3ad5a213cb1bc2fd4a113c89b6248a88655a6bf1dda69519d04e03cd3e3d2742
    container_name: valkey
    restart: always
    logging: *default-logging
    command: >-
      valkey-server
      --requirepass ${VALKEY_PASS:?VALKEY_PASS is required}
      --maxmemory ${VALKEY_MAXMEMORY:-64mb}
      --maxmemory-policy ${VALKEY_MAXMEMORY_POLICY:-noeviction}
      --appendonly yes
    environment:
      - TZ=${TZ:-Europe/Berlin}
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - ${VALKEY_PATH_DATA:?VALKEY_PATH_DATA is required}:/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 128M
        reservations:
          memory: 32M

networks:
  db-net:
    external: true
