x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  valkey:
    image: docker.io/valkey/valkey:9.1.2-alpine@sha256:cc15435e4fe8e285b161b8781eebf741773ee4bfbbe2504089feee7a0b2f1dfc
    container_name: valkey
    restart: always
    logging: *default-logging
    command: >-
      valkey-server
      --requirepass ${VALKEY_PASS:?VALKEY_PASS is required}
      --maxmemory ${VALKEY_MAXMEMORY:-64mb}
      --maxmemory-policy ${VALKEY_MAXMEMORY_POLICY:-noeviction}
      --appendonly yes
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - ${VALKEY_PATH_DATA:?VALKEY_PATH_DATA is required}:/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 128M
        reservations:
          memory: 32M

networks:
  db-net:
    external: true
