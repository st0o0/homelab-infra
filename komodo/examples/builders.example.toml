# ║  Komodo Builder — all available options                            ║
# ║  Source: docs.rs/komodo_client — BuilderConfig                     ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ── Server builder (simplest option) ─────────────────────────────────
# Uses an existing server with a Periphery agent

[[builder]]
name = "local-builder"
description = "Builds on an existing Komodo server"
tags = ["infra"]

[builder.config]
type = "Server"
[builder.config.params]
server_id = "FeelsStrongMan"

# ── AWS EC2 builder (temporary instance) ─────────────────────────────
# Spins up an EC2 instance for the build, shuts it down afterwards

[[builder]]
name = "aws-builder"
description = "Temporary EC2 instance for builds"
tags = ["cloud"]

[builder.config]
type = "Aws"
[builder.config.params]
region = "eu-central-1"
ami_id = "ami-0e9bd154667944680"
instance_type = "t3.medium"
subnet_id = "subnet-0123456789abcdef0"
key_pair_name = "my-keypair"
assign_public_ip = true
use_public_ip = true
security_group_ids = ["sg-0123456789abcdef0"]

