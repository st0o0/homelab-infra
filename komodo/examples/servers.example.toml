# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Komodo Server — all available options                             ║
# ║  Source: docs.rs/komodo_client — ServerConfig (23 fields)          ║
# ╚══════════════════════════════════════════════════════════════════════╝

[[server]]
name = "example-server"
description = "Example server with all available options"
tags = ["production", "gpu"]

[server.config]
# ── Connection ────────────────────────────────────────────────────────
# WebSocket address of the Periphery agent (empty = Periphery connects to Core)
address = "https://192.168.1.100:8120"
# Skip TLS certificate validation for Periphery
insecure_tls = false
# External address used for container links in the UI (falls back to `address`)
external_address = "https://server.example.com"

# ── General ───────────────────────────────────────────────────────────
# Whether the server is enabled (disabled = no actions, no status)
enabled = true
# Optional region label
region = "eu-west"
# Automatically rotate keys when RotateAllServerKeys is called
auto_rotate_keys = true
# (Deprecated) Passkey for Periphery authentication
# passkey = ""

# ── Quick links (shown in UI header) ─────────────────────────────────
links = [
  "https://grafana.example.com/d/server-dashboard",
  "https://portainer.example.com",
]

# ── Docker ────────────────────────────────────────────────────────────
# Run `docker image prune -a -f` every 24 hours
auto_prune = true

# ── Monitoring ────────────────────────────────────────────────────────
# Collect server stats beyond health checks
stats_monitoring = true
# Mount paths to exclude from stats reports
ignore_mounts = ["/mnt/backup", "/mnt/nfs"]

# ── Alerts ────────────────────────────────────────────────────────────
send_unreachable_alerts = true
send_cpu_alerts = true
send_mem_alerts = true
send_disk_alerts = true
send_version_mismatch_alerts = true

# ── Thresholds (percent) ─────────────────────────────────────────────
cpu_warning = 80.0
cpu_critical = 95.0
mem_warning = 80.0
mem_critical = 95.0
disk_warning = 80.0
disk_critical = 95.0

# ── Maintenance windows (alerts suppressed during these) ─────────────
# [[server.config.maintenance_windows]]
# name = "Weekly maintenance"
# cron = "0 0 3 * * SUN"
# duration_minutes = 60
