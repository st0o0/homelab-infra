# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Komodo User Groups — all available options                        ║
# ║  Source: docs.rs/komodo_client — UserGroupToml                     ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# User Groups control permissions for Komodo users.
# Users are assigned by their Komodo username.

[[user_group]]
name = "admins"
users = ["admin@example.com", "ops@example.com"]

# Permissions per resource type and level:
# - None    — no access
# - Read    — read only
# - Execute — read + execute (Deploy, Build, etc.)
# - Write   — read + execute + configure

# Set blanket permissions for all resources of a given type
[user_group.all]
Server = "Write"
Stack = "Write"
Build = "Write"

# ── Restricted group ─────────────────────────────────────────────────

[[user_group]]
name = "developers"
users = ["dev1@example.com", "dev2@example.com"]

# Developers can only read servers and stacks
[user_group.all]
Server = "Read"
Stack = "Read"

# Grant higher level on a specific resource
# [[user_group.resource.Stack]]
# name = "dev-stack"
# level = "Execute"

# Available resource types for permissions:
# Server, Stack, Deployment, Build, Builder, Repo,
# Procedure, Action, Alerter, ResourceSync, Swarm
