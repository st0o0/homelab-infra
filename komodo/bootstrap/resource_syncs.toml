# Bootstrap ResourceSync — the only manually created sync in the UI.
#
# This file is loaded by the "bootstrap" ResourceSync (created once
# via the Komodo UI) and defines the main sync that manages all other
# resources.  The same definition also exists in
# komodo/resources/resource_syncs.toml so the main sync (delete = true)
# sees itself and does not try to self-delete.
#
# Webhook: configure a GitHub webhook for push events to
#   https://<KOMODO_HOST>/listener/github/sync/bootstrap/sync

[[resource_sync]]
name = "homelab-infra-sync"
description = "Sync all Komodo resources from the homelab-infra repo"

[resource_sync.config]
linked_repo = "homelab-infra"

resource_path = [
  "komodo/resources/servers.toml",
  "komodo/resources/stacks/",
  "komodo/resources/repos.toml",
  "komodo/resources/procedures.toml",
  "komodo/resources/alerters.toml",
  "komodo/resources/variables/",
  "komodo/resources/hosts/",
]

include_resources = true
include_variables = true
include_user_groups = false

delete = true
webhook_enabled = true
pending_alert = true
