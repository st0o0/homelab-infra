# ── FeelsDevMan ───────────────────────────────────────────────────────

[[stack]]
name = "whoami-1"
tags = ["testing"]
[stack.config]
server = "FeelsDevMan"
project_name = "whoami-1"
run_directory = "stacks/whoami"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
WHOAMI_PORT=8080
"""

[[stack]]
name = "caddy-dev"
tags = ["testing"]
[stack.config]
server = "FeelsDevMan"
project_name = "caddy-dev"
run_directory = "stacks/caddy"
file_paths = ["compose.yml", "compose.override.http-only.yaml"]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
run_build = true
environment = """
TZ=[[tz]]

# ── Bifrost (WG tunnel to homelab) ───────────────────────────
BIFROST_PRIVATE_KEY=[[FeelsDevMan_caddy_bifrost_private_key]]
BIFROST_ADDRESS=[[FeelsDevMan_caddy_bifrost_address]]
BIFROST_PEER_PUBLIC_KEY=[[FeelsDevMan_caddy_bifrost_peer_public_key]]
BIFROST_PEER_ENDPOINT=[[FeelsDevMan_caddy_bifrost_peer_endpoint]]
BIFROST_PEER_ALLOWED_IPS=[[FeelsDevMan_caddy_bifrost_peer_allowed_ips]]
BIFROST_PEER_PRESHARED_KEY=[[FeelsDevMan_caddy_bifrost_peer_preshared_key]]
BIFROST_LISTEN_PORT=51821
BIFROST_INTERFACE=wg1

# ── Caddy test routes (HTTP only) ───────────────────────────
CADDY_TARGET_WHOAMI=[[FeelsDevMan_caddy_target_whoami]]

# ── CrowdSec ────────────────────────────────────────────────
CROWDSEC_BOUNCER_API_KEY=[[FeelsDevMan_crowdsec_bouncer_api_key]]

# ── Cloudflare (not used in HTTP mode, but env must exist) ──
CF_API_TOKEN=unused

# ── Eir ──────────────────────────────────────────────────────
EIR_STABILIZE_WAIT=15s
EIR_MAX_RETRIES=3
EIR_RETRY_BACKOFF=5s
"""

[[stack]]
name = "alloy-2"
tags = ["monitoring"]
[stack.config]
server = "FeelsDevMan"
project_name = "alloy-2"
run_directory = "stacks/alloy"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
ALLOY_REMOTE_WRITE_URL=[[metrics_remote_write_url]]
ALLOY_LOGS_PUSH_URL=[[metrics_logs_push_url]]
ALLOY_NUT_EXPORTER_TARGET=
ALLOY_HOSTNAME=FeelsDevMan
ALLOY_SCRAPE_INTERVAL=30s
ALLOY_NUT_ENABLED=false
ALLOY_SECURITY_LOGS_ENABLED=false
CADVISOR_HOUSEKEEPING_INTERVAL=30s
CADVISOR_DOCKER_ONLY=true
CADVISOR_DISABLE_METRICS=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp
"""
