# ── FeelsAlertsMan ─────────────────────────────────────────────────────────

[[stack]]
name = "metrics-1"
tags = ["monitoring"]
[stack.config]
server = "FeelsAlertsMan"
project_name = "metrics-1"
run_directory = "stacks/metrics"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
GRAFANA_ROOT_URL=[[FeelsAlertsMan_grafana_root_url]]
GRAFANA_DISCORD_WEBHOOK_URL=[[FeelsAlertsMan_grafana_discord_webhook_url]]
GRAFANA_UNIFIED_ALERTING_ENABLED=[[FeelsAlertsMan_grafana_unified_alerting_enabled]]
GRAFANA_PORT=[[FeelsAlertsMan_grafana_port]]
GRAFANA_ADMIN_USER=[[FeelsAlertsMan_grafana_admin_user]]
GRAFANA_ADMIN_PASS=[[FeelsAlertsMan_grafana_admin_password]]
GRAFANA_ALLOW_SIGN_UP=[[FeelsAlertsMan_grafana_admin_sign_up]]
GRAFANA_ANALYTICS_REPORTING=[[FeelsAlertsMan_grafana_analytics_reporting]]
GRAFANA_CHECK_FOR_UPDATES=[[FeelsAlertsMan_grafana_check_for_updates]]
GRAFANA_NEWS_FEED=[[FeelsAlertsMan_grafana_news_feed]]
GRAFANA_DB_TYPE=[[FeelsAlertsMan_grafana_db_type]]
GRAFANA_DB_HOST=[[FeelsAlertsMan_grafana_db_host]]
GRAFANA_DB_NAME=[[FeelsAlertsMan_grafana_db_name]]
GRAFANA_DB_USER=[[FeelsAlertsMan_grafana_db_user]]
GRAFANA_DB_PASS=[[FeelsAlertsMan_grafana_db_pass]]
GRAFANA_DB_SSL_MODE=[[FeelsAlertsMan_grafana_ssl_mode]]
VL_PORT=[[FeelsAlertsMan_vl_port]]
VL_PATH_DATA=[[FeelsAlertsMan_vl_path_data]]
VL_RETENTION=[[FeelsAlertsMan_vl_retention]]
VL_PUSH_METRICS_INTERVAL=[[FeelsAlertsMan_vl_push_metrics_interval]]
VM_RETENTION=[[FeelsAlertsMan_vm_retention]]
VM_SCRAPE_INTERVAL=[[FeelsAlertsMan_vm_scrape_interval]]
VM_SELF_SCRAPE_INTERVAL=[[FeelsAlertsMan_vm_self_scrape_interval]]
VM_PORT=[[FeelsAlertsMan_vm_port]]
VM_PATH_DATA=[[FeelsAlertsMan_vm_path_data]]
VM_CACHE_TIMESTAMP_OFFSET=10m
VM_MEMORY_ALLOWED_PERCENT=80
"""

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/dashboards.yml"
requires = "Redeploy"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/alloy.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/authentik.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/containerlogs.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/containers.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/databases.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/nodes.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/nut.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/pihole.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/proxmox.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/proxy.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/security.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/victorialogs.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/victoriametrics.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/dashboards/json/media-overview.json"
requires = "Restart"

[[stack.config.config_files]]
path = "grafana/provisioning/datasources/datasources.yml"
requires = "Redeploy"

[[stack.config.config_files]]
path = "grafana/provisioning/alerting/alert-rules.yml"
requires = "Redeploy"

[[stack.config.config_files]]
path = "grafana/provisioning/alerting/contact-points.yml"
requires = "Redeploy"

[[stack.config.config_files]]
path = "grafana/provisioning/alerting/notification-policies.yml"
requires = "Redeploy"

[[stack.config.config_files]]
path = "grafana/provisioning/alerting/templates.yml"
requires = "Redeploy"

[[stack]]
name = "alloy-1"
tags = ["monitoring"]
after = ["metrics-1"]
[stack.config]
server = "FeelsAlertsMan"
project_name = "alloy-1"
run_directory = "stacks/alloy"
file_paths = [
  "compose.yml",
  "compose.override.pihole.yaml",
  "compose.override.pve.yaml",
  "compose.override.speedtest.yaml",
]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
ALLOY_REMOTE_WRITE_URL=[[metrics_remote_write_url]]
ALLOY_LOGS_PUSH_URL=[[metrics_logs_push_url]]
ALLOY_HOSTNAME=FeelsAlertsMan
ALLOY_SCRAPE_INTERVAL=30s
GEOIPUPDATE_ACCOUNT_ID=[[maxmind_account_id]]
GEOIPUPDATE_LICENSE_KEY=[[maxmind_license_key]]
# ── Pi-hole exporter ──────────────────────────────────────
# Comma-separated for multiple instances
ALLOY_PIHOLE_EXPORTER_HOSTNAME=[[FeelsAlertsMan_pihole_exporter_hostname]]
ALLOY_PIHOLE_EXPORTER_PASSWORD=[[FeelsAlertsMan_pihole_exporter_password]]
ALLOY_PIHOLE_EXPORTER_PORT=[[FeelsAlertsMan_pihole_exporter_port]]
ALLOY_PIHOLE_EXPORTER_PROTOCOL=http

# ── PVE exporter (runs natively on Proxmox, scraped remotely) ──
ALLOY_PVE_EXPORTER_TARGET=[[FeelsAlertsMan_pve_exporter_target]]
"""

[[stack.config.config_files]]
path = "alloy/cadvisor.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "alloy/docker.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "alloy/features.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "alloy/host.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "alloy/outputs.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "alloy/self.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/gitleaks.toml"
requires = "Redeploy"

[[stack.config.config_files]]
