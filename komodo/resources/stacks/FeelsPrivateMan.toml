# ── FeelsPrivateMan ───────────────────────────────────────────────────

[[stack]]
name = "proxy"
tags = ["infra", "security", "monitoring"]
[stack.config]
server = "FeelsPrivateMan"
project_name = "proxy"
run_directory = "stacks/proxy"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans", "--wait"]
run_build = true
auto_pull = true
send_alerts = true
poll_for_updates = true
auto_update = false
environment = """
TZ=[[tz]]

# ── Bifrost (WG tunnel to homelab) ───────────────────────────
BIFROST_PRIVATE_KEY=[[FeelsPrivateMan_caddy_bifrost_private_key]]
BIFROST_ADDRESS=[[FeelsPrivateMan_caddy_bifrost_address]]
BIFROST_PEER_PUBLIC_KEY=[[FeelsPrivateMan_caddy_bifrost_peer_public_key]]
BIFROST_PEER_ENDPOINT=[[FeelsPrivateMan_caddy_bifrost_peer_endpoint]]
BIFROST_PEER_ALLOWED_IPS=[[FeelsPrivateMan_caddy_bifrost_peer_allowed_ips]]
BIFROST_PEER_PRESHARED_KEY=[[FeelsPrivateMan_caddy_bifrost_peer_preshared_key]]
BIFROST_LISTEN_PORT=0
BIFROST_INTERFACE=wg0

# ── CrowdSec ────────────────────────────────────────────────
CROWDSEC_BOUNCER_API_KEY=[[FeelsPrivateMan_crowdsec_bouncer_api_key]]
CROWDSEC_ENROLL_KEY=[[FeelsPrivateMan_crowdsec_enroll_key]]
CROWDSEC_ENROLL_INSTANCE_NAME=FeelsPrivateMan
CROWDSEC_ENROLL_TAGS=homelab proxy

# ── ran (honeypot) ──────────────────────────────────────────
RAN_CROWDSEC_MACHINE_ID=[[FeelsPrivateMan_ran_crowdsec_machine_id]]
RAN_CROWDSEC_PASSWORD=[[FeelsPrivateMan_ran_crowdsec_password]]

# ── Eir ──────────────────────────────────────────────────────
EIR_MASTERS=bifrost
EIR_DISCOVERY_MODE=inspect
EIR_STABILIZE_WAIT=15s
EIR_MAX_RETRIES=3
EIR_RETRY_BACKOFF=5s
EIR_LOG_LEVEL=info
EIR_LOG_FORMAT=text

# ── Alloy (observability) ───────────────────────────────────
ALLOY_HOSTNAME=FeelsPrivateMan
ALLOY_REMOTE_WRITE_URL=[[FeelsPrivateMan_metrics_remote_write_url]]
ALLOY_LOGS_PUSH_URL=[[FeelsPrivateMan_metrics_logs_push_url]]

# ── GeoIP (MaxMind) ─────────────────────────────────────────
GEOIPUPDATE_ACCOUNT_ID=[[maxmind_account_id]]
GEOIPUPDATE_LICENSE_KEY=[[maxmind_license_key]]

# ── Caddy reverse proxy ─────────────────────────────────────
CADDY_DOMAIN_JELLYFIN=[[FeelsPrivateMan_caddy_domain_jellyfin]]
CADDY_TARGET_JELLYFIN=[[FeelsPrivateMan_caddy_target_jellyfin]]
CADDY_DOMAIN_SEERR=[[FeelsPrivateMan_caddy_domain_seerr]]
CADDY_TARGET_SEERR=[[FeelsPrivateMan_caddy_target_seerr]]
CADDY_DOMAIN_AUDIOBOOKSHELF=[[FeelsPrivateMan_caddy_domain_audiobookshelf]]
CADDY_TARGET_AUDIOBOOKSHELF=[[FeelsPrivateMan_caddy_target_audiobookshelf]]
CADDY_DOMAIN_IMMICH=[[FeelsPrivateMan_caddy_domain_immich]]
CADDY_TARGET_IMMICH=[[FeelsPrivateMan_caddy_target_immich]]
CADDY_DOMAIN_MEALIE=[[FeelsPrivateMan_caddy_domain_mealie]]
CADDY_TARGET_MEALIE=[[FeelsPrivateMan_caddy_target_mealie]]
CADDY_DOMAIN_VAULTWARDEN=[[FeelsPrivateMan_caddy_domain_vaultwarden]]
CADDY_TARGET_VAULTWARDEN=[[FeelsPrivateMan_caddy_target_vaultwarden]]
CADDY_DOMAIN_AUTHENTIK=[[FeelsPrivateMan_caddy_domain_authentik]]
CADDY_TARGET_AUTHENTIK=[[FeelsPrivateMan_caddy_target_authentik]]
"""

[[stack.config.config_files]]
path = "../../alloy/modules/appsec.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/caddy.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/crowdsec.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/fail2ban.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/honeypot.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/security.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/ssh.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/sudo.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/syslog.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/ufw.alloy"
requires = "Redeploy"
