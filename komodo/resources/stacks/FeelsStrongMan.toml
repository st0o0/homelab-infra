# ── FeelsStrongMan ────────────────────────────────────────────────────────

[[stack]]
name = "alloy-4"
tags = ["monitoring"]
[stack.config]
server = "FeelsStrongMan"
project_name = "alloy-4"
run_directory = "stacks/alloy"
file_paths = [
  "compose.yml",
  "compose.override.arr.yaml",
  "compose.override.authentik.yaml",
  "compose.override.jellyfin.yaml",
]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
ALLOY_REMOTE_WRITE_URL=[[metrics_remote_write_url]]
ALLOY_LOGS_PUSH_URL=[[metrics_logs_push_url]]
ALLOY_HOSTNAME=FeelsStrongMan
ALLOY_SCRAPE_INTERVAL=30s
GEOIPUPDATE_ACCOUNT_ID=[[maxmind_account_id]]
GEOIPUPDATE_LICENSE_KEY=[[maxmind_license_key]]
"""

[[stack.config.config_files]]
path = "../../alloy/modules/appsec.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/caddy.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/crowdsec.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/fail2ban.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/honeypot.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/security.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/ssh.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/sudo.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/syslog.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/ufw.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/features/arr.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/features/authentik.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/features/jellyfin.alloy"
requires = "Redeploy"

[stack.config.pre_deploy]
path = "."
command = "for net in authentik-net media-net arr-net immich-net; do docker network create $net 2>/dev/null || true; done"

[[stack]]
name = "authentik-1"
tags = ["infra"]
[stack.config]
server = "FeelsStrongMan"
run_directory = "stacks/authentik"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
PUID=[[puid]]
PGID=[[pgid]]
AUTHENTIK_LOG_LEVEL=info
AUTHENTIK_PORT_HTTP=9000
AUTHENTIK_PATH_MEDIA=/docker/authentik/media
AUTHENTIK_PATH_TEMPLATES=/docker/authentik/custom-templates
AUTHENTIK_PATH_CERTS=/docker/authentik/certs
AUTHENTIK_KEY=[[FeelsStrongMan_authentik_key]]
AUTHENTIK_BRAND_DOMAIN=[[FeelsStrongMan_authentik_brand_domain]]
AUTHENTIK_COOKIE_DOMAIN=[[FeelsStrongMan_authentik_cookie_domain]]
AUTHENTIK_TRUSTED_PROXY_CIDRS=[[FeelsStrongMan_authentik_trusted_proxy_cidrs]]
# GEO
AUTHENTIK_GEOIP_ACCOUNT_ID=[[maxmind_account_id]]
AUTHENTIK_GEOIP_LICENSE_KEY=[[maxmind_license_key]]
# DB
AUTHENTIK_DB_HOST=[[FeelsStrongMan_postgres_host]]
AUTHENTIK_DB_PORT=[[FeelsStrongMan_postgres_port]]
AUTHENTIK_DB_NAME=[[FeelsStrongMan_authentik_db_name]]
AUTHENTIK_DB_USER=[[FeelsStrongMan_authentik_db_user]]
AUTHENTIK_DB_PASS=[[FeelsStrongMan_authentik_db_pass]]
# EMAIL
AUTHENTIK_EMAIL_HOST=[[FeelsStrongMan_authentik_email_host]]
AUTHENTIK_EMAIL_PORT=[[FeelsStrongMan_authentik_email_port]]
AUTHENTIK_EMAIL_USER=[[FeelsStrongMan_authentik_email_user]]
AUTHENTIK_EMAIL_PASS=[[FeelsStrongMan_authentik_email_pass]]
AUTHENTIK_EMAIL_FROM=[[FeelsStrongMan_authentik_email_from]]
# Audiobookshelf
AUTHENTIK_PROVIDER_AUDIOBOOKSHELF_CLIENT_ID=[[FeelsStrongMan_authentik_provider_audiobookshelf_client_id]]
AUTHENTIK_PROVIDER_AUDIOBOOKSHELF_CLIENT_SECRET=[[FeelsStrongMan_authentik_provider_audiobookshelf_client_secret]]
AUTHENTIK_PROVIDER_AUDIOBOOKSHELF_REDIRECT_URI_1=[[FeelsStrongMan_authentik_provider_audiobookshelf_redirect_uri_1]]
AUTHENTIK_PROVIDER_AUDIOBOOKSHELF_REDIRECT_URI_2=[[FeelsStrongMan_authentik_provider_audiobookshelf_redirect_uri_2]]
# Immich
AUTHENTIK_PROVIDER_IMMICH_CLIENT_ID=[[FeelsStrongMan_authentik_provider_immich_client_id]]
AUTHENTIK_PROVIDER_IMMICH_CLIENT_SECRET=[[FeelsStrongMan_authentik_provider_immich_client_secret]]
AUTHENTIK_PROVIDER_IMMICH_REDIRECT_URI_1=[[FeelsStrongMan_authentik_provider_immich_redirect_uri_1]]
AUTHENTIK_PROVIDER_IMMICH_REDIRECT_URI_2=[[FeelsStrongMan_authentik_provider_immich_redirect_uri_2]]
AUTHENTIK_PROVIDER_IMMICH_REDIRECT_URI_3=[[FeelsStrongMan_authentik_provider_immich_redirect_uri_3]]
# Jellyfin
AUTHENTIK_PROVIDER_JELLYFIN_CLIENT_ID=[[FeelsStrongMan_authentik_provider_jellyfin_client_id]]
AUTHENTIK_PROVIDER_JELLYFIN_CLIENT_SECRET=[[FeelsStrongMan_authentik_provider_jellyfin_client_secret]]
AUTHENTIK_PROVIDER_JELLYFIN_REDIRECT_URI=[[FeelsStrongMan_authentik_provider_jellyfin_redirect_uri]]
# Mealie
AUTHENTIK_PROVIDER_MEALIE_CLIENT_ID=[[FeelsStrongMan_authentik_provider_mealie_client_id]]
AUTHENTIK_PROVIDER_MEALIE_CLIENT_SECRET=[[FeelsStrongMan_authentik_provider_mealie_client_secret]]
AUTHENTIK_PROVIDER_MEALIE_REDIRECT_URI_1=[[FeelsStrongMan_authentik_provider_mealie_redirect_uri_1]]
AUTHENTIK_PROVIDER_MEALIE_REDIRECT_URI_2=[[FeelsStrongMan_authentik_provider_mealie_redirect_uri_2]]
# Paperless
AUTHENTIK_PROVIDER_PAPERLESS_CLIENT_ID=[[FeelsStrongMan_authentik_provider_paperless_client_id]]
AUTHENTIK_PROVIDER_PAPERLESS_CLIENT_SECRET=[[FeelsStrongMan_authentik_provider_paperless_client_secret]]
AUTHENTIK_PROVIDER_PAPERLESS_REDIRECT_URI=[[FeelsStrongMan_authentik_provider_paperless_redirect_uri]]
# Vaultwarden
AUTHENTIK_PROVIDER_VAULTWARDEN_CLIENT_ID=[[FeelsStrongMan_authentik_provider_vaultwarden_client_id]]
AUTHENTIK_PROVIDER_VAULTWARDEN_CLIENT_SECRET=[[FeelsStrongMan_authentik_provider_vaultwarden_client_secret]]
AUTHENTIK_PROVIDER_VAULTWARDEN_REDIRECT_URI=[[FeelsStrongMan_authentik_provider_vaultwarden_redirect_uri]]
AUTHENTIK_PROVIDER_VAULTWARDEN_EXTERNAL_HOST=[[FeelsStrongMan_authentik_provider_vaultwarden_external_host]]
# Pangolin
AUTHENTIK_PROVIDER_PANGOLIN_CLIENT_ID=[[FeelsStrongMan_authentik_provider_pangolin_client_id]]
AUTHENTIK_PROVIDER_PANGOLIN_CLIENT_SECRET=[[FeelsStrongMan_authentik_provider_pangolin_client_secret]]
AUTHENTIK_PROVIDER_PANGOLIN_REDIRECT_URI=[[FeelsStrongMan_authentik_provider_pangolin_redirect_uri]]
# Komodo
AUTHENTIK_PROVIDER_KOMODO_CLIENT_ID=[[FeelsStrongMan_authentik_provider_komodo_client_id]]
AUTHENTIK_PROVIDER_KOMODO_CLIENT_SECRET=[[FeelsStrongMan_authentik_provider_komodo_client_secret]]
AUTHENTIK_PROVIDER_KOMODO_REDIRECT_URI=[[FeelsStrongMan_authentik_provider_komodo_redirect_uri]]
"""

[[stack]]
name = "arr-1"
tags = ["media"]
after = ["media-1"]
[stack.config]
server = "FeelsStrongMan"
run_directory = "stacks/arr"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
ignore_services = ["configarr"]
environment = """
PUID=[[puid]]
PGID=[[pgid]]
TZ=[[tz]]
ARR_MEDIA_PATH=/data/media
# CIFS
CIFS_MEDIA_HOST=[[FeelsStrongMan_cifs_media_host]]
CIFS_MEDIA_SHARE=[[FeelsStrongMan_cifs_media_share]]
CIFS_MEDIA_USER=[[FeelsStrongMan_cifs_media_user]]
CIFS_MEDIA_PASS=[[FeelsStrongMan_cifs_media_password]]
# Sonarr
SONARR_PORT=1089
SONARR_PATH_CONFIG=/docker/arr/sonarr/config
SONARR_API_KEY=[[FeelsStrongMan_sonarr_api_key]]
SONARR_POSTGRES_HOST=[[FeelsStrongMan_postgres_host]]
SONARR_POSTGRES_PORT=[[FeelsStrongMan_postgres_port]]
SONARR_POSTGRES_USER=[[FeelsStrongMan_sonarr_postgres_user]]
SONARR_POSTGRES_PASS=[[FeelsStrongMan_sonarr_postgres_pass]]
SONARR_POSTGRES_MAINDB=[[FeelsStrongMan_sonarr_postgres_maindb]]
SONARR_POSTGRES_LOGDB=[[FeelsStrongMan_sonarr_postgres_logdb]]
# Radarr
RADARR_PORT=1078
RADARR_PATH_CONFIG=/docker/arr/radarr/config
RADARR_API_KEY=[[FeelsStrongMan_radarr_api_key]]
RADARR_POSTGRES_HOST=[[FeelsStrongMan_postgres_host]]
RADARR_POSTGRES_PORT=[[FeelsStrongMan_postgres_port]]
RADARR_POSTGRES_USER=[[FeelsStrongMan_radarr_postgres_user]]
RADARR_POSTGRES_PASS=[[FeelsStrongMan_radarr_postgres_pass]]
RADARR_POSTGRES_MAINDB=[[FeelsStrongMan_radarr_postgres_maindb]]
RADARR_POSTGRES_LOGDB=[[FeelsStrongMan_radarr_postgres_logdb]]
# Prowlarr
PROWLARR_PORT=1096
PROWLARR_PATH_CONFIG=/docker/arr/prowlarr/config
PROWLARR_API_KEY=[[FeelsStrongMan_prowlarr_api_key]]
PROWLARR_POSTGRES_HOST=[[FeelsStrongMan_postgres_host]]
PROWLARR_POSTGRES_PORT=[[FeelsStrongMan_postgres_port]]
PROWLARR_POSTGRES_USER=[[FeelsStrongMan_prowlarr_postgres_user]]
PROWLARR_POSTGRES_PASS=[[FeelsStrongMan_prowlarr_postgres_pass]]
PROWLARR_POSTGRES_MAINDB=[[FeelsStrongMan_prowlarr_postgres_maindb]]
PROWLARR_POSTGRES_LOGDB=[[FeelsStrongMan_prowlarr_postgres_logdb]]
# Seerr
SEERR_PORT=1055
SEERR_LOG_LEVEL=info
SEERR_PATH_CONFIG=/docker/arr/seerr/config
SEERR_DB_TYPE=postgres
SEERR_DB_HOST=[[FeelsStrongMan_postgres_host]]
SEERR_DB_PORT=[[FeelsStrongMan_postgres_port]]
SEERR_DB_USER=[[FeelsStrongMan_seerr_db_user]]
SEERR_DB_PASS=[[FeelsStrongMan_seerr_db_pass]]
SEERR_DB_NAME=[[FeelsStrongMan_seerr_db_name]]
# Seekarr
SEEKARR_PATH_CONFIG=/docker/arr/seekarr/config.yml
SEEKARR_PATH_DATA=/docker/arr/seekarr/data
# Youtarr
YOUTARR_PORT=3087
YOUTARR_PATH_CONFIG=/docker/arr/youtarr/config
YOUTARR_PATH_JOBS=/docker/arr/youtarr/jobs
YOUTARR_DB_PATH=/docker/arr/youtarr/db
YOUTARR_DB_ROOT_PASSWORD=[[FeelsStrongMan_youtarr_db_root_pass]]
YOUTARR_DB_PASSWORD=[[FeelsStrongMan_youtarr_db_pass]]
YOUTARR_DB_USER=youtarr
YOUTARR_DB_NAME=youtarr
YOUTARR_PATH_DOWNLOADS=/mnt/ssd/Videos
YOUTARR_PATH_IMAGES=/docker/arr/youtarr/images
"""

[[stack.config.config_files]]
path = "configarr/config.yml"
requires = "Redeploy"

[[stack.config.config_files]]
path = "scripts/pre-deploy.sh"
requires = "Redeploy"

[stack.config.pre_deploy]
path = "."
command = "docker network create media-net 2>/dev/null || true && sh scripts/pre-deploy.sh"

[[stack]]
name = "downloader-1"
tags = ["media"]
after = ["arr-1"]
[stack.config]
server = "FeelsStrongMan"
run_directory = "stacks/downloader"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
PUID=[[puid]]
PGID=[[pgid]]
# Gluetun
GLUETUN_WG_PRIVATE_KEY=[[FeelsStrongMan_gluetun_wireguard_private_key]]
GLUETUN_WG_PRESHARED_KEY=[[FeelsStrongMan_gluetun_wireguard_preshared_key]]
GLUETUN_WG_ADDRESSES=[[FeelsStrongMan_gluetun_wireguard_addresses]]
GLUETUN_VPN_PROVIDER=[[FeelsStrongMan_gluetun_vpn_provider]]
GLUETUN_VPN_TYPE=[[FeelsStrongMan_gluetun_vpn_type]]
GLUETUN_SERVER_CITIES=[[FeelsStrongMan_gluetun_server_cities]]
GLUETUN_DOT_PROVIDERS=[[FeelsStrongMan_gluetun_dot_providers]]
GLUETUN_WG_MTU=1380
GLUETUN_PORT=8079
# NZBGet
NZBGET_PORT=8080
NZBGET_PATH_CONFIG=/docker/downloader/nzbget/config
NZBGET_PATH_TMP=/mnt/ssd/usenet/tmp
NZBGET_PATH_INTERMEDIATE=/mnt/ssd/usenet/intermediate
NZBGET_USER=[[FeelsStrongMan_nzbget_user]]
NZBGET_PASS=[[FeelsStrongMan_nzbget_pass]]
# Firefox
FIREFOX_PORT=8081
FIREFOX_PATH_CONFIG=/docker/downloader/firefox/config
FIREFOX_MEMORY=512MB
FIREFOX_LANG=de_DE.UTF-8
# CIFS
CIFS_DOWNLOADS_HOST=[[FeelsStrongMan_cifs_downloads_host]]
CIFS_DOWNLOADS_SHARE=[[FeelsStrongMan_cifs_downloads_share]]
CIFS_DOWNLOADS_USER=[[FeelsStrongMan_cifs_downloads_user]]
CIFS_DOWNLOADS_PASS=[[FeelsStrongMan_cifs_downloads_password]]
"""

[stack.config.pre_deploy]
path = "."
command = "docker network create media-net 2>/dev/null || true"

