# ── FeelsQueryMan ──────────────────────────────────────────────────────────

[[stack]]
name = "postgres-1"
tags = ["database"]
[stack.config]
server = "FeelsQueryMan"
project_name = "postgres-1"
run_directory = "stacks/postgres"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
destroy_before_deploy = true
environment = """
TZ=[[tz]]
PG_USER=[[FeelsQueryMan_postgres_user]]
PG_PASS=[[FeelsQueryMan_postgres_pass]]
PG_DB=[[FeelsQueryMan_postgres_db]]
PG_PORT=[[FeelsQueryMan_postgres_port]]
PG_PATH_DATA=/docker/postgres/data
"""

[stack.config.pre_deploy]
path = "."
command = "docker network create db-net 2>/dev/null || true"

[[stack]]
name = "immich-postgres-1"
tags = ["database"]
[stack.config]
server = "FeelsQueryMan"
project_name = "immich-postgres-1"
run_directory = "stacks/immich-postgres"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
IMMICH_PG_USER=[[FeelsQueryMan_immich_postgres_user]]
IMMICH_PG_PASS=[[FeelsQueryMan_immich_postgres_pass]]
IMMICH_PG_DB=[[FeelsQueryMan_immich_postgres_db]]
IMMICH_PG_PORT=[[FeelsQueryMan_immich_postgres_port]]
IMMICH_PG_PATH_DATA=/docker/immich-postgres/data
"""

[stack.config.pre_deploy]
path = "."
command = "docker network create db-net 2>/dev/null || true"

[[stack]]
name = "mongodb-1"
tags = ["database"]
[stack.config]
server = "FeelsQueryMan"
project_name = "mongodb-1"
run_directory = "stacks/mongodb"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
MONGO_ROOT_USER=[[FeelsQueryMan_mongo_root_user]]
MONGO_ROOT_PASS=[[FeelsQueryMan_mongo_root_pass]]
MONGO_PORT=[[FeelsQueryMan_mongo_port]]
MONGO_PATH_DATA=/docker/mongodb/data
"""

[stack.config.pre_deploy]
path = "."
command = "docker network create db-net 2>/dev/null || true"

[[stack]]
name = "valkey-1"
tags = ["database"]
[stack.config]
server = "FeelsQueryMan"
project_name = "valkey-1"
run_directory = "stacks/valkey"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
VALKEY_PASS=[[FeelsQueryMan_valkey_pass]]
VALKEY_PORT=[[FeelsQueryMan_valkey_port]]
VALKEY_PATH_DATA=/docker/valkey/data
VALKEY_MAXMEMORY=256mb
VALKEY_MAXMEMORY_POLICY=allkeys-lru
"""

[stack.config.pre_deploy]
path = "."
command = "docker network create db-net 2>/dev/null || true"

[[stack]]
name = "alloy-5"
tags = ["monitoring"]
after = ["postgres-1", "immich-postgres-1", "mongodb-1", "valkey-1"]
[stack.config]
server = "FeelsQueryMan"
project_name = "alloy-5"
run_directory = "stacks/alloy"
file_paths = [
  "compose.yml",
  "compose.override.databases.yaml",
]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
ALLOY_REMOTE_WRITE_URL=[[metrics_remote_write_url]]
ALLOY_LOGS_PUSH_URL=[[metrics_logs_push_url]]
ALLOY_HOSTNAME=FeelsQueryMan
ALLOY_SCRAPE_INTERVAL=30s
GEOIPUPDATE_ACCOUNT_ID=[[maxmind_account_id]]
GEOIPUPDATE_LICENSE_KEY=[[maxmind_license_key]]
ALLOY_POSTGRES_DSN=[[FeelsQueryMan_alloy_postgres_dsn]]
ALLOY_IMMICH_POSTGRES_DSN=[[FeelsQueryMan_alloy_immich_postgres_dsn]]
ALLOY_IMMICH_POSTGRES_ENABLED=true
ALLOY_REDIS_ADDR=valkey:6379
ALLOY_REDIS_PASSWORD=[[FeelsQueryMan_alloy_redis_password]]
ALLOY_MONGODB_URI=[[FeelsQueryMan_alloy_mongodb_uri]]
"""

[[stack.config.config_files]]
path = "../../alloy/modules/appsec.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/caddy.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/crowdsec.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/fail2ban.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/honeypot.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/security.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/ssh.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/sudo.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/syslog.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/ufw.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/features/databases.alloy"
requires = "Redeploy"
