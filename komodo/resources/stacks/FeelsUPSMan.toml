# ── FeelsUPSMan ───────────────────────────────────────────────────────────

[[stack]]
name = "mjolnir-1"
tags = ["infra"]
[stack.config]
server = "FeelsUPSMan"
run_directory = "stacks/mjolnir"
file_paths = ["compose.yml"]
project_name = "mjolnir-1"
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
NUT_UPS_1_NAME=ups
NUT_UPS_1_DRIVER=[[FeelsUPSMan_nut_driver]]
NUT_UPS_1_PORT=auto
NUT_UPS_1_DESC=UPS
NUT_USER_1_NAME=[[FeelsUPSMan_nut_user_name]]
NUT_USER_1_PASSWORD=[[FeelsUPSMan_nut_user_password]]
NUT_USER_1_UPSMON=primary
"""

[[stack]]
name = "alloy-2"
tags = ["monitoring"]
[stack.config]
server = "FeelsUPSMan"
project_name = "alloy-2"
run_directory = "stacks/alloy"
file_paths = [
  "compose.yml",
  "compose.override.low-power.yaml",
  "compose.override.nut.yaml",
]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
ALLOY_REMOTE_WRITE_URL=[[metrics_remote_write_url]]
ALLOY_LOGS_PUSH_URL=[[metrics_logs_push_url]]
ALLOY_HOSTNAME=FeelsUPSMan
ALLOY_SCRAPE_INTERVAL=60s
GEOIPUPDATE_ACCOUNT_ID=[[maxmind_account_id]]
GEOIPUPDATE_LICENSE_KEY=[[maxmind_license_key]]

# ── Low-power tuning (Pi 2) ──────────────────────────────
ALLOY_GOGC=50
ALLOY_GOMAXPROCS=2
ALLOY_CADVISOR_DOCKER_ONLY=true
ALLOY_CADVISOR_STORE_LABELS=true
"""

[[stack.config.config_files]]
path = "alloy/cadvisor.alloy"
requires = "Redeploy"

