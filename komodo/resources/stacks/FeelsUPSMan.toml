# ── FeelsUPSMan ───────────────────────────────────────────────────────────

[[stack]]
name = "nut-upsd-1"
tags = ["infra"]
[stack.config]
server = "FeelsUPSMan"
run_directory = "stacks/nut-upsd"
file_paths = ["compose.yml"]
project_name = "nut-upsd-1"
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
PUID=[[puid]]
PGID=[[pgid]]
NUT_DRIVER=[[FeelsUPSMan_nut_driver]]
NUT_API_USER=[[FeelsUPSMan_nut_api_user]]
NUT_API_PASS=[[FeelsUPSMan_nut_api_password]]
NUT_NAME=ups
NUT_DRIVER_PORT=auto
NUT_POLL_INTERVAL=15
NUT_PORT=3493
NUT_PATH_CONFIG=/docker/nut-upsd/nut
"""

[[stack]]
name = "alloy-3"
tags = ["monitoring"]
[stack.config]
server = "FeelsUPSMan"
project_name = "alloy-3"
run_directory = "stacks/alloy"
file_paths = [
  "compose.yml",
  "compose.override.low-power.yaml",
]
linked_repo = "homelab-infra"
extra_args = ["--remove-orphans"]
environment = """
TZ=[[tz]]
ALLOY_REMOTE_WRITE_URL=[[metrics_remote_write_url]]
ALLOY_LOGS_PUSH_URL=[[metrics_logs_push_url]]
ALLOY_HOSTNAME=FeelsUPSMan
ALLOY_SCRAPE_INTERVAL=60s
GEOIPUPDATE_ACCOUNT_ID=[[maxmind_account_id]]
GEOIPUPDATE_LICENSE_KEY=[[maxmind_license_key]]

# ── Low-power tuning (Pi 2) ──────────────────────────────
ALLOY_GOGC=50
ALLOY_GOMAXPROCS=2
ALLOY_CADVISOR_DOCKER_ONLY=true
ALLOY_CADVISOR_STORE_LABELS=true
"""

[[stack.config.config_files]]
path = "../../alloy/modules/appsec.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/caddy.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/crowdsec.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/fail2ban.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/honeypot.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/security.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/ssh.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/sudo.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/syslog.alloy"
requires = "Redeploy"

[[stack.config.config_files]]
path = "../../alloy/modules/ufw.alloy"
requires = "Redeploy"
