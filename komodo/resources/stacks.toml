PUID=[[PUID]]
PGID=[[PGID]]
TZ=[[TZ]]
SONARR_CONFIG_PATH=/docker/arr/sonarr/config
RADARR_CONFIG_PATH=/docker/arr/radarr/config
PROWLARR_CONFIG_PATH=/docker/arr/prowlarr/config
SEERR_CONFIG_PATH=/docker/arr/seerr/config
DASHBOARD_CONFIG_PATH=/docker/arr/arrdashboard/config
