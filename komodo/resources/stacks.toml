# Komodo Stack resources — one per deployable stack in stacks/<service>/.
#
# stacks/komodo/ and stacks/komodo-periphery/ (Komodo's own Core/Periphery)
# are deliberately NOT declared here. Komodo has no native self-update for
# either component, and having Core manage its own deployment via itself is
# a chicken-and-egg risk (a broken Core can't redeploy itself). Both are
# deployed manually — see README.md Quick Start.
#
# All stacks source their compose files via `linked_repo = "homelab-infra"`
# — the shared Repo resource declared in komodo/resources/repos.toml —
# rather than each stack cloning its own copy of this repo, so every stack
# on a server shares one clone instead of cloning independently. No
# `git_account` needed anywhere here: st0o0/homelab-infra is public, so
# repos.toml clones it over anonymous HTTPS.
#
# `environment` lists only each stack's *required* variables (see each
# stacks/<service>/.env.example for the full optional list — those keep
# their compose-file defaults unless overridden here). Secret-backed values
# use [[SECRET_NAME]], resolved from komodo/secrets.sops.yaml /
# komodo/hosts/<host>/secrets.sops.yaml (see komodo/README.md). Shared
# non-secret values use [[VARIABLE_NAME]] from variables.toml.
#
# One deliberate exception to "only required": every `*_PATH` variable for a
# stack's persistent bind-mounted data is always set here too, even though
# it's optional at the compose layer (each has a relative `./...` fallback
# default, for standalone `docker compose up` use outside Komodo). Declaring
# them here — always as a literal `/docker/<stack-name>/...` value — keeps
# one place where every stack's on-disk data location is visible.
#
# `backrest` has no confirmed host yet — left commented out below until one
# is chosen.
#
# New shared secret keys referenced below that don't exist in
# komodo/secrets.sops.yaml yet — add via `just secrets` before syncing:
#   POSTGRES_PASSWORD, IMMICH_POSTGRES_PASSWORD, PIHOLE_PASSWORD,
#   BIFROST_PRIVATE_KEY, BIFROST_ADDRESS, BIFROST_PEER_PUBLIC_KEY,
#   BIFROST_PEER_ENDPOINT, BIFROST_PEER_ALLOWED_IPS, ARR_SONARR_API_KEY,
#   ARR_RADARR_API_KEY, ARR_TRACEARR_JWT_SECRET, ARR_TRACEARR_COOKIE_SECRET,
#   AUTHENTIK_SECRET_KEY, AUTHENTIK_PG_PASS, MEALIE_POSTGRES_PASSWORD,
#   MEALIE_POSTGRES_SERVER, DOWNLOADER_WIREGUARD_PRIVATE_KEY,
#   DOWNLOADER_WIREGUARD_ADDRESSES, NUT_DRIVER, NUT_API_PASSWORD,
#   OBSERVABILITY_REMOTE_WRITE_URL, OBSERVABILITY_LOGS_PUSH_URL,
#   GRAFANA_ADMIN_PASSWORD
# Per-host `host_ip` secrets (komodo/hosts/<host>/secrets.sops.yaml) are
# also required for every host referenced as [[<host>_host_ip]].

# ── FeelsCozyMan ──────────────────────────────────────────────────────────

[[stack]]
name = "homeassistant"
[stack.config]
server = "FeelsCozyMan"
run_directory = "stacks/homeassistant"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
environment = """
TZ=[[TZ]]
HA_CONFIG_PATH=/docker/homeassistant/data
MQTT_CONFIG_PATH=/docker/homeassistant/mosquitto/config
MQTT_DATA_PATH=/docker/homeassistant/mosquitto/data
MQTT_LOG_PATH=/docker/homeassistant/mosquitto/log
Z2M_DATA_PATH=/docker/homeassistant/zigbee2mqtt/data
MATTER_DATA_PATH=/docker/homeassistant/matter/data
"""

[[stack]]
name = "vaultwarden"
[stack.config]
server = "FeelsCozyMan"
run_directory = "stacks/vaultwarden"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
environment = """
TZ=[[TZ]]
VAULTWARDEN_DATA_PATH=/docker/vaultwarden/data
"""

