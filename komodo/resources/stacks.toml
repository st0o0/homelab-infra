# Komodo Stack resources — one per deployable stack in stacks/<service>/.
# All other secrets are per-host (komodo/resources/hosts/<host>/secrets.sops.yaml)
# and auto-prefixed with the hostname: [[<host>_secret_name]].
# See each host's secrets.sops.yaml for the full list.

# ── FeelsCozyMan ──────────────────────────────────────────────────────────

[[stack]]
name = "homeassistant"
[stack.config]
server = "FeelsCozyMan"
run_directory = "stacks/homeassistant"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
environment = """
HA_VLAN_IP=[[FeelsCozyMan_ha_vlan_ip]]
HA_VLAN_SUBNET=[[FeelsCozyMan_ha_vlan_subnet]]
TZ=[[tz]]
HA_SERIAL_DEVICE=/dev/serial1
HA_PORT=8123
HA_MAC_DEFAULT=02:42:ac:11:00:02
HA_MAC_VLAN=02:42:ac:12:00:02
HA_VLAN_PARENT=vlan88
HA_PATH_CONFIG=/docker/homeassistant/data
MQTT_PORT=8124
MQTT_PATH_CONFIG=/docker/homeassistant/mosquitto/config
MQTT_PATH_DATA=/docker/homeassistant/mosquitto/data
MQTT_PATH_LOG=/docker/homeassistant/mosquitto/log
Z2M_PORT=8125
Z2M_PATH_DATA=/docker/homeassistant/zigbee2mqtt/data
MATTER_LOG_LEVEL=info
MATTER_BLE_PROXY=true
MATTER_PATH_DATA=/docker/homeassistant/matter/data
NJORD_PORT=9090
NJORD_HEALTH_PORT=9091
NJORD_POLL_INTERVAL=01:00:00
NJORD_FORECAST_DAYS=7
NJORD_LOCATION_NAME=changeme
NJORD_LOCATION_LAT=changeme
NJORD_LOCATION_LON=changeme
"""

[[stack]]
name = "vaultwarden"
[stack.config]
server = "FeelsCozyMan"
run_directory = "stacks/vaultwarden"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
environment = """
VW_DOMAIN=[[FeelsCozyMan_vaultwarden_domain]]
VW_DATABASE_URL=[[FeelsCozyMan_vaultwarden_database_url]]
PUID=[[puid]]
PGID=[[pgid]]
TZ=[[tz]]
VW_DISABLE_ADMIN_TOKEN=true
VW_SIGNUPS_ALLOWED=false
VW_PORT=3002
VW_PATH_DATA=/docker/vaultwarden/data
"""

