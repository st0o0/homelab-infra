linked_repo = "homelab-infra"
environment = """
REMOTE_WRITE_URL=[[OBSERVABILITY_REMOTE_WRITE_URL]]
LOGS_PUSH_URL=[[OBSERVABILITY_LOGS_PUSH_URL]]
TZ=[[TZ]]
"""

