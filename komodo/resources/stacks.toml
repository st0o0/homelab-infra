# ── FeelsWatchMan ─────────────────────────────────────────────────────────

[[stack]]
name = "metrics"
[stack.config]
server = "FeelsWatchMan"
run_directory = "stacks/metrics"
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
environment = """
TZ=[[tz]]
GRAFANA_PORT=[[FeelsWatchMan_grafana_port]]
GRAFANA_ADMIN_USER=[[FeelsWatchMan_grafana_admin_user]]
GRAFANA_ADMIN_PASS=[[FeelsWatchMan_grafana_admin_password]]
GRAFANA_ALLOW_SIGN_UP=[[FeelsWatchMan_grafana_admin_sign_up]]
GRAFANA_ANALYTICS_REPORTING=false
GRAFANA_CHECK_FOR_UPDATES=false
GRAFANA_NEWS_FEED=false
GRAFANA_DB_WAL=[[FeelsWatchMan_grafana_db_wal]]
GRAFANA_DB_TYPE=[[FeelsWatchMan_grafana_db_type]]
GRAFANA_DB_HOST=[[FeelsWatchMan_grafana_db_host]]
GRAFANA_DB_NAME=[[FeelsWatchMan_grafana_db_name]]
GRAFANA_DB_USER=[[FeelsWatchMan_grafana_db_user]]
GRAFANA_DB_PASS=[[FeelsWatchMan_grafana_db_pass]]
GRAFANA_DB_SSL_MODE=[[FeelsWatchMan_grafana_ssl_mode]]
GRAFANA_PATH_DATA=/docker/metrics/grafana
VM_RETENTION=90d
VM_SCRAPE_INTERVAL=30s
VM_SELF_SCRAPE_INTERVAL=1m
VM_PORT=8428
VM_PATH_DATA=/docker/metrics/victoriametrics
VL_RETENTION=90d
VL_MAX_DISK_GB=0
VL_PORT=9428
VL_PATH_DATA=/docker/metrics/victorialogs
"""

[[stack]]
name = "alloy"
[stack.config]
server = "FeelsWatchMan"
run_directory = "stacks/alloy"
# FeelsWatchMan is the metrics host itself, so no Bifrost hop needed.
# For a future Alloy instance on a remote host, add the override instead of
# copying compose.override.bifrost.yaml -> compose.override.yaml:
#   file_paths = ["compose.yml", "compose.override.bifrost.yaml"]
file_paths = ["compose.yml"]
linked_repo = "homelab-infra"
environment = """
TZ=[[tz]]
ALLOY_REMOTE_WRITE_URL=[[metrics_remote_write_url]]
ALLOY_LOGS_PUSH_URL=[[metrics_logs_push_url]]
ALLOY_NUT_EXPORTER_TARGET=[[FeelsWatchMan_alloy_nut_exporter_target]]
ALLOY_HOSTNAME=
ALLOY_SCRAPE_INTERVAL=30s
ALLOY_NUT_ENABLED=false
ALLOY_SECURITY_LOGS_ENABLED=false
CADVISOR_HOUSEKEEPING_INTERVAL=30s
CADVISOR_DOCKER_ONLY=true
CADVISOR_DISABLE_METRICS=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp
"""

