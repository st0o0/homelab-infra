# Both syncs are declared here so bootstrap can load homelab-infra-sync.
# delete = false because a ResourceSync cannot manage itself.

[[resource_sync]]
name = "bootstrap"
description = "Bootstrap sync — loads the main resource sync definition"

[resource_sync.config]
linked_repo = "homelab-infra"
resource_path = ["komodo/bootstrap/resource_syncs.toml"]
include_resources = true
include_variables = false
include_user_groups = false
delete = false
webhook_enabled = true
pending_alert = true

[[resource_sync]]
name = "homelab-infra-sync"
description = "Sync all Komodo resources from the homelab-infra repo"

[resource_sync.config]
linked_repo = "homelab-infra"

resource_path = [
  "komodo/resources/servers.toml",
  "komodo/resources/stacks/",
  "komodo/resources/repos.toml",
  "komodo/resources/procedures.toml",
  "komodo/resources/alerters.toml",
  "komodo/resources/variables/",
  "komodo/resources/hosts/",
]

include_resources = true
include_variables = true
include_user_groups = false

delete = false
webhook_enabled = true
pending_alert = true
