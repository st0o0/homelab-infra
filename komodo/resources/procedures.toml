# Komodo Procedure resources — single Git webhook triggers the full
# deploy pipeline: sync TOML definitions, then redeploy only stacks
# whose compose actually changed.
#
# GitHub webhook (push events on main):
#   https://<KOMODO_HOST>/listener/github/procedure/deploy-homelab-infra/main
#
# PullRepo is NOT needed — stacks use linked_repo, so
# BatchDeployStackIfChanged pulls the repo implicitly per server.

[[procedure]]
name = "deploy-homelab-infra"
description = "Sync resources, then redeploy changed stacks"
webhook_enabled = true

[[procedure.config.stage]]
name = "Sync"
executions = [
  { execution.type = "RunSync", execution.params.sync = "homelab-infra-sync" }
]

[[procedure.config.stage]]
name = "Deploy changed stacks"
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*" }
]

[[procedure]]
name = "deploy-all-stacks"
description = "Sync resources, then force-redeploy ALL stacks regardless of changes"

[[procedure.config.stage]]
name = "Sync"
executions = [
  { execution.type = "RunSync", execution.params.sync = "homelab-infra-sync" }
]

[[procedure.config.stage]]
name = "Deploy all stacks"
executions = [
  { execution.type = "BatchDeployStack", execution.params.pattern = "*" }
]
