# DO NOT EDIT — use 'just k vars' to edit as flat YAML

#Grafana
#grafana_ssl_mode: "false"
[[variable]]
name = "FeelsAlertsMan_grafana_analytics_reporting"
value = "false"

[[variable]]
name = "FeelsAlertsMan_grafana_check_for_updates"
value = "false"

[[variable]]
