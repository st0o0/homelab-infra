# Example secrets file — copy to secrets.yaml, fill in values, then encrypt:
#   cp secrets.example.yaml secrets.yaml
#   sops -e secrets.yaml > secrets.sops.yaml
#
# These become available in Komodo as [[SECRET_NAME]] for stack interpolation.

