# Bootstrap
bootstrap_hostname_enabled: false

# Shell
shell_motd_enabled: true
shell_dotfiles_enabled: true

# Unattended upgrades: public server gets auto-reboot at 04:00
unattended_upgrades_enabled: true
unattended_upgrades_skip_reboot_required: false
unattended_upgrades_auto_reboot: true
unattended_upgrades_auto_reboot_time: "04:00"

# Firewall
ufw_enabled: true
ufw_disable_sysctl: true
ufw_extra_rules:
  - {rule: allow, port: 80, proto: tcp, comment: "Proxy HTTP"}
  - {rule: allow, port: 443, proto: tcp, comment: "Proxy HTTPS"}
  - {rule: allow, port: 443, proto: udp, comment: "Proxy QUIC"}
  # ran honeypot traps
  - {rule: allow, port: 21, proto: tcp, comment: "ran FTP"}
  - {rule: allow, port: 23, proto: tcp, comment: "ran Telnet"}
  - {rule: allow, port: 25, proto: tcp, comment: "ran SMTP"}
  - {rule: allow, port: 445, proto: tcp, comment: "ran SMB"}
  - {rule: allow, port: 587, proto: tcp, comment: "ran SMTP-Sub"}
  - {rule: allow, port: 1433, proto: tcp, comment: "ran MSSQL"}
  - {rule: allow, port: 1883, proto: tcp, comment: "ran MQTT"}
  - {rule: allow, port: 2222, proto: tcp, comment: "ran SSH"}
  - {rule: allow, port: 3307, proto: tcp, comment: "ran MySQL"}
  - {rule: allow, port: 3389, proto: tcp, comment: "ran RDP"}
  - {rule: allow, port: 5060, proto: udp, comment: "ran SIP"}
  - {rule: allow, port: 5432, proto: tcp, comment: "ran PostgreSQL"}
  - {rule: allow, port: 5555, proto: tcp, comment: "ran ADB"}
  - {rule: allow, port: 5900, proto: tcp, comment: "ran VNC"}
  - {rule: allow, port: 6379, proto: tcp, comment: "ran Redis"}
  - {rule: allow, port: 8080, proto: tcp, comment: "ran HTTP-Proxy"}
  - {rule: allow, port: 9200, proto: tcp, comment: "ran Elasticsearch"}
  - {rule: allow, port: 25565, proto: tcp, comment: "ran Minecraft"}
  - {rule: allow, port: 53, proto: udp, comment: "ran DNS"}
  - {rule: allow, port: 123, proto: udp, comment: "ran NTP"}
  - {rule: allow, port: 161, proto: udp, comment: "ran SNMP"}
  - {rule: allow, port: 1080, proto: tcp, comment: "ran SOCKS5"}
  - {rule: allow, port: 11211, proto: tcp, comment: "ran Memcached"}
  # ran multi-port variants
  - {rule: allow, port: 3000, proto: tcp, comment: "ran HTTP"}
  - {rule: allow, port: 3128, proto: tcp, comment: "ran HTTP-Proxy"}
  - {rule: allow, port: 3306, proto: tcp, comment: "ran MySQL"}
  - {rule: allow, port: 5901, proto: tcp, comment: "ran VNC"}
  - {rule: allow, port: 8081, proto: tcp, comment: "ran HTTP"}
  - {rule: allow, port: 8443, proto: tcp, comment: "ran HTTPS"}
  - {rule: allow, port: 9443, proto: tcp, comment: "ran HTTPS"}

# LXC: chrony cannot set system clock or access /dev/rtc in containers
ntp_enabled: false

# LXC: auditd requires kernel-level audit subsystem, not available in containers
auditd_enabled: false

# LXC: vm.swappiness sysctl is not writable in containers
swap_enabled: false
swap_set_swappiness: false

# LXC: rkhunter kernel module checks fail without /sbin/modprobe
rkhunter_enabled: false

# LXC: freshclam daemon not available, use cron-based updates instead
clamav_freshclam_daemon: false

# LXC: tcp_syncookies is not network-namespaced, remove from sysctl
sysctl_hardening_settings:
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1

# Fail2ban: stricter SSH settings for public-facing host
fail2ban_jails:
  - name: sshd
    enabled: true
    port: ssh
    filter: sshd
    logpath: /var/log/auth.log
    maxretry: 3
    findtime: 10m
    bantime: 24h
  - name: sshd-ddos
    enabled: true
    port: ssh
    filter: "sshd[mode=ddos]"
    logpath: /var/log/auth.log
    maxretry: 3
    findtime: 10m
    bantime: 24h
fail2ban_extra_jails:
  - name: recidive
    enabled: true
    port: all
    filter: recidive
    logpath: /var/log/fail2ban.log
    maxretry: 3
    findtime: 24h
    bantime: 1w
    banaction: "%(banaction_allports)s"

# Proxy (host directories + log symlink)
proxy_enabled: true

# Komodo (Periphery only, over Bifrost tunnel)
komodo_enabled: false
agent_enabled: true
agent_bifrost: true
