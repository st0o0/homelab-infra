komodo_deploy_path: /docker/komodo
komodo_enabled: false
komodo_tz: Europe/Berlin
komodo_image_tag: "{{ komodo_version }}"
komodo_port: 9120
komodo_bind_ip: "127.0.0.1"
komodo_host: "https://komodo.local"
komodo_title: "Homelab"
komodo_first_server_name: "{{ inventory_hostname }}"
komodo_monitoring_interval: "15-sec"
komodo_resource_poll_interval: "5-min"
komodo_backups_path: /docker/komodo/backups
komodo_periphery_root: /docker/komodo/data
komodo_extra_disk_mounts: []

# -- OIDC --
komodo_oidc_enabled: false

# -- Secrets provisioning (core.secrets.toml, see tasks/secrets.yml) --

# Path to the komodo/ subtree's secrets, relative to this role's playbook
# directory (ansible/). Reads the same checkout the playbook is running
# from — no fetch, no ref/branch concept, no "must be pushed first".
komodo_secrets_local_path: "{{ playbook_dir }}/../komodo"

# Bitwarden Secure Note that scripts/init-secrets.sh also reads/writes —
# same AGE key, single source of truth for it too. Must match
# HOMELAB_KOMODO_AGE_KEY_BW_ITEM in scripts/lib/bw-item-names.sh (Ansible
# can't source that shell file directly, so this is a manually-synced copy).
komodo_secrets_bw_item_name: "homelab_komodo_age_key"

# Combined AGE key file containing both trust boundaries. When this file
# exists, the role reads from it directly and skips the Bitwarden lookup.
komodo_secrets_age_key_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/sops/age/keys.txt"
