# Renders {{ komodo_deploy_path }}/core.secrets.toml on the target host from
# the komodo/ subtree's SOPS secrets in this same checkout. All lookup/read/
# decrypt work happens on the controller (delegate_to: localhost) — the
# target host never sees the AGE private key.
#
# The AGE key is resolved in order:
#   1. Local file ({{ komodo_secrets_age_key_file }}) — same path `just k secrets` uses.
#   2. Bitwarden Secure Note ({{ komodo_secrets_bw_item_name }}) — requires BW_SESSION.
#
# Requires on the controller: sops, jq. Bitwarden CLI only when falling back.

- name: Create temp directory for secrets processing
  ansible.builtin.tempfile:
    state: directory
    suffix: komodo-secrets
  register: _komodo_secrets_tmp
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Check for local AGE key file
  ansible.builtin.stat:
    path: "{{ komodo_secrets_age_key_file }}"
  register: _komodo_secrets_local_key
  delegate_to: localhost
  become: false
  run_once: true

- name: Copy local AGE key to temp file
  ansible.builtin.copy:
    src: "{{ komodo_secrets_age_key_file }}"
    dest: "{{ _komodo_secrets_tmp.path }}/age.key"
    remote_src: true
    mode: "0600"
  no_log: true
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true
  when: _komodo_secrets_local_key.stat.exists

- name: Resolve AGE key from Bitwarden (fallback)
  when: not _komodo_secrets_local_key.stat.exists
  delegate_to: localhost
  become: false
  run_once: true
  block:
    - name: Assert BW_SESSION is set
      ansible.builtin.assert:
        that: (lookup('ansible.builtin.env', 'BW_SESSION') | length) > 0
        fail_msg: >-
          No local AGE key at {{ komodo_secrets_age_key_file }} and BW_SESSION
          is not set. Either run `just setup` to restore the key locally, or
          `export BW_SESSION=$(bw unlock --raw)` to fetch it from Bitwarden.

    - name: List Bitwarden items matching the AGE key note name
      ansible.builtin.command:
        cmd: bw list items --search "{{ komodo_secrets_bw_item_name }}"
      register: _komodo_secrets_bw_list
      changed_when: false
      check_mode: false
      no_log: true

    - name: Assert the AGE key item exists in Bitwarden
      ansible.builtin.assert:
        that: >-
          (_komodo_secrets_bw_list.stdout | from_json
            | selectattr('name', 'equalto', komodo_secrets_bw_item_name)
            | list | length) > 0
        fail_msg: >-
          No Bitwarden item named '{{ komodo_secrets_bw_item_name }}' found.
          Run 'just setup' once, with BW_SESSION set, to create it.

    - name: Write AGE key to temp file
      ansible.builtin.copy:
        content: >-
          {{
            (_komodo_secrets_bw_list.stdout | from_json
              | selectattr('name', 'equalto', komodo_secrets_bw_item_name)
              | list | sort(attribute='revisionDate') | last).notes
          }}
        dest: "{{ _komodo_secrets_tmp.path }}/age.key"
        mode: "0600"
      no_log: true
      check_mode: false

- name: Decrypt and deploy secrets
  block:
    - name: Read local global secrets.sops.yaml
      ansible.builtin.copy:
        src: "{{ komodo_secrets_local_path }}/secrets.sops.yaml"
        dest: "{{ _komodo_secrets_tmp.path }}/secrets.sops.yaml"
        remote_src: true
        mode: "0600"
      check_mode: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Check for per-host secrets.sops.yaml locally (tolerate missing file)
      ansible.builtin.stat:
        path: "{{ komodo_secrets_local_path }}/resources/hosts/{{ item }}/secrets.sops.yaml"
      loop: "{{ groups['all'] }}"
      register: _komodo_secrets_host_stat
      check_mode: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Copy per-host secrets.sops.yaml files that exist
      ansible.builtin.copy:
        src: "{{ item.stat.path }}"
        dest: "{{ _komodo_secrets_tmp.path }}/host-{{ item.item }}.sops.yaml"
        remote_src: true
        mode: "0600"
      loop: "{{ _komodo_secrets_host_stat.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists
      check_mode: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Decrypt and assemble core.secrets.toml content
      ansible.builtin.shell: |
        set -euo pipefail
        export SOPS_AGE_KEY_FILE="{{ _komodo_secrets_tmp.path }}/age.key"
        echo "# Managed by Ansible (komodo role) -- do not edit manually."
        echo "[secrets]"
        sops -d --output-type json "{{ _komodo_secrets_tmp.path }}/secrets.sops.yaml" \
            | jq -r 'to_entries[] | "\(.key) = \"\(.value)\""'
        for f in "{{ _komodo_secrets_tmp.path }}"/host-*.sops.yaml; do
            [ -f "$f" ] || continue
            host="$(basename "$f" .sops.yaml)"
            host="${host#host-}"
            sops -d --output-type json "$f" \
                | jq -r --arg h "$host" 'to_entries[] | "\($h)_\(.key) = \"\(.value)\""'
        done
      args:
        executable: /bin/bash
      register: _komodo_secrets_toml
      changed_when: false
      check_mode: false
      no_log: true
      delegate_to: localhost
      become: false
      run_once: true

    - name: Read existing secret keys from server
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -f "{{ komodo_deploy_path }}/core.secrets.toml" ]; then
          grep -E '^[A-Za-z_][A-Za-z0-9_]* *=' "{{ komodo_deploy_path }}/core.secrets.toml" \
            | sed 's/ *=.*//' | sort
        fi
      args:
        executable: /bin/bash
      register: _komodo_secrets_old_keys
      changed_when: false
      check_mode: false
      become: true

    - name: Show secret key changes
      vars:
        _old: "{{ _komodo_secrets_old_keys.stdout_lines | default([]) }}"
        _new: "{{ _komodo_secrets_toml.stdout_lines | select('match', '^[A-Za-z_].*=') | map('regex_replace', ' *=.*', '') | sort | list }}"
        _added: "{{ _new | difference(_old) | sort }}"
        _removed: "{{ _old | difference(_new) | sort }}"
        _unchanged_count: "{{ _new | intersect(_old) | length }}"
      ansible.builtin.debug:
        msg: >-
          {%- if (_added | length > 0) or (_removed | length > 0) -%}
          {{ lookup('template', 'secret-key-changes.j2') }}
          {%- else -%}
          All {{ _unchanged_count }} secret keys unchanged
          {%- endif -%}

    - name: Push core.secrets.toml to the Komodo Core host
      ansible.builtin.copy:
        content: "{{ _komodo_secrets_toml.stdout }}\n"
        dest: "{{ komodo_deploy_path }}/core.secrets.toml"
        owner: "{{ docker_user }}"
        group: "{{ docker_user }}"
        mode: "0600"
      become: true
      no_log: true
      register: _komodo_secrets_pushed

    - name: Restart komodo if secrets changed
      community.docker.docker_compose_v2:
        project_src: "{{ komodo_deploy_path }}"
        state: restarted
        remove_orphans: true
      become: true
      when: _komodo_secrets_pushed is changed
      ignore_errors: "{{ ansible_check_mode }}"

  always:
    - name: Remove temp secrets directory from the controller
      ansible.builtin.file:
        path: "{{ _komodo_secrets_tmp.path }}"
        state: absent
      check_mode: false
      delegate_to: localhost
      become: false
      run_once: true
