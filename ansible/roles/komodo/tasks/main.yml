# -- Teardown (disabled) --
- name: Check if deploy directory exists (teardown)
  ansible.builtin.stat:
    path: "{{ komodo_deploy_path }}"
  register: _komodo_dir_teardown
  when: not komodo_enabled

- name: Stop komodo when disabled
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_deploy_path }}"
    state: absent
    remove_orphans: true
  check_mode: false
  when:
    - not komodo_enabled
    - _komodo_dir_teardown.stat.exists

- name: Remove komodo deploy directory when disabled
  ansible.builtin.file:
    path: "{{ komodo_deploy_path }}"
    state: absent
  when: not komodo_enabled

- name: Skip komodo if disabled
  ansible.builtin.meta: end_role
  when: not komodo_enabled

# -- Deploy --
- name: Create deploy directory
  ansible.builtin.file:
    path: "{{ komodo_deploy_path }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create komodo root directory
  ansible.builtin.file:
    path: "{{ komodo_periphery_root }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create backups directory
  ansible.builtin.file:
    path: "{{ komodo_backups_path }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Deploy compose file
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ komodo_deploy_path }}/compose.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  notify: Restart komodo

- name: Deploy environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ komodo_deploy_path }}/.env"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0600"
  no_log: true
  notify: Restart komodo

- name: Provision core.secrets.toml from komodo/ secrets
  ansible.builtin.include_tasks:
    file: secrets.yml
    apply:
      tags: [komodo_secrets]
  tags: [komodo_secrets]

# -- Ensure running --
- name: Ensure komodo is running
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_deploy_path }}"
    state: present
    remove_orphans: true
  ignore_errors: "{{ ansible_check_mode }}"
