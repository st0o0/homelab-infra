- name: Skip if journald persistence disabled
  ansible.builtin.meta: end_role
  when: not journald_enabled

# Without this directory journald keeps the journal in /run (RAM) and loses it on reboot
- name: Ensure persistent journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    mode: "0755"

- name: Deploy persistent journald drop-in
  ansible.builtin.template:
    src: persistent.conf.j2
    dest: /etc/systemd/journald.conf.d/50-persistent.conf
    owner: root
    mode: "0644"
  notify:
    - Restart journald
    - Flush journal to disk
