- name: Disable ufw when disabled
  community.general.ufw:
    state: disabled
  failed_when: false
  when: not ufw_enabled

- name: Skip if ufw disabled
  ansible.builtin.meta: end_role
  when: not ufw_enabled

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure rsyslog routes UFW messages to ufw.log
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/20-ufw.conf
    content: |
      :msg,contains,"[UFW " /var/log/ufw.log
      & stop
    mode: "0644"
  notify: Restart rsyslog

- name: Ensure logrotate reloads rsyslog after rotating ufw.log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/ufw
    content: |
      /var/log/ufw.log {
          daily
          rotate 14
          missingok
          notifempty
          compress
          delaycompress
          create 0640 syslog adm
          postrotate
              invoke-rc.d rsyslog rotate >/dev/null 2>&1 || true
          endscript
      }
    mode: "0644"

- name: Include LXC tasks
  ansible.builtin.include_tasks: lxc.yml
  when: ufw_disable_sysctl

- name: Include standard tasks
  ansible.builtin.include_tasks: standard.yml
  when: not ufw_disable_sysctl
