- name: Disable UFW sysctl
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^IPT_SYSCTL='
    line: 'IPT_SYSCTL=""'

- name: Disable UFW module loading
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^IPT_MODULES='
    line: 'IPT_MODULES=""'

- name: Empty UFW sysctl.conf
  ansible.builtin.copy:
    dest: /etc/ufw/sysctl.conf
    content: ""
    mode: "0644"

- name: Set default incoming policy
  ansible.builtin.command:
    cmd: /usr/sbin/ufw default {{ ufw_default_incoming }} incoming
  register: _ufw_default_in
  changed_when: "'updated' in _ufw_default_in.stdout"

- name: Set default outgoing policy
  ansible.builtin.command:
    cmd: /usr/sbin/ufw default {{ ufw_default_outgoing }} outgoing
  register: _ufw_default_out
  changed_when: "'updated' in _ufw_default_out.stdout"

- name: Apply firewall rules
  ansible.builtin.command:
    cmd: >-
      /usr/sbin/ufw allow proto {{ item.proto | default('tcp') }}
      from any to any port {{ item.port }}
      comment '{{ item.comment | default("") }}'
  loop: "{{ ufw_rules + ufw_extra_rules }}"
  register: _ufw_rules
  changed_when: "'added' in _ufw_rules.stdout"
  failed_when:
    - _ufw_rules.rc != 0
    - "'Skipping' not in _ufw_rules.stdout"

- name: Set logging level
  ansible.builtin.command:
    cmd: /usr/sbin/ufw logging {{ ufw_logging }}
  register: _ufw_logging
  changed_when: "'updated' in _ufw_logging.stdout"

- name: Enable ufw
  ansible.builtin.command:
    cmd: /usr/sbin/ufw --force enable
  register: _ufw_enable
  changed_when: "'active' in _ufw_enable.stdout"
  failed_when:
    - _ufw_enable.rc != 0
    - "'problem running sysctl' not in _ufw_enable.stderr"

# LXC containers lack /dev/kmsg access, so iptables LOG target silently fails.
# Use NFLOG + ulogd2 as fallback: NFLOG sends via netlink, ulogd2 forwards to syslog.
- name: Install ulogd2 for NFLOG-based logging
  ansible.builtin.apt:
    name: ulogd2
    state: present

- name: Configure ulogd2 to forward NFLOG to syslog
  ansible.builtin.copy:
    dest: /etc/ulogd.conf
    content: |
      [global]
      logfile="/var/log/ulogd.log"
      stack=log1:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,sys1:SYSLOG

      [log1]
      group=1

      [sys1]
      facility=LOG_KERN
      level=LOG_WARNING
    mode: "0600"
  notify: Restart ulogd2

- name: Add NFLOG rules to UFW after.rules
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    insertbefore: "^COMMIT"
    marker: "# {mark} ANSIBLE MANAGED - NFLOG logging for LXC"
    block: |
      -A ufw-after-input -m limit --limit 3/min --limit-burst 10 -j NFLOG --nflog-group 1 --nflog-prefix "[UFW BLOCK] "
      -A ufw-after-forward -m limit --limit 3/min --limit-burst 10 -j NFLOG --nflog-group 1 --nflog-prefix "[UFW FORWARD] "
  notify: Reload ufw

- name: Create ulogd2 systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/ulogd2.service.d
    state: directory
    mode: "0755"

- name: Harden ulogd2 with restart-on-failure
  ansible.builtin.copy:
    dest: /etc/systemd/system/ulogd2.service.d/override.conf
    content: |
      [Service]
      Restart=on-failure
      RestartSec=5
    mode: "0644"
  notify: Restart ulogd2

- name: Enable ulogd2 service
  ansible.builtin.service:
    name: ulogd2
    enabled: true
    state: started
    daemon_reload: true
