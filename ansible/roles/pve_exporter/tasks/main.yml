- name: Stop pve-exporter when disabled
  ansible.builtin.service:
    name: pve-exporter
    enabled: false
    state: stopped
  failed_when: false
  when: not pve_exporter_enabled

- name: Remove pve-exporter binary when disabled
  ansible.builtin.file:
    path: /usr/local/bin/pve-exporter
    state: absent
  when: not pve_exporter_enabled

- name: Remove pve-exporter config when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/pve-exporter
    - /etc/systemd/system/pve-exporter.service
  when: not pve_exporter_enabled

- name: Skip if pve-exporter disabled
  ansible.builtin.meta: end_role
  when: not pve_exporter_enabled

- name: Check current pve-exporter version
  ansible.builtin.command:
    cmd: /usr/local/bin/pve-exporter --version
  register: pve_exporter_current_version
  changed_when: false
  failed_when: false

- name: Download pve-exporter binary
  ansible.builtin.get_url:
    url: "https://github.com/bigtcze/pve-exporter/releases/download/v{{ pve_exporter_version }}/pve-exporter-linux-amd64"
    dest: /usr/local/bin/pve-exporter
    mode: "0755"
    owner: root
    group: root
  when: pve_exporter_current_version.rc != 0 or pve_exporter_version not in (pve_exporter_current_version.stdout | default(''))
  notify: Restart pve-exporter

- name: Create pve-exporter config directory
  ansible.builtin.file:
    path: /etc/pve-exporter
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Deploy pve-exporter environment file
  ansible.builtin.template:
    src: pve-exporter.env.j2
    dest: /etc/pve-exporter/pve-exporter.env
    mode: "0600"
    owner: root
    group: root
  notify: Restart pve-exporter

- name: Deploy pve-exporter systemd unit
  ansible.builtin.template:
    src: pve-exporter.service.j2
    dest: /etc/systemd/system/pve-exporter.service
    mode: "0644"
  notify: Restart pve-exporter

- name: Enable and start pve-exporter
  ansible.builtin.service:
    name: pve-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Remove pve-smart-collector cron job when disabled
  ansible.builtin.cron:
    name: "pve-smart-collector"
    state: absent
  when: not pve_exporter_smart_enabled

- name: Skip SMART collector setup when disabled
  ansible.builtin.meta: end_role
  when: not pve_exporter_smart_enabled

- name: Install smartmontools
  ansible.builtin.apt:
    name: smartmontools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create pve-exporter SMART data directory
  ansible.builtin.file:
    path: /var/lib/pve-exporter
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Download pve-smart-collector script
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/bigtcze/pve-exporter/main/scripts/pve-smart-collector.sh"
    dest: /usr/local/bin/pve-smart-collector.sh
    mode: "0755"
    owner: root
    group: root

- name: Schedule pve-smart-collector
  ansible.builtin.cron:
    name: "pve-smart-collector"
    job: "/usr/local/bin/pve-smart-collector.sh"
    minute: "{{ pve_exporter_smart_schedule.split()[0] }}"
    hour: "{{ pve_exporter_smart_schedule.split()[1] }}"
    day: "{{ pve_exporter_smart_schedule.split()[2] }}"
    month: "{{ pve_exporter_smart_schedule.split()[3] }}"
    weekday: "{{ pve_exporter_smart_schedule.split()[4] }}"
    user: root
