ntp_enabled: true
# Use the default gateway (the router) as primary time source, no address stored in the repo
ntp_use_gateway: true
# Fallback sources, used in addition to the gateway
ntp_servers:
  - server: ptbtime1.ptb.de
    prefer: true
  - server: ptbtime2.ptb.de
    prefer: true
  - server: ptbtime3.ptb.de
  - server: ptbtime4.ptb.de
  - server: 0.de.pool.ntp.org
  - server: 1.de.pool.ntp.org
