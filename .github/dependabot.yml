version: 2

updates:
  - package-ecosystem: docker-compose
    directories:
      - /stacks/*
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "chore(deps):"
