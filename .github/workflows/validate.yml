name: Validate Stacks & Komodo

on:
  pull_request:
    paths: ["stacks/**", "komodo/**", "alloy/**"]

permissions:
  contents: read

jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ── YAML ──────────────────────────────────────────────
      - name: YAML lint
        id: yaml
        continue-on-error: true
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
          file_or_dir: stacks/ komodo/

      # ── TOML ──────────────────────────────────────────────
      - name: Setup taplo
        uses: uncenter/setup-taplo@v2
        with:
          version: "0.10.0" # renovate: depName=tamasfe/taplo

      - name: TOML check
        id: toml
        continue-on-error: true
        run: taplo check komodo/**/*.toml

      # ── Docker Compose ────────────────────────────────────
      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: "v5.5.0" # renovate: depName=docker/compose

      - name: Compose validate
        id: compose
        continue-on-error: true
        run: |
          errors=0
          for file in $(find stacks -name 'compose*.yml' | sort); do
            dir="$(dirname "$file")"
            base="$dir/compose.yml"
            if [ "$file" = "$base" ]; then
              args=(-f "$file")
            else
              args=(-f "$base" -f "$file")
            fi
            if docker compose "${args[@]}" config --no-interpolate -q; then
              echo "  ok  $file"
            else
              echo "  FAIL $file"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "$errors compose file(s) failed validation"
            exit 1
          fi
          echo ""
          echo "All compose files valid"

      # ── Alloy ─────────────────────────────────────────────
      - name: Alloy validate (proxy stack)
        id: alloy-proxy
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD/stacks/proxy/alloy:/etc/alloy" \
            -v "$PWD/alloy/modules:/etc/alloy/modules:ro" \
            grafana/alloy:v1.17.1 validate /etc/alloy/

      - name: Alloy validate (generic stack)
        id: alloy-generic
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD/stacks/alloy/alloy:/etc/alloy" \
            -v "$PWD/alloy/modules:/etc/alloy/modules:ro" \
            grafana/alloy:v1.17.1 validate /etc/alloy/

      # ── Summary gate ──────────────────────────────────────
      - name: Check results
        if: always()
        run: |
          rc=0
          [ "$YAML" = "success" ]          && echo "ok: yaml"          || { echo "FAIL: yaml";          rc=1; }
          [ "$TOML" = "success" ]          && echo "ok: toml"          || { echo "FAIL: toml";          rc=1; }
          [ "$COMPOSE" = "success" ]       && echo "ok: compose"       || { echo "FAIL: compose";       rc=1; }
          [ "$ALLOY_PROXY" = "success" ]   && echo "ok: alloy-proxy"   || { echo "FAIL: alloy-proxy";   rc=1; }
          [ "$ALLOY_GENERIC" = "success" ] && echo "ok: alloy-generic" || { echo "FAIL: alloy-generic"; rc=1; }
          exit $rc
        env:
          YAML: ${{ steps.yaml.outcome }}
          TOML: ${{ steps.toml.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          ALLOY_PROXY: ${{ steps.alloy-proxy.outcome }}
          ALLOY_GENERIC: ${{ steps.alloy-generic.outcome }}
