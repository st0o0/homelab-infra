name: Validate Stacks & Komodo

on:
  pull_request:
    paths: ["stacks/**", "komodo/**", "alloy/**"]

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
          file_or_dir: stacks/ komodo/

  toml-check:
    name: TOML Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: uncenter/setup-taplo@v2
        with:
          version: "0.10.0" # renovate: depName=tamasfe/taplo

      - name: Check TOML syntax
        run: taplo check komodo/**/*.toml

  compose-check:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose files
        run: |
          errors=0
          for file in $(find stacks -name 'compose*.yml' | sort); do
            dir="$(dirname "$file")"
            base="$dir/compose.yml"
            if [ "$file" = "$base" ]; then
              args=(-f "$file")
            else
              args=(-f "$base" -f "$file")
            fi
            if docker compose "${args[@]}" config --no-interpolate -q 2>/dev/null; then
              echo "  ok  $file"
            else
              echo "  FAIL $file"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "$errors compose file(s) failed validation"
            exit 1
          fi
          echo ""
          echo "All compose files valid"

  dotenv-lint:
    name: Dotenv Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dotenv-linter
        run: |
          curl -fsSL https://github.com/dotenv-linter/dotenv-linter/releases/download/v4.0.0/dotenv-linter-linux-x86_64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Lint .env files
        run: dotenv-linter --recursive --skip UnorderedKey --skip LowercaseKey stacks/

  alloy-check:
    name: Alloy Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check alloy formatting
        run: |
          docker run --rm -v "$PWD:/work" -w /work grafana/alloy:v1.17.1 fmt --test \
            alloy/ stacks/alloy/alloy/ stacks/proxy/alloy/

      - name: Validate proxy stack config
        run: |
          docker run --rm \
            -v "$PWD/stacks/proxy/alloy:/etc/alloy:ro" \
            -v "$PWD/alloy/modules:/etc/alloy/modules:ro" \
            -v "$PWD/alloy/pipelines:/etc/alloy/pipelines:ro" \
            grafana/alloy:v1.17.1 validate /etc/alloy/

      - name: Validate generic stack config
        run: |
          docker run --rm \
            -v "$PWD/stacks/alloy/alloy:/etc/alloy:ro" \
            -v "$PWD/alloy/modules:/etc/alloy/modules:ro" \
            grafana/alloy:v1.17.1 validate /etc/alloy/
