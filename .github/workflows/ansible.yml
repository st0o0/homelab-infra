name: Ansible Lint & Syntax Check

on:
  pull_request:
    paths: ["ansible/**"]

permissions:
  contents: read

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible and ansible-lint
        run: pip install ansible==14.2.0 ansible-lint==26.6.0

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        run: ansible-lint

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: pip install ansible==14.2.0

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax-check playbooks
        run: ansible-playbook run.yml --syntax-check
