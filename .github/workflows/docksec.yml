name: DockSec Scan

on:
  pull_request:
    paths:
      - '**/Dockerfile*'
      - '**/compose*.yml'
      - '**/compose*.yaml'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: find
        run: |
          matrix='{"include":['
          first=true

          for f in $(find stacks -maxdepth 2 -name 'compose.yml' -o -name 'compose.yaml' | sort); do
            $first || matrix+=','
            matrix+="{\"scan-type\":\"compose\",\"target\":\"$f\"}"
            first=false
          done

          for f in $(find . -name 'Dockerfile*' -not -path './.git/*' | sort); do
            $first || matrix+=','
            matrix+="{\"scan-type\":\"dockerfile\",\"target\":\"$f\"}"
            first=false
          done

          matrix+=']}'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  scan:
    needs: discover
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: read
      security-events: write
    uses: st0o0/github-workflows/.github/workflows/docksec.yml@main
    with:
      scan-type: ${{ matrix.scan-type }}
      target: ${{ matrix.target }}
